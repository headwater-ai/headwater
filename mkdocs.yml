site_name: Headwater

# `.headwater/nav.yml` is generated by `headwater generate` and held by
# `headwater generate --check`. MkDocs's own configuration inheritance folds it
# in, with the generated file as the parent and this file as the child. This
# file declares no `nav:` of its own, so the generated one survives the merge
# and HW-DR-0036's rule that the generated file carries `nav:` alone still
# holds: nothing here restates a nav entry, no hand edit touches the generated
# file, and no third file sits between them.
INHERIT: .headwater/nav.yml

# The corpus root, which is what a generated nav entry's path is relative to.
docs_dir: docs

# Not the MkDocs default of `site`. That directory is the hand-built half of
# the site that HW-DR-0037 governs, `wrangler.jsonc` names it as the asset
# directory with no build command, and Cloudflare deploys it on every push.
# `mkdocs build` cleans `site_dir` before it writes, so the default would
# delete `site/index.html`, `site/ns/index.html`, `site/_headers` and
# `site/DESIGN-BRIEF.md` and exit 0 while doing it. Measured, on a throwaway
# worktree, before this file was written. `.headwater/` is where this corpus's
# other derived artifacts already live, and `site-build` cannot be misread as
# `site/`. The directory is git-ignored and this slice deploys nothing.
site_dir: .headwater/site-build

theme:
  name: mkdocs
  # `mkdocs-overrides/main.html` is the whole of the custom directory, and
  # HW-DR-0038 is why it exists: spec 7 requires that a rendered page carry a
  # link relation to the served copy of the corpus descriptor, and Q38 rules
  # that the relation is `describedby`. Not `overrides/`, because *override* is
  # already this corpus's word for an entry in `.headwater/overlay.yml`.
  #
  # `.headwater/corpus.json` sits outside `docs_dir`, so no build copies it and
  # the CI job puts it beside the built pages instead. A local `mkdocs build`
  # therefore leaves that link dangling. Reproduce what CI serves with one
  # command after the build:
  #
  #   cp .headwater/corpus.json .headwater/site-build/corpus.json
  custom_dir: mkdocs-overrides

# The site builds what the corpus types, and nothing else. This list mirrors
# `.headwater/corpus.json` rather than deciding anything of its own.
#
#   taxonomies/  the corpus descriptor already excludes it, as package content.
#                44 of the documents under it are deliberately defective, so a
#                site that published them would be teaching the wrong thing.
#   doctrine/    `doctrine/maturity-model.md` is on no shelf. A file the corpus
#   w3id/        does not type has no title the projection can label it with
#                and no precedence it can order it by. `w3id/README.md` also
#                describes what the hand-built `site/ns/` already serves.
#   LICENSE      carries no `.md` extension, so MkDocs would copy it as a
#                static asset. The license text belongs to the hand-built half.
#
# None of these is excluded because the gate would otherwise fail. MkDocs 1.6
# reports an unlisted file at `info`, and `--strict` does not fail on one.
exclude_docs: |
  taxonomies/
  doctrine/
  w3id/
  LICENSE

# THE HEADING ANCHOR, AND WHICH OF THE THREE RULES MOVED
#
# This corpus's prose writes in-repo fragment links: `09-decisions.md#q10--naming`.
# Two rules already agree on what that anchor is, and both are GitHub's:
#
#   the prose  — the corpus is read on GitHub today, and every citation
#                resolves there.
#   the engine — `engine/crates/check/src/fragment.rs` derives the same slug,
#                and its comment records that it was settled against GitHub's
#                own `/markdown` endpoint rather than against a second reading
#                of the rule.
#
# Python-Markdown's `toc` was the third rule and the only one that disagreed.
# It collapses a run of separators, so `Q10 — Naming` loses the em dash and
# then folds the two spaces the dash left into one hyphen: `q10-naming`, where
# GitHub and this engine both give `q10--naming`. Measured over the 2577
# headings under `docs/`, that rule disagreed with the engine's on 286 of them
# and `pymdownx.slugs.slugify(case='lower')` disagrees on none.
#
# So the renderer is what moves here, and no source byte does. #431 records the
# reasoning: the links are correct in the repository, and the defect is in the
# projection of it.
#
# `pymdown-extensions` is pinned in the CI step beside `mkdocs==1.6.1`, as
# #431's Done-when requires of any new pip dependency.
markdown_extensions:
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

validation:
  links:
    # Downgraded from the `warn` default, which `--strict` makes fatal. 18
    # links across 10 documents point out of `docs_dir` at files that are
    # correct in the repository and unreachable from a site rooted at `docs/`:
    # `../../CLAUDE.md`, `../../.headwater/overlay.yml`,
    # `../../engine/crates/cli/src/lib.rs` and the rest. Rewriting them to
    # absolute GitHub URLs is refused, because Q31 leaves this repository
    # private and the publication date with the owner (HW-OBL-0130), so those
    # URLs would resolve to 404 for every visitor.
    #
    # This is a trade-off and not an oversight. `not_found: warn` is the reader
    # that #406 records this engine as lacking, and measured against this
    # corpus today it catches zero dead links inside `docs/` — all 18 are
    # cross-boundary citations. So the downgrade costs nothing presently
    # detectable and it costs a future guard. It rises to `warn` when those
    # citations can point at resolvable URLs.
    not_found: info

    # Raised from the MkDocs 1.6 default of `info`, which `--strict` does not
    # fail on. That default is the whole reason #431 stood for three weeks
    # with a green build: 335 links to an anchor no built page carried, each
    # one printed to a log nobody reads, and an exit status of 0 over them.
    #
    # It is raised in the same change that empties the population, and not
    # before, which is the order #431 asks for. A dead anchor now fails the
    # build rather than being reported to nobody.
    #
    # This reads links between source documents. It does not read the theme's
    # own table of contents, the navigation, or the hand-built half of the
    # site, and it never opens the served directory.
    # `tools/check-site-fragments.py` is the reader of that last step, and CI
    # runs both.
    anchors: warn

  nav:
    # Raised from the MkDocs 1.6 default of `info`, for the same reason and in
    # the same order as `links.anchors` above. That default is why ten
    # generated index pages were served and reachable by address while no
    # sidebar named one of them, over a green `--strict` build: ten `info`
    # lines printed to a log nobody reads, and an exit status of 0 over them
    # (#528).
    #
    # It is raised in the same change that empties the population, and not
    # before. Measured over this corpus in both directions: with the nav this
    # branch generates the build exits 0, and with the nav of the commit before
    # it the same build exits 1 and names all ten pages. The guard is therefore
    # live rather than vacuous, and it holds against the eleventh generated
    # page nobody has written yet.
    #
    # This reads which files under `docs_dir` no `nav:` entry names. It says
    # nothing about whether an entry points at a file that is there, which is
    # `nav.not_found`, left at its default.
    omitted_files: warn
