site_name: Headwater

# The origin the generated half is served from, and the one setting that puts
# a canonical URL on a generated page. HW-DR-0048 recorded the absence of this
# line and #556 carries the question it left open.
#
# What it moves here, measured on 2026-09-07 by building the identical tree
# twice and diffing the two outputs: 304 files differ and none is present in
# only one build — 302 of the 303 HTML pages, plus `sitemap.xml` and
# `sitemap.xml.gz`. Aggregating every differing line gives exactly two shapes —
# a `<link rel="canonical" href=…>` added on each of 302 pages, and
# the blank line the template left when `page.canonical_url` was `None`. No
# internal link moved. The base `mkdocs` theme derives `base_url` from page
# depth alone and reads `site_url` in the canonical and sitemap templates and
# nowhere else; the relative-versus-absolute link behavior that this setting is
# often said to control belongs to `mkdocs-material`, which this site does not
# use. `mkdocs build --strict` exits 0 either way, with no new warning.
#
# The MkDocs sitemap now carries 302 `<loc>` elements rather than zero.
# `tools/assemble-site.sh` still overwrites it with the derived one, for the
# reason that script states: the MkDocs sitemap knows only the generated half.
#
# `404.html` is the one generated page that gets no canonical URL, and that is
# structural rather than an oversight, for the same reason the corpus
# descriptor step in `.github/workflows/ci.yml` names: MkDocs renders it from
# the theme's own `404.html`, which extends `base.html`. A reader who arrived
# at a 404 reached no page for a canonical URL to name. The generated half also
# has no root `index.html` — `docs/README.md` does not exist and
# `.headwater/nav.yml` names no root page — so no generated page claims `/`,
# which `site/index.html` serves.
#
# The trailing slash matters. `use_directory_urls` is at its MkDocs default, so
# every generated page is served at a directory URL, and the canonical of
# `spec/12-check-layer/index.html` is `https://headwater.tools/spec/12-check-layer/`.
# The CI step "Every rendered page carries its own canonical URL" asserts that
# each page's canonical equals the URL that page is served at, so a typo in this
# value fails the build rather than being published to a search engine.
site_url: https://headwater.tools/

# `.headwater/nav.yml` is generated by `headwater generate` and held by
# `headwater generate --check`. MkDocs's own configuration inheritance folds it
# in, with the generated file as the parent and this file as the child. This
# file declares no `nav:` of its own, so the generated one survives the merge
# and HW-DR-0036's rule that the generated file carries `nav:` alone still
# holds: nothing here restates a nav entry, no hand edit touches the generated
# file, and no third file sits between them.
INHERIT: .headwater/nav.yml

# The corpus root, which is what a generated nav entry's path is relative to.
docs_dir: docs

# Not the MkDocs default of `site`. That directory is the hand-built half of
# the site that HW-DR-0037 governs, `wrangler.jsonc` names it as the asset
# directory with no build command, and Cloudflare deploys it on every push.
# `mkdocs build` cleans `site_dir` before it writes, so the default would
# delete every file under `site/` — the eight pages, `_headers`, and the
# crawler files among them — and exit 0 while doing it. Measured, on a
# throwaway worktree, before this file was written. `.headwater/` is where this corpus's
# other derived artifacts already live, and `site-build` cannot be misread as
# `site/`. The directory is git-ignored and this slice deploys nothing.
site_dir: .headwater/site-build

theme:
  name: mkdocs
  # HW-DR-0038 is why this directory exists at all: spec 7 requires that a
  # rendered page carry a link relation to the served copy of the corpus
  # descriptor, and Q38 rules that the relation is `describedby`. Not
  # `overrides/`, because *override* is already this corpus's word for an entry
  # in `.headwater/overlay.yml`.
  #
  # It holds four files now, and `main.html` is no longer the whole of it:
  #
  #   main.html      overrides blocks of the theme's `base.html` and never
  #                  replaces it. A hand-written `base.html` here would shadow
  #                  the stock one and silently drop both the canonical URL
  #                  `tools/check-site-canonical.py` asserts on 302 pages and
  #                  the `describedby` link above.
  #   css/headwater.css       the generated half in this site's visual register.
  #   js/leading-digit-anchor-shim.js   #614, loaded before `js/base.js`.
  #   js/darkmode.js          SHADOWS the theme's file of the same path. The
  #                  only file here that replaces one. See its own header.
  #
  # `.headwater/corpus.json` sits outside `docs_dir`, so no build copies it and
  # the CI job puts it beside the built pages instead. A local `mkdocs build`
  # therefore leaves that link dangling. Reproduce what CI serves with one
  # command after the build:
  #
  #   cp .headwater/corpus.json .headwater/site-build/corpus.json
  custom_dir: mkdocs-overrides

  # OFF, AND THE TWO THINGS THAT GO WITH IT
  #
  # HW-OBL-0160 is the record: the stock theme loads highlight.js and two
  # stylesheets from `cdnjs.cloudflare.com` on every generated page, with no
  # subresource integrity, so `script-src` and `style-src` on `/*` had to admit
  # a third party that can change what it serves. Turning this off is that
  # record's own named remedy, and it removes three requests per page.
  #
  # It removes two elements as well, and that is the trap. `base.html` emits
  # `#hljs-light` and `#hljs-dark` only under this flag, and the theme's
  # `js/darkmode.js` dereferences both with no null guard. So this setting and
  # `color_mode: auto` below are safe together only because
  # `mkdocs-overrides/js/darkmode.js` shadows the theme's copy. Measured over
  # the assembled directory with the theme's own file in place: 325 pages with
  # a finding, out of 333 served pages, every one of them `Uncaught TypeError:
  # Cannot set properties of null (setting 'disabled')` at `js/darkmode.js:7`.
  # `mkdocs build --strict`, `tools/assemble-site.sh` and
  # `tools/check-site-fragments.py` each exit 0 over that same tree, and
  # `tools/check-site-console.py` is the only reader that sees it.
  #
  # Fenced code is no longer highlighted anywhere on the generated half. That is
  # the cost, it is paid on purpose, and `tools/check-site-console.py` had one
  # `ALLOWANCES` entry for the CDN highlighter's unknown-language warning whose
  # population is now zero.
  highlightjs: false

  # Not `light`. The visual register this half now links —
  # `tools/site-tokens.css`, ruled by HW-DR-0050 — carries a
  # `prefers-color-scheme: dark` block, and a page pinned to
  # `data-bs-theme="light"` would serve the light tokens to a reader whose
  # system asks for dark. `auto` hands the choice to the reader's system.
  color_mode: auto

  # Left at the theme default of `false`. The toggle it adds is a Bootstrap
  # dropdown in the navbar, and this theme has no navbar to put it in.
  user_color_mode_toggle: false

# The site builds what the corpus types, and nothing else. This list mirrors
# `.headwater/corpus.json` rather than deciding anything of its own.
#
#   taxonomies/  the corpus descriptor already excludes it, as package content.
#                44 of the documents under it are deliberately defective, so a
#                site that published them would be teaching the wrong thing.
#   doctrine/    `doctrine/maturity-model.md` is on no shelf. A file the corpus
#   w3id/        does not type has no title the projection can label it with
#                and no precedence it can order it by. `w3id/README.md` also
#                describes what the hand-built `site/ns/` already serves.
#   LICENSE      carries no `.md` extension, so MkDocs would copy it as a
#                static asset. The license text belongs to the hand-built half.
#
# None of these was excluded because the gate would otherwise fail, and that
# was true of the tree the list was written against: MkDocs 1.6 reports an
# unlisted file at `info`, and `--strict` did not fail on one.
#
# `validation.nav.omitted_files` below now raises that to `warn`, so this list
# is part of the gate whatever it was written for. 374 markdown files sit under
# `docs/`, `.headwater/nav.yml` names 287 of them, and every one of the
# remaining 87 is under a directory named here. Narrowed to `LICENSE` alone,
# the build exits 1 and names `doctrine/maturity-model.md`, `taxonomies/**` and
# `w3id/README.md`. Measured on 2026-09-06.
#
# So a directory added here still has to earn its place on the four reasons
# above, and a directory taken off this list has to reach the nav instead.
exclude_docs: |
  taxonomies/
  doctrine/
  w3id/
  LICENSE

# THE HEADING ANCHOR, AND WHICH OF THE THREE RULES MOVED
#
# This corpus's prose writes in-repo fragment links: `09-decisions.md#q10--naming`.
# Two rules already agree on what that anchor is, and both are GitHub's:
#
#   the prose  — the corpus is read on GitHub today, and every citation
#                resolves there.
#   the engine — `engine/crates/check/src/fragment.rs` derives the same slug,
#                and its comment records that it was settled against GitHub's
#                own `/markdown` endpoint rather than against a second reading
#                of the rule.
#
# Python-Markdown's `toc` was the third rule and the only one that disagreed.
# It collapses a run of separators, so `Q10 — Naming` loses the em dash and
# then folds the two spaces the dash left into one hyphen: `q10-naming`, where
# GitHub and this engine both give `q10--naming`. Measured over the 2577
# headings under `docs/`, that rule disagreed with the engine's on 286 of them
# and `pymdownx.slugs.slugify(case='lower')` disagrees on none.
#
# So the renderer is what moves here, and no source byte does. #431 records the
# reasoning: the links are correct in the repository, and the defect is in the
# projection of it.
#
# `pymdown-extensions` is pinned in the CI step beside `mkdocs==1.6.1`, as
# #431's Done-when requires of any new pip dependency.

# One hook, and the reason it is a hook rather than a copied file.
#
# HW-DR-0050 rules that `tools/site-tokens.css` is the one copy of this site's
# visual register that a person edits. The hand-built half inlines it, because
# `site/_headers` gives those paths `style-src 'unsafe-inline'` with no
# `'self'`. The generated half is served from `/*`, whose policy does carry
# `'self'`, so it links the file instead — and it has to be the same file, not
# a copy, because nothing in this repository would catch a copy drifting:
# `tools/refresh-site-tokens.sh --check` walks `site/` alone.
#
# `mkdocs-hooks/site_tokens.py` registers that file as a generated `File` at
# `css/site-tokens.css`. `hooks:` is a core MkDocs option since 1.4 and this
# repository pins 1.6.1, so this adds no pip dependency and nothing to the two
# places that must stay identical, `.github/workflows/ci.yml` and
# `tools/cloudflare-build.sh`.
hooks:
  - mkdocs-hooks/site_tokens.py

markdown_extensions:
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

validation:
  links:
    # Downgraded from the `warn` default, which `--strict` makes fatal. 18
    # links across 10 documents point out of `docs_dir` at files that are
    # correct in the repository and unreachable from a site rooted at `docs/`:
    # `../../CLAUDE.md`, `../../.headwater/overlay.yml`,
    # `../../engine/crates/cli/src/lib.rs` and the rest. Rewriting them to
    # absolute GitHub URLs is refused, because Q31 leaves this repository
    # private and the publication date with the owner (HW-OBL-0130), so those
    # URLs would resolve to 404 for every visitor.
    #
    # This is a trade-off and not an oversight. `not_found: warn` is the reader
    # that #406 records this engine as lacking, and measured against this
    # corpus today it catches zero dead links inside `docs/` — all 18 are
    # cross-boundary citations. So the downgrade costs nothing presently
    # detectable and it costs a future guard. It rises to `warn` when those
    # citations can point at resolvable URLs.
    not_found: info

    # Raised from the MkDocs 1.6 default of `info`, which `--strict` does not
    # fail on. That default is the whole reason #431 stood for three weeks
    # with a green build: 335 links to an anchor no built page carried, each
    # one printed to a log nobody reads, and an exit status of 0 over them.
    #
    # It is raised in the same change that empties the population, and not
    # before, which is the order #431 asks for. A dead anchor now fails the
    # build rather than being reported to nobody.
    #
    # This reads links between source documents. It does not read the theme's
    # own table of contents, the navigation, or the hand-built half of the
    # site, and it never opens the served directory.
    # `tools/check-site-fragments.py` is the reader of that last step, and CI
    # runs both.
    anchors: warn

  nav:
    # Raised from the MkDocs 1.6 default of `info`, for the same reason and in
    # the same order as `links.anchors` above. That default is why ten
    # generated index pages were served and reachable by address while no
    # sidebar named one of them, over a green `--strict` build: ten `info`
    # lines printed to a log nobody reads, and an exit status of 0 over them
    # (#528).
    #
    # It is raised in the same change that empties the population, and not
    # before. Measured over this corpus in both directions: with the nav this
    # branch generates the build exits 0, and with the nav of the commit before
    # it the same build exits 1 and names all ten pages. The guard is therefore
    # live rather than vacuous, and it holds against the eleventh generated
    # page nobody has written yet.
    #
    # This reads which files under `docs_dir` no `nav:` entry names. It says
    # nothing about whether an entry points at a file that is there, which is
    # `nav.not_found`, left at its default.
    omitted_files: warn
