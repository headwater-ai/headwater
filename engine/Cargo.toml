# SPDX-License-Identifier: Apache-2.0
[workspace]
members = [
    "crates/adapter",
    "crates/census",
    "crates/check",
    "crates/cli",
    "crates/doc",
    "crates/generate",
    "crates/graph",
    "crates/hash",
    "crates/lock",
    "crates/mark",
    "crates/meta",
    "crates/query",
    "crates/ref",
    "crates/resolve",
    "crates/scaffold",
    "crates/sweep",
    "crates/yaml",
]
resolver = "2"

[workspace.package]
# The version this engine reports. `requires_engine` in a package manifest is a
# range over this number, and a range is unreadable without one, so the
# placeholder `0.0.0` that no verb printed became the tag this repository
# published. `headwater_resolve::release::ENGINE` is what reads it.
version = "0.1.0"
edition = "2021"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
