# SPDX-License-Identifier: Apache-2.0
[workspace]
members = [
    "crates/adapter",
    "crates/audit",
    "crates/census",
    "crates/check",
    "crates/compat",
    "crates/cli",
    "crates/conformance",
    "crates/doc",
    "crates/generate",
    "crates/graph",
    "crates/hash",
    "crates/import",
    "crates/lock",
    "crates/mark",
    "crates/meta",
    "crates/probe",
    "crates/query",
    "crates/ref",
    "crates/resolve",
    "crates/scaffold",
    "crates/sweep",
    "crates/verbs",
    "crates/yaml",
]
resolver = "2"

[workspace.package]
# The version this engine reports. `requires_engine` in a package manifest is a
# range over this number, and a range is unreadable without one, so the
# placeholder `0.0.0` that no verb printed became the tag this repository
# published. `headwater_resolve::release::ENGINE` is what reads it.
#
# `v0.1.0` was cut and released before `headwater-compat` lost its own
# `publish = false` override (#748), so the tag whose tree the crates.io
# publish workflow checks out could never carry a working manifest for it.
# A tag is fixed once published — `v0.1.0` already has a GitHub release with
# a binary built from its exact tree — so the fix is a new version rather
# than a moved tag. `v0.1.0` stays as it was cut.
version = "0.1.1"
edition = "2021"

# #735: every member is now free to reach crates.io, once the workflow that
# issue adds runs. `true` is cargo's own default when a manifest names no
# `publish` key at all, so this line does not newly permit anything on its
# own — it is the value `publish.workspace = true` resolves to on every member
# that writes it, restated here so a reader finds one answer rather than
# twenty-three defaults that happen to agree.
publish = true

# The oldest Rust this workspace builds on, declared where a machine reads it.
# Until this line the floor lived in prose in `engine/README.md` and in the
# `rust:<tag>-slim` image its two container commands pin, and neither is a place
# cargo looks. `docs/obligations/0148-…` predicted the consequence and named the
# margin as zero on 2026-08-26. On that same day `ordered-float 5.5.0` entered
# `engine/Cargo.lock` transitively under `saphyr` carrying `rust-version =
# "1.90"`, and both container commands began exiting 101 before compiling a
# line. Nothing noticed for twelve days.
#
# The number is the highest `rust-version` in the resolved graph rather than a
# floor this code needs on its own: a dependency's floor is the workspace's
# floor. `tools/engine-readme-fixtures.sh` compares the two and reddens when the
# lock moves above the pin, which is the reading nothing performed before.
#
# Like `license` below, this key is an inheritance SOURCE and not an inheritance
# rule. A member that omits `rust-version.workspace = true` reports
# `rust_version: null` and answers to no floor at all.
rust-version = "1.90"

# The license, restated where a machine reads it. `LICENSE` at the repository
# root is Apache 2.0, and every source file under `crates/` that is not a test
# fixture opens with `// SPDX-License-Identifier: Apache-2.0`. Cargo requires
# this field on a crate bound for a registry, which every crate here is, and
# this line is what answers that requirement rather than only the header each
# source file carries.
#
# A key here is an inheritance SOURCE and not an inheritance RULE. On its own
# it changes nothing: every member still reports `license: null` to
# `cargo metadata` until that member writes `license.workspace = true`, which
# every crate here now does. The pair is self-guarding in one direction —
# delete this line and every cargo command fails with
# `error inheriting 'license' from workspace root manifest`, before it compiles
# anything. The other direction, a crate added later that forgets the member
# line, is what `tools/build-declaration-fixtures.sh` holds, along with the
# SPDX headers the sentence above claims.
license = "Apache-2.0"

# Where a registry sends a reader who wants the source behind a published
# crate. crates.io shows this on every crate's page once #735 publishes one,
# and it costs nothing before that.
repository = "https://github.com/headwater-ai/headwater"

# Every internal dependency, declared once here rather than once per line that
# names it. #735 is why this exists: a path alone is not something a published
# crate can depend on, so each of the 23 needs a version cargo can resolve
# through the registry once the crate it names is itself published, and a
# version repeated at each of the ~120 lines that named a path before this one
# is 120 places a bump has to agree, not one. A member's own `[dependencies]`
# now reads `headwater-x = { workspace = true }`, and the path and the version
# both live here, once, for the same reason `version`, `edition`, `license`,
# `rust-version` and `publish` already live in `[workspace.package]` above.
#
# The version is the same literal as `[workspace.package] version` above,
# because every member of this workspace has always moved as one number; nothing
# here reads that field to derive this one, so a bump has both to change.
[workspace.dependencies]
headwater-adapter = { path = "crates/adapter", version = "0.1.0" }
headwater-audit = { path = "crates/audit", version = "0.1.0" }
headwater-census = { path = "crates/census", version = "0.1.0" }
headwater-check = { path = "crates/check", version = "0.1.0" }
headwater-compat = { path = "crates/compat", version = "0.1.0" }
headwater-conformance = { path = "crates/conformance", version = "0.1.0" }
headwater-doc = { path = "crates/doc", version = "0.1.0" }
headwater-generate = { path = "crates/generate", version = "0.1.0" }
headwater-graph = { path = "crates/graph", version = "0.1.0" }
headwater-hash = { path = "crates/hash", version = "0.1.0" }
headwater-import = { path = "crates/import", version = "0.1.0" }
headwater-lock = { path = "crates/lock", version = "0.1.0" }
headwater-mark = { path = "crates/mark", version = "0.1.0" }
headwater-meta = { path = "crates/meta", version = "0.1.0" }
headwater-probe = { path = "crates/probe", version = "0.1.0" }
headwater-query = { path = "crates/query", version = "0.1.0" }
headwater-ref = { path = "crates/ref", version = "0.1.0" }
headwater-resolve = { path = "crates/resolve", version = "0.1.0" }
headwater-scaffold = { path = "crates/scaffold", version = "0.1.0" }
headwater-sweep = { path = "crates/sweep", version = "0.1.0" }
headwater-verbs = { path = "crates/verbs", version = "0.1.0" }
headwater-yaml = { path = "crates/yaml", version = "0.1.0" }

# The lint floor. Every crate inherits it with `[lints] workspace = true`, so a
# rule is declared once here rather than repeated in twenty-two manifests or
# remembered by whoever writes the next crate.
#
# CI runs `cargo clippy --all-targets -- -D warnings`, so a lint named here at
# any level fails the build. That is why the set is chosen by measurement: each
# entry was at zero hits when it was added, or its hits were fixed in the same
# change. A lint that would need a rewrite is left out, and Q23 records which
# ones and why.
[workspace.lints.rust]
# The engine has no `unsafe` block and no reason to acquire one: it reads files,
# builds a graph and writes text. `forbid` rather than `deny` because the point
# is that no module can re-admit it with a local `#[allow]`.
unsafe_code = "forbid"

# A `pub` item that no path exports is a public surface nothing can reach. The
# crates here are libraries that the CLI consumes, so the distinction between
# what a crate offers and what it merely failed to hide is the one this lint
# keeps honest.
unreachable_pub = "deny"

# `trivial_casts` is not here. `crates/check/src/register.rs` casts the first
# closure of an array to `fn(String) -> Promotion` so that the remaining
# elements coerce to one type, and the lint reads a coercion the array needs as
# a redundant one. The alternative is an `#[allow]` on a correct line.
trivial_numeric_casts = "deny"
unused_lifetimes = "deny"
variant_size_differences = "deny"

[workspace.lints.clippy]
# A stub that reached main. `headwater check` exits 0 with findings, so a verb
# that panicked on a `todo!` would read as an engine defect rather than as
# unfinished work.
todo = "deny"
unimplemented = "deny"

# Debugging left in place. `dbg!` writes to standard error, which is where
# `--fix` reports what it wrote, so a stray one lands in the middle of output a
# person is meant to read.
dbg_macro = "deny"

# `process::exit` skips every destructor and every buffered write. The CLI is a
# shell over libraries that return values, and it has never needed this.
exit = "deny"

# Correctness, and each was at zero on the run that added it.
mem_forget = "deny"
lossy_float_literal = "deny"
filetype_is_file = "deny"
rc_buffer = "deny"

# Three correctness lints were measured and left out, because CI reads tests with
# `--all-targets` and each one reports correct code there. `unwrap_in_result`
# reports the four `read` helpers of a `#[cfg(test)]` module, where an `expect`
# on a fixture is the intent. `verbose_file_reads` reports
# `crates/scaffold/src/tree.rs`, which keeps the handle it read from in order to
# write through it, so `fs::read_to_string` would lose the thing the function
# returns. `float_cmp` reports an `assert_eq!` against `0.0` that is exact
# because the numerator is zero.

# One idiom per thing, so that a reader who learned a pattern in one crate
# meets the same pattern in the next. `cargo clippy --fix` wrote the corrections
# for the lints it can apply mechanically, and the `let ... else` rewrites were
# taken by hand.
semicolon_if_nothing_returned = "deny"
explicit_iter_loop = "deny"
manual_let_else = "deny"
manual_assert_eq = "deny"
implicit_clone = "deny"
stable_sort_primitive = "deny"
uninlined_format_args = "deny"
single_char_pattern = "deny"
needless_raw_string_hashes = "deny"

# `assigning_clones` is not here. Its correction is `clone_from`, which trades a
# readable assignment for a method that saves an allocation this engine does not
# count, in ten places that read correctly today.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# `cargo build --profile dev-release`. The shipped binary above pays for `lto`
# and `codegen-units = 1` with a link that runs minutes and a load spike an
# 8-core machine feels (see the build-order ledger's saturation lesson). This
# profile is for a session that wants to run the real CLI a few times without
# that cost, and never for CI or a release artifact: it inherits `release`'s
# `opt-level` and drops only the two settings LTO and single-codegen-unit
# controls, so the binary is close to release speed and far cheaper to link.
[profile.dev-release]
inherits = "release"
lto = false
codegen-units = 16
strip = false
