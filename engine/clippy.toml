# The oldest Rust this workspace builds on.
#
# `engine/Cargo.toml` declares the same number as `rust-version` under
# `[workspace.package]`, which is the copy cargo reads; this is the copy clippy
# reads, and `tools/engine/engine-readme-fixtures.sh` holds the two to each other and
# to the image the container commands pin.
#
# A floor here is not decoration. Before there was one, clippy suggested APIs
# the floor did not have: `chunks_exact_to_as_chunks` fired twice on
# `crates/hash/src/lib.rs` and pointed at `slice::as_chunks`, stable in 1.88 and
# not in the 1.85 the floor then was. `-D warnings` turned that into a build
# failure on `main` itself, on every branch off it, before `cargo test` ran.
# Raising this number admits every API stabilized under it, so a raise is a
# clippy run and not a one-line edit.
msrv = "1.90"
