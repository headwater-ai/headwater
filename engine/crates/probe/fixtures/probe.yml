# SPDX-License-Identifier: Apache-2.0
#
# The envelope the fixture plans are projected against. The regression ceiling
# clears the fixture selection and the campaign ceiling does not, so one file
# holds both arms of the budget rule.
#
# The documentation tier's ablation names `corpus/probes`, the fixture corpus's own
# directory, so every probe whose predicate names a document examines a path
# its own absent arm removes. The campaign tier's ablation does not, so one
# file holds both arms of the ablation rule.
#
# The regression tier declares a turn cap and the other two do not, so the
# recorded regression plan holds the line that prints it (#1384).

tiers:
  regression:
    budget_cents: 2000
    session_cost_cents: 25
    repetitions: 1
    max_turns: 12
    arms: [present]

  campaign:
    budget_cents: 100
    session_cost_cents: 25
    repetitions: 58
    arms: [present, absent]
    ablation: [CLAUDE.md, .claude, .githooks, .headwater]

  documentation:
    budget_cents: 100
    session_cost_cents: 25
    repetitions: 58
    arms: [present, absent]
    ablation: [CLAUDE.md, .claude, .githooks, .headwater, corpus/probes]
