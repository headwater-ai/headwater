# SPDX-License-Identifier: Apache-2.0
[package]
name = "headwater-probe"
description = "The parts of the probe harness that are deterministic. probe is the one verb that reaches the network, so it never runs inside check and never gates"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# The dependency direction is the whole argument that a probe cannot gate, and
# it is the argument `headwater-sweep` already makes.
#
# This crate names `headwater-check`, so `headwater-check` can never name this
# one: the compiler refuses the cycle. A rule therefore cannot read a probe, a
# run cannot carry one, and `check --strict` cannot see one. The `patched`
# expectation is what makes the dependency real rather than a device — a probe
# that names an oracle reads the rule set of this engine, and a probe that names
# a rule this engine does not carry stops the run.
#
# There is no HTTP crate here and there is none anywhere in this workspace.
# Every dependency below is a path dependency inside it.
[dependencies]
# The rule set, which the `patched` expectation names an oracle from.
headwater-check = { workspace = true }

# The classification. A probe is a classified document of this corpus or it is
# not a probe, and the same test decides what a transcript may name.
headwater-census = { workspace = true }

# The parse the census took. A probe declares its closed answer set in a fenced
# block under the section its kind requires, and reading it from the parse
# rather than from the file again is what keeps one account of the corpus.
headwater-doc = { workspace = true }

# The declared half. `examines` is what names the documents an `opened`,
# `not_opened` or `cited` expectation is a predicate over, so the expectation
# targets are graph edges rather than a second list in a body.
headwater-graph = { workspace = true }

# The one implementation of the digest function. A run identity names a tree and
# a selection, and a digest taken by another rule than the census would name a
# state no run was taken over.
headwater-hash = { workspace = true }

# The loader for the budget declaration and for what a transcript holds. One
# dialect, one parser, one set of spans in a refusal.
headwater-yaml = { workspace = true }

# The engine's own release number, named once so a grader and a harness report
# the same number a `requires_engine` range reads, rather than each reading
# its own crate's manifest version.
headwater-resolve = { workspace = true }

[lints]
workspace = true
