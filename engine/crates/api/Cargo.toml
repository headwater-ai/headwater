# SPDX-License-Identifier: Apache-2.0
[package]
name = "headwater-api"
description = "One load of a corpus as a value, which the headwater binary and every in-process caller share. No clap and no network"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# Spec 6: "The CLI is a thin shell over a library API." This crate is the
# library that `headwater-cli` and an in-process caller both link. It names no
# `clap`, so a caller does not parse a command line to load a corpus, and no
# `headwater-fetch`, so a load opens no socket. `tests/network_boundary.rs` in
# `headwater-cli` reads `Cargo.lock` and holds the second of the two.
[dependencies]
headwater-census = { workspace = true }
headwater-check = { workspace = true }
headwater-generate = { workspace = true }
headwater-graph = { workspace = true }
headwater-lock = { workspace = true }
headwater-probe = { workspace = true }
headwater-query = { workspace = true }
headwater-resolve = { workspace = true }
# The projection plan names the command surface, because the verb index is
# one of its outputs. A crate with no dependencies of its own.
headwater-verbs = { workspace = true }
headwater-yaml = { workspace = true }

[lints]
workspace = true
