# SPDX-License-Identifier: Apache-2.0
[package]
name = "headwater-adapter"
description = "One run of the check layer in the vocabulary a CI platform reads: annotations, check runs, job summaries and review comments"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# The run is what an adapter translates: its findings, the two escape
# inventories beside them, the register and the read set. Nothing here reads a
# file and nothing here runs a check, and the dependency points one way for
# that reason.
headwater-check = { workspace = true }

# The JSON writer, which sits beside the JSON reader. `headwater-yaml` owns
# both, because three crates emit JSON and a writer in any one of them would be
# a dependency the other two take on a crate they need for nothing else.
headwater-yaml = { workspace = true }

# The census and the graph, which the text format writes and the other three do
# not. A coverage number with no denominator beside it is what the text report
# exists to prevent, and these two are that denominator.
headwater-census = { workspace = true }
headwater-graph = { workspace = true }

[dev-dependencies]
# The suite runs the whole pipeline over the check crate's fixture tree, so it
# needs what a run needs. It reads that tree rather than growing a second one:
# see the suite's own comment for why.
headwater-hash = { workspace = true }

[lints]
workspace = true
