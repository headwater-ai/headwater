# SPDX-License-Identifier: Apache-2.0
#
# The taxonomy that `tests/opening_state.rs` scaffolds against. Three kinds
# open at three states through three regimes. Three relations are declared.
#
# `elaborates` requires both ends. A new document owes its far half at
# promotion only when it opens at a state whose role is `initial`
# (HW-DR-0086), so the far half is owed for one kind and written for the
# other two.
#
# `supersedes` also requires both ends and declares a state for its target.
# The scaffold writes the far half as `elaborates` does, and it writes no
# state onto the target at any opening state (HW-DR-0104).
#
# `pairs_with` is symmetric. The scaffold writes no far half for it at any
# opening state, because one half states a symmetric edge (HW-DR-0104).
#
# `proposed` carries no role at all. A reading that deferred on anything but a
# live state, or on anything but a terminal one, would defer it or `current`,
# and the test holds each case apart.

facets:
  status:
    role: state
    required: true
    volatility: mutable
    values:
      - {value: draft, role: initial}
      - {value: proposed}
      - {value: current, role: live}
      - {value: superseded, role: terminal-retained}
  status_since:
    role: state_entered
    type: date
    required: true
    volatility: mutable
  summary:
    role: scent
    type: string
    required: true
    volatility: mutable

regimes:
  lifecycle:
    opens_draft:
      initial: draft
      transitions: {draft: [current], current: [superseded]}
      retain_terminal: true
    opens_proposed:
      initial: proposed
      transitions: {proposed: [current], current: [superseded]}
      retain_terminal: true
    opens_current:
      initial: current
      transitions: {current: [superseded]}
      retain_terminal: true

identifier_schemes:
  note_id: {pattern: "NOTE-{namespace}-{slug}", namespace: FIX, allocation: minted-once}

kinds:
  governed_document:
    abstract: true
    facets: {require: [status, status_since, summary]}
  at_draft:
    is_a: governed_document
    identifier: {scheme: note_id}
    lifecycle: opens_draft
  at_proposed:
    is_a: governed_document
    identifier: {scheme: note_id}
    lifecycle: opens_proposed
  at_current:
    is_a: governed_document
    identifier: {scheme: note_id}
    lifecycle: opens_current

shelves:
  drafts:
    path: opening-state/drafts/**
    homogeneous: true
    kind: at_draft
  proposals:
    path: opening-state/proposals/**
    homogeneous: true
    kind: at_proposed
  currents:
    path: opening-state/currents/**
    homogeneous: true
    kind: at_current

relations:
  elaborates:
    family: association
    from: [governed_document]
    to:   [governed_document]
    inverse: elaborated_by
    reciprocal: required
    nuclearity: multinuclear
    created_by: scaffold
  supersedes:
    family: succession
    from: [governed_document]
    to:   [governed_document]
    inverse: superseded_by
    reciprocal: required
    nuclearity: multinuclear
    on_target: {set_state: superseded}
    created_by: scaffold
  pairs_with:
    family: association
    from: [governed_document]
    to:   [governed_document]
    reciprocal: symmetric
    nuclearity: multinuclear
    created_by: scaffold
