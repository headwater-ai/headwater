# SPDX-License-Identifier: Apache-2.0
[package]
name = "headwater-doc"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Front matter is YAML, so it loads through the loader rather than through a
# second tree builder. Q2's dialect rules reach a document by that route.
headwater-yaml = { path = "../yaml" }

# A CommonMark parser with a byte range on every event. The range is the whole
# reason for the dependency: spec 12 needs a finding to anchor to a line, and a
# scan that recognized headings by regular expression would report a heading
# inside a fenced code block.
pulldown-cmark = { version = "0.13", default-features = false }

[lints]
workspace = true
