[package]
name = "headwater-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "headwater"
path = "src/main.rs"

# Spec 6: "The CLI is a thin shell over a library API." Everything below is a
# library that an editor, the MCP server or a CI adapter consumes directly, and
# none of them starts this binary and parses its text.
[dependencies]
# The sampler, which is not a check and is a separate crate for that reason.
# Nothing in `headwater-check` names it, so no rule can read a sweep finding
# and `--strict` can never see one.
headwater-sweep = { path = "../sweep" }

# The CI adapters. `check --format` is the one caller, and the dependency
# points this way so that nothing in the engine below can reach a forge.
headwater-adapter = { path = "../adapter" }

headwater-census = { path = "../census" }
headwater-check = { path = "../check" }
headwater-generate = { path = "../generate" }
headwater-graph = { path = "../graph" }

# `headwater import`. Every refusal is decided in the library, so the verb is a
# shell and the fixture set that proves the correctness root runs without it.
headwater-import = { path = "../import" }

# The one implementation of the digest function. `gate` re-hashes each input a
# read set lists, and a gate that hashed by another rule than the census would
# report that every file in the tree had moved.
headwater-hash = { path = "../hash" }
headwater-lock = { path = "../lock" }
headwater-query = { path = "../query" }
headwater-resolve = { path = "../resolve" }

# `headwater new`. The verb is a shell over this, and every refusal, every
# derived value and the assisted count are decided in the library.
headwater-scaffold = { path = "../scaffold" }

# `headwater infer` builds an adoption payload as text and loads it back before
# it goes into the lock, so what the verb prints and what it stores are one
# artifact that went through one reader.
headwater-yaml = { path = "../yaml" }
