#
# The envelope this fixture corpus is planned against. No test here turns on a
# ceiling: the plan over this corpus stops on the second probe, which is a
# refusal about a declaration and never about cost. The file is here because
# `probe grade` and `generate` both refuse a corpus that declares no envelope,
# and a refusal about a missing file would stand in for the refusal under test.

tiers:
  regression:
    budget_cents: 2000
    session_cost_cents: 25
    repetitions: 1
    arms: [present]

  campaign:
    budget_cents: 2000
    session_cost_cents: 25
    repetitions: 4
    arms: [present, absent]
