# SPDX-License-Identifier: Apache-2.0
#
# The taxonomy the sweep fixture corpus is read against.
#
# It is deliberately not the check crate's fixture taxonomy, and the reason is
# one relation. A sweep refuses a finding that restates an edge the graph
# already declares, so the corpus under it has to be able to declare
# `conflicts_with` and `supersedes` — the two relations spec 4 names as the
# outcome a sweep is for. Neither is in a taxonomy written to exercise the
# check layer, and adding them there would move that crate's recorded report
# for a reason that has nothing to do with a check.
#
# Everything else here is the smallest shape that types a document: one shelf,
# one concrete kind with a section contract, and the three facets that kind
# requires.

facets:
  status:
    role: state
    required: true
    values:
      - {value: draft, role: initial}
      - {value: current, role: live}
      - {value: superseded, role: terminal-retained}

  status_since:
    role: state_entered
    required: true

  summary:
    role: scent
    required: true

  doc_type:
    volatility: stable

regimes:
  voice:
    guarded: {forbid: [hedging]}
  language:
    # A profile this engine does not implement, so the language instances skip
    # by name rather than reporting prose in a fixture that is about something
    # else. What this corpus is a fixture for is a sweep, and a sweep is the
    # mechanism for what no lexical rule reads.
    ste_strict: {tag: en-US, controlled: ASD-STE100, profile: strict}

identifier_schemes:
  decision_id: {pattern: "DR-{namespace}-{seq:04d}", namespace: SWP, allocation: reconcile-first}

kinds:
  governed_document:
    abstract: true
    facets: {require: [status, status_since, summary]}

  # A kind no shelf assigns, so no document of this tree carries it. It is here
  # to be the end of `annotates` below: an endpoint set that admits nothing in
  # this corpus is what a refused proposal needs.
  note:
    is_a: governed_document
    abstract: true

  decision_record:
    is_a: governed_document
    identifier: {scheme: decision_id}
    voice: guarded
    language: ste_strict
    sections: {require: [Context, Decision]}

shelves:
  decisions:
    path: corpus/**
    homogeneous: true
    kind: decision_record

relations:
  # No inverse name, because the relation is its own. What this fixture needs
  # from it is two things: an edge the graph carries, so that a sweep finding
  # restating it is refused, and a relation that is its own inverse, so that a
  # finding restating that edge backwards is refused too.
  conflicts_with:
    family: decision
    from: [governed_document]
    to:   [governed_document]
    reciprocal: symmetric

  # The one relation of this fixture that a proposal can reach in both
  # directions, and the reason it says `required`.
  #
  # `reciprocal: required` makes a pair complete only when a document at each
  # end declared it, so front matter that carries one half alone is what
  # `relation.reciprocity.missing` reports as an error. A sweep prints front
  # matter for a person to paste, so the printed instruction has to carry both
  # halves or the paste turns a passing corpus into a refused commit. Both ends
  # admit `governed_document`, so a proposal reaches it under `supersedes` and
  # under `superseded_by` alike, and the owed name differs between the two.
  # `tests/fixtures.rs` pastes what the report prints and runs this check layer
  # over the result.
  supersedes:
    family: decision
    from: [governed_document]
    to:   [governed_document]
    inverse: superseded_by
    reciprocal: required

  # An asymmetric relation with an inverse name, and the only relation here
  # whose two ends differ. Its `from` end admits `note`, which no document of
  # this corpus is, so a proposal that puts a decision record there is refused.
  # Written under `annotated_by` the two ends swap, and the refusal has to name
  # the other end. That pair is what holds the direction the intake reads.
  #
  # It says `required` as well, so the reciprocity check instantiates over two
  # relations here rather than one. No document of this corpus can sit at its
  # `from` end, so no proposal under either of its names survives the endpoint
  # test and no case below pastes one. `supersedes` is what carries the round
  # trip in both directions.
  annotates:
    family: decision
    from: [note]
    to:   [decision_record]
    inverse: annotated_by
    reciprocal: required

  # A relation that declares no reciprocity at all, which is the third answer
  # the printer has to give. `conflicts_with` above is symmetric and this one is
  # absent, and both must render one block and one path. Without a relation of
  # each shape, a printer that appended a second block to every proposal would
  # pass every case that pastes one.
  records:
    family: decision
    from: [governed_document]
    to:   [governed_document]

obligations:
  OB-SWP-1:
    statement: Two current documents do not contradict each other in silence
    rationale: A contradiction nobody declared is one every reader has to rediscover
    class: coherence
    prevents: content.inconsistent
    severity: medium

# One control, and it is here to be measured rather than to be copied. Its
# mechanism carries a prefix this engine does not read, so the register calls it
# external and the obligation above reads `verified` with nothing having run.
# `tests/fixtures.rs` asserts exactly that, and
# `docs/obligations/0114-…` is the record of it.
controls:
  CT-SWP-1:
    mechanism: sweep:undeclared_conflict
    discharges: [OB-SWP-1]
    trigger: scheduled
    posture: advisory
    acts: detective
