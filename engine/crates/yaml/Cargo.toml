[package]
name = "headwater-yaml"
description = "Reads a taxonomy source as YAML 1.2, on the Q2 dialect rules, and keeps a span on every node"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# An event stream with a span per event, and nothing else. Q2 rules out a
# deserializer: spec 12 needs a span on every key, and no convenient
# `Deserialize` implementation supplies one.
saphyr-parser = "0.0.11"

[lints]
workspace = true
