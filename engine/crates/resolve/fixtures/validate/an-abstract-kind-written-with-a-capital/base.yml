# SPDX-License-Identifier: Apache-2.0
#
# `valid/base.yml` with one character changed: `abstract: True` rather than
# `abstract: true`. The core schema resolves `true`, `True` and `TRUE` to the
# same boolean and the meta-schema validates this member with that function, so
# this taxonomy is the valid one and the record beside it says `valid`.
#
# The reading this case holds out compared the text of the scalar. Under that
# reading `governed_document` is concrete, and the record fills with four
# inheritance failures and one purpose failure, none of which names `abstract`.
# So this is the only case in the directory whose expectation is a pass, and the
# defect it holds out is a wrong diagnosis rather than a silent weakening.

taxonomy: acme/fixture
version: 1.0.0

purposes:
  rationale: {intent: explain why a choice was made and what it forecloses}

vocabularies:
  lifecycle_state:
    - {value: draft,      role: initial}
    - {value: current,    role: live}
    - {value: superseded, role: terminal-retained}

facets:
  status:
    role: state
    values: $vocabularies.lifecycle_state
    required: true
    volatility: mutable
    guidance:
      draft: it is being argued over, and nothing may rely on it
      current: it states what holds now
      superseded: a later decision replaced it
  sequence:
    type: integer
    required: true
    volatility: stable

regimes:
  lifecycle:
    standard:
      initial: draft
      transitions: {draft: [current], current: [superseded]}
      retain_terminal: true

kinds:
  governed_document:
    abstract: True
    facets: {require: [status]}
  decision:
    is_a: governed_document
    purpose: rationale
    lifecycle: standard
    facets: {require: [sequence]}

relations:
  supersedes:
    family: succession
    from: [decision]
    to: [decision]
    reciprocal: required
    on_target: {set_state: superseded}
    created_by: scaffold

shelves:
  decisions:
    path: docs/decisions/**
    homogeneous: true
    kind: decision
    layout: "{sequence:02d}-{slug}.md"

core:
  requires:
    - facet_role: state
