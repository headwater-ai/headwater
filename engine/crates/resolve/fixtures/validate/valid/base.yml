# SPDX-License-Identifier: Apache-2.0
#
# The taxonomy that every case in this directory is a mutation of. It passes
# every rule of `taxonomy validate`, which is the other half of what spec 12
# asks for: "every check ships with at least one fixture that it fails and one
# that it passes."
#
# It is deliberately the smallest taxonomy that passes rather than the smallest
# that resolves. The difference between the two is the whole of this directory.
#
# The expectation on `decision` declares no `to_kind`. That is the passing side
# of an optional member: the meta-schema admits the omission, and every
# expectation well-formedness rule that does not read `to_kind` still runs. An
# expectation with no `to_kind` is satisfied by any kind the named relation
# admits at its target end.

taxonomy: acme/fixture
version: 1.0.0

purposes:
  rationale: {intent: explain why a choice was made and what it forecloses}

vocabularies:
  lifecycle_state:
    - {value: draft,      role: initial}
    - {value: current,    role: live}
    - {value: superseded, role: terminal-retained}

facets:
  status:
    role: state
    values: $vocabularies.lifecycle_state
    required: true
    volatility: mutable
    guidance:
      draft: it is being argued over, and nothing may rely on it
      current: it states what holds now
      superseded: a later decision replaced it
  sequence:
    type: integer
    required: true
    volatility: stable
  status_since:
    role: state_entered
    type: date
    required: true
    volatility: mutable

regimes:
  lifecycle:
    standard:
      initial: draft
      transitions: {draft: [current], current: [superseded]}
      retain_terminal: true

kinds:
  governed_document:
    abstract: true
    facets: {require: [status]}
  decision:
    is_a: governed_document
    purpose: rationale
    lifecycle: standard
    facets: {require: [sequence, status_since]}
    relations:
      expect:
        - id: decision-superseded
          relation: supersedes
          within: 180d
          since: state_entered
          rationale: an expectation that names no target kind is satisfied by any kind the relation admits at its target end

relations:
  supersedes:
    family: succession
    from: [decision]
    to: [decision]
    reciprocal: required
    on_target: {set_state: superseded}
    created_by: scaffold

shelves:
  decisions:
    path: docs/decisions/**
    homogeneous: true
    kind: decision
    layout: "{sequence:02d}-{slug}.md"

core:
  requires:
    - facet_role: state
