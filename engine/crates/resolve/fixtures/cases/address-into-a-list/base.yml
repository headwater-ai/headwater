taxonomy: headwater/standard
version: 1.0.0

purposes:
  rationale: {intent: explain why a choice was made and what it forecloses}

regimes:
  lifecycle:
    standard:
      initial: draft
      transitions: {draft: [current, deprecated], current: [superseded]}

kinds:
  decision: {purpose: rationale, lifecycle: standard}

core:
  requires:
    - purpose: rationale
