#
# The taxonomy the fixture tree is typed and wired by. It is not this
# repository's taxonomy, and it is not a proposal: every declaration here exists
# to put one resolution case in front of the graph build.

kinds:
  governed_document: {abstract: true}
  design_spec: {is_a: governed_document}
  evaluation: {is_a: governed_document}

shelves:
  spec_series:
    path: graph/spec/**
    homogeneous: false
    discriminator: doc_type
    kinds: [design_spec]
  evaluations:
    path: graph/evaluations/**
    homogeneous: true
    kind: evaluation

relations:
  # A relation whose targets are documents and nothing else, with an inverse
  # that a document may write instead.
  cites_evidence:
    family: evidence
    from: [design_spec]
    to:   [evaluation]
    inverse: cited_by
    reciprocal: required
    cardinality: many
    created_by: author

  # A relation whose targets are anchors and nothing else.
  governs:
    family: governance
    from: [design_spec]
    to:   [code_path]
    cardinality: many

  # A relation that admits both, which is the case that makes the order of
  # resolution matter.
  traces_to:
    family: evidence
    from: [design_spec]
    to:   [governed_document, code_path]

  # A relation whose anchor kind names a resolver that this run does not have.
  # It is also the one relation here that an importer may write, which is what
  # makes the two values of `created_by` comparable over one built graph.
  audited_by:
    family: evidence
    from: [design_spec]
    to:   [ado_work_item]
    created_by: import

anchors:
  code_path:     {resolver: source-tree}
  ado_work_item: {resolver: ado-snapshot}
