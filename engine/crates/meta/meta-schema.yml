# SPDX-License-Identifier: Apache-2.0
#
# The meta-schema of the taxonomy language, expressed in the dialect it
# describes. Spec 2 (The meta-schema) is the prose; this file is that prose as
# data, and `headwater-meta` is the reader of this file.
#
# It is YAML 1.2 on the Q2 loader rulings, exactly as a taxonomy source is: the
# core schema, no anchors, no aliases, no merge keys, no explicit tags, and a
# duplicate key is an error. Nothing here is JSON Schema, because Q2 rules that
# JSON Schema is an emitted export and never the validator.
#
# ## The shape language
#
# A shape is a mapping that carries exactly one form key:
#
#   scalar: <type>    one of string, integer, boolean, date, duration, null
#   enum: [ ... ]     a closed value set
#   seq: <shape>      a sequence, every item of that shape
#   map: <shape>      an open mapping; every key is an address segment
#   members: {...}    a closed mapping, one shape per declared member
#   block: <name>     a shape declared once under `definitions`
#   one_of: [ ... ]   the first alternative that accepts the node
#   free: <reason>    a node the meta-schema does not constrain, and why
#
# and two modifiers:
#
#   required: true       the member must be present (the default is false)
#   reference: allowed   a `$`-reference may stand here (the default refuses one)
#
# `free` is the honest form of a gap. Every use carries the reason, so a reader
# can count what the specification has not yet given a shape, and spec 13
# carries each one.
#
# ## Two markers in the comments
#
# `guess:` marks a value set that this file closes and the specification does
# not state. Q2 settles the direction: a rule relaxes later at no cost and
# cannot be added later without a finding against every source that already
# used the form.
#
# `gap:` marks a surface the specification requires and gives no form.

meta_schema: headwater/taxonomy
# 0.2.0 relaxes `identifier_scheme.namespace` from required to optional. Every
# source that validated under 0.1.0 validates under this one, so it is a minor.
#
# 0.3.0 removes `lifecycle_regime.terminal`, and it is not a minor. A source
# that wrote the member validated under 0.2.0 and is refused here by name,
# because `members` is a closed set. No package of this repository wrote it and
# one fixture did.
#
# No consumer compares this value against anything. `fixtures/schema.record`
# carries it, so a bump shows up in a diff, and nothing refuses a source for
# the version it was written against. So the position of a digit here is a
# statement to a reader and never a gate: the removal above is refused at the
# member and never at the version.
version: 0.3.0

# --- the root of a taxonomy source ------------------------------------------
#
# The root set is closed (spec 2, The `$`-reference sublanguage). Thirteen of
# these are the thirteen declarations. `vocabularies` is authoring syntax that
# facets reference, and the three above it name the taxonomy and what it
# extends.
#
# `package` is absent deliberately. It is a reserved reference root, and no
# taxonomy may declare a block with that name. A package *manifest* (spec 7,
# Publishing) is a different file with a different root set, and it is that
# file which names the package.

declarations:

  taxonomy: {scalar: string, required: true}
  version: {scalar: string, required: true}
  # The engine reads nothing from this key today. A real reader would fetch or
  # locate the named base package and layer this source over it as a second,
  # transitive package, which is a resolver capability this repository has not
  # built and a change to the lock that HW-OBL-0082 has not yet ruled on. Q40
  # is the ruling: this stays a label a publisher states truthfully, and the
  # meta-schema still validates its shape, but no comparison follows from it.
  extends: {one_of: [{scalar: string}, {scalar: null}]}

  vocabularies: {map: {seq: {one_of: [{scalar: string}, {block: vocabulary_value}]}}}

  purposes: {map: {block: purpose}}
  facets: {map: {block: facet}}
  regimes: {block: regimes}
  relations: {map: {block: relation}}
  anchors: {map: {block: anchor}}
  shelves: {map: {block: shelf}}
  kinds: {map: {block: kind}}
  identifier_schemes: {map: {block: identifier_scheme}}
  core: {block: core}
  mappings: {seq: {block: mapping}}
  projections: {seq: {block: projection}}

  # The two roots that spec 4 writes and spec 2 had no room for. Both are keyed
  # by the identifier, where spec 4's own examples wrote the identifier as an
  # `id` member of a list item. The key is the identifier because a bundle has
  # to reach these blocks: an overlay writes an address, an address never
  # reaches inside a list, and a bundle that adds a kind adds the obligations
  # that the kind's rules serve. Two bundles that add two obligations then write
  # two disjoint addresses, which is what the confluence rule of spec 7 needs.
  obligations: {map: {block: obligation}}
  controls: {map: {block: control}}

# --- the root of an overlay source ------------------------------------------
#
# An overlay is a taxonomy source of a second shape: operations at addresses
# rather than declarations (spec 2, Customization by composition). A bundle is
# an overlay that a publisher ships and that holds `add` alone (spec 7).
#
# The value of an operation is validated against the shape at the address it
# names, which is what makes one meta-schema serve both roots.

operations:

  # The engine reads nothing from this key today. It restates the composed
  # taxonomy's own name, and nothing records what an adopter's resolved
  # taxonomy is named for the restatement to be checked against. Q40 rules the
  # whole family below a label rather than a mechanism, for a reason stated
  # once there rather than four times here.
  taxonomy: {scalar: string}
  # The engine reads nothing from this key today. Every bundle this repository
  # ships already agrees with its own directory name by inspection, and
  # nothing exercises a mismatch. Q40.
  bundle: {scalar: string}
  # The engine reads nothing from this key today. Nothing compares this value
  # against the base package actually loaded, so a stale value here — as every
  # one of this repository's own shipped bundles carries today — goes
  # unreported. Q40.
  extends: {scalar: string}
  # The engine reads nothing from this key today. The invariant it documents
  # is already enforced by referential integrity at resolve time, on an
  # unrelated path that predates this key. Q40.
  requires: {seq: {scalar: string}}

  # The key of an operation is an address rather than a segment, so it holds
  # dots, and the value is decided by the shape at the node the address names.
  add: {map: {free: the shape at the addressed node decides this}, addressable: false}
  override: {map: {free: the shape at the addressed node decides this}, addressable: false}
  add_to: {map: {free: the shape at the addressed node decides this}, addressable: false}
  remove_from: {map: {free: the shape at the addressed node decides this}, addressable: false}
  remove: {seq: {scalar: string}}

definitions:

  # --- vocabularies ---------------------------------------------------------

  vocabulary_value:
    members:
      value: {scalar: string, required: true}
      # guess: spec 2 uses initial, live and terminal-retained, and states no set.
      role: {enum: [initial, live, terminal-retained]}

  # --- purposes -------------------------------------------------------------

  purpose:
    members:
      intent: {scalar: string, required: true}
      answers: {seq: {scalar: string}}

  # --- facets ---------------------------------------------------------------

  facet:
    members:
      # The role registry is closed and spec 2 states it here rather than
      # anywhere else. A role outside this line is a validation error, and to
      # add one is a meta-schema change.
      #
      # `name` is the sixth, and one projection asked for it. An emitter that
      # writes a heading needs the text of that heading, and it may not reach a
      # facet by the facet's name. `title` means something in the
      # decision-record entry and nothing outside it, so an emitter that read
      # the name would work in one corpus. A role is the taxonomy's own
      # statement of what a value is for, and it is the only thing an emitter
      # may read. `scent` is that same rule, already applied to a summary.
      role: {enum: [state, state_entered, created, freshness, scent, name]}
      # The one position in a taxonomy source where a reference is written.
      values: {seq: {one_of: [{scalar: string}, {block: vocabulary_value}]}, reference: allowed}
      # guess: the types the base package and the first bundle write.
      type: {enum: [string, integer, boolean, date, duration]}
      required: {scalar: boolean}
      # guess: the three values a check reports (spec 12). The obligation
      # severities of spec 4 are a different surface.
      severity: {enum: [error, warn, info]}
      stale_after_days: {scalar: integer}
      # guess: the permanence canon names `mutable` and implies its complement.
      volatility: {enum: [stable, mutable]}
      # gap: the ascertainability canon requires guidance on every enum value
      # and no syntax carries it. This is the form the first library entry
      # guessed, adopted here so that the entry validates.
      guidance: {map: {scalar: string}}

  # --- regimes --------------------------------------------------------------
  #
  # Three families, and the set is closed: voice, lifecycle and language.

  regimes:
    members:
      voice: {map: {block: voice_regime}}
      lifecycle: {map: {block: lifecycle_regime}}
      language: {map: {block: language_regime}}

  voice_regime:
    members:
      # gap: spec 3 names the forbidden constructions in prose and no value set
      # states them.
      forbid: {seq: {scalar: string}}

  lifecycle_regime:
    members:
      initial: {scalar: string, required: true}
      transitions: {map: {seq: {scalar: string}}, required: true}
      # There is no `terminal` member. Which states end a regime is read off the
      # machine, and which states a rule may call terminal is read off the
      # `terminal-` role on the vocabulary value. A list here was a third way to
      # say it that reached neither reader, so `lifecycle soundness` refuses a
      # regime where the machine and the role disagree instead.
      retain_terminal: {scalar: boolean}

  language_regime:
    members:
      tag: {scalar: string, required: true}
      # gap: spec 2 names `none`, `ste-house` and `ste-strict`, and this
      # repository's own overlay writes `ASD-STE100` with a separate `profile`.
      # A closed set here would refuse a committed source.
      controlled: {scalar: string}
      profile: {scalar: string}
      # How the source of a document under this regime is written, as opposed to
      # what its prose says. A closed set, unlike `controlled` above, because
      # nothing is committed against it yet and a set that starts open never
      # closes.
      source_form: {enum: [unconstrained, one_line_per_block]}
      retired_terms: {seq: {block: retired_term}}

  retired_term:
    members:
      term: {scalar: string, required: true}
      reason: {scalar: string, required: true}
      replacement: {scalar: string}

  # --- relations ------------------------------------------------------------

  relation:
    members:
      family: {enum: [succession, derivation, governance, evidence, composition, association], required: true}
      from: {seq: {scalar: string}, required: true}
      to: {seq: {scalar: string}, required: true}
      inverse: {scalar: string}
      # guess: spec 2 writes `required` and `symmetric`, and a relation with
      # neither is what `optional` names.
      reciprocal: {enum: [required, symmetric, optional]}
      nuclearity: {enum: [multinuclear, nucleus-satellite]}
      nucleus: {enum: [from, to]}
      inherits: {seq: {scalar: string}}
      # guess: spec 2 writes `many` and states no default. This corpus refutes
      # `one`, because `applied_in` declares no cardinality and one review
      # prompt names three targets under it. The value set stays closed on what
      # spec 2 writes, and spec 13 carries the default and the question of
      # whether a declaration binds the inverse relation name.
      cardinality: {enum: [one, many]}
      created_by: {enum: [author, scaffold, generator, hook, agent, import], required: true}
      attributes: {map: {block: relation_attribute}}
      on_target: {block: on_target}
      invalid_when: {block: invalid_when}

  relation_attribute:
    members:
      # The value space is a facet's value space, and never a reference.
      type: {enum: [string, integer, boolean, date, duration]}
      values: {seq: {scalar: string}}
      owner: {enum: [source, target, edge], required: true}

  on_target:
    members:
      set_state: {scalar: string, required: true}

  invalid_when:
    members:
      # gap: spec 2 shows `both` and states no other form of the condition.
      both: {map: {scalar: string}}

  # --- anchors --------------------------------------------------------------

  anchor:
    members:
      resolver: {scalar: string, required: true}

  # --- shelves --------------------------------------------------------------

  shelf:
    members:
      # gap: nothing states which glob constructs a shelf path admits, and
      # nothing states what makes one pattern more specific than another.
      path: {scalar: string, required: true}
      homogeneous: {scalar: boolean, required: true}
      kind: {scalar: string}
      discriminator: {scalar: string}
      kinds: {seq: {scalar: string}}
      group_by: {scalar: string}
      layout: {scalar: string}
      # The name a reader sees where an emitter prints this shelf. Optional,
      # and a shelf that declares none is printed under its key, which is the
      # fall-through `headwater_generate::shelf_label` states.
      #
      # No `role`, and that is the difference from a facet rather than an
      # omission. The role registry above exists because a facet is
      # open-named: `title` means something in the decision-record entry and
      # nothing outside it, so an emitter may not reach a facet by its name. A
      # shelf's member set is closed by this block, and `taxonomy validate`
      # refuses a member outside it, so `title` here is addressed by a name
      # every taxonomy shares and needs no indirection to be portable.
      #
      # The alternative was to derive the display name from the key, and
      # [#427](https://github.com/headwater-ai/headwater/issues/427) ruled it
      # out for the document half in the same words: a label a reader sees is
      # a declared property, not something derived from whatever string
      # happens to name the thing.
      title: {scalar: string}

  # --- kinds ----------------------------------------------------------------

  kind:
    members:
      abstract: {scalar: boolean}
      is_a: {scalar: string}
      purpose: {scalar: string}
      identifier: {block: kind_identifier}
      voice: {scalar: string}
      lifecycle: {scalar: string}
      language: {scalar: string}
      facets: {block: facet_contract}
      sections: {block: section_contract}
      relations: {block: kind_relations}

  kind_identifier:
    members:
      scheme: {scalar: string, required: true}

  facet_contract:
    members:
      require: {seq: {scalar: string}}
      optional: {seq: {scalar: string}}
      forbid: {seq: {scalar: string}}

  section_contract:
    members:
      require: {seq: {scalar: string}}
      optional: {seq: {scalar: string}}

  kind_relations:
    members:
      expect: {seq: {block: expectation}}

  expectation:
    members:
      id: {scalar: string, required: true}
      relation: {scalar: string, required: true}
      to_kind: {scalar: string, required: true}
      when: {map: {scalar: string}}
      within: {scalar: duration, required: true}
      since: {enum: [created, state_entered], required: true}
      severity: {enum: [error, warn, info]}
      rationale: {scalar: string, required: true}

  # --- identifier schemes ---------------------------------------------------

  identifier_scheme:
    members:
      # The template, in the three placeholder forms spec 2 writes.
      # `headwater_meta::identifier` is the one reader of it. `taxonomy
      # validate` decides disjointness out of the segments it produces, and
      # `identifier.pattern.not_met` holds a document to the same segments.
      #
      # gap: the prefix that discriminates a kind is a literal run inside this
      # string rather than a member of its own. No rule here waits on that. An
      # RDF projection does: it has no declared name to build a document IRI
      # out of, so the worked example derives one from a repository path and a
      # rename breaks it. HW-OBL-0046 carries the rest.
      pattern: {scalar: string, required: true}
      # Required after resolution, and not in a source. A published package can
      # declare neither its own namespace, which every adopter would inherit,
      # nor a stand-in such as `repo`, which names every adopter at once. So it
      # declares none and a consumer's overlay supplies one. `taxonomy
      # validate` refuses a resolved scheme that carries none, and the two
      # states are kept apart there: a key that is absent and a key written as
      # the empty string get two messages, because one is a package leaving the
      # choice open and the other is a consumer answering it with nothing.
      namespace: {scalar: string}
      # gap: spec 2 writes `reconcile-first` and this repository's overlay
      # writes `minted-once`. No set is stated.
      allocation: {scalar: string, required: true}

  # --- the core -------------------------------------------------------------
  #
  # One requirement per entry, and the key present is what says which kind of
  # requirement it is.

  core:
    members:
      requires: {seq: {block: core_requirement}, required: true}

  core_requirement:
    one_of:
      - {members: {facet_role: {enum: [state, state_entered, created, freshness, scent, name], required: true}}}
      - {members: {purpose: {scalar: string, required: true}}}
      - {members: {relation_family: {enum: [succession, derivation, governance, evidence, composition, association], required: true}, lifecycle_sensitive: {scalar: boolean}}}
      - {members: {identifier_scheme: {scalar: string, required: true}}}

  # --- mappings -------------------------------------------------------------

  mapping:
    members:
      to: {scalar: string, required: true}
      kinds: {map: {block: skos_mapping}}
      # The key is a facet and one of its values, written `status.current`, so
      # it holds a dot and no address can name it. Spec 2 states both halves of
      # that collision and reconciles neither: a mapping key is written this way
      # in its own worked example, and the sublanguage says the meta-schema
      # refuses to declare a key that holds a dot. The reading here is that no
      # overlay reaches inside `facet_values`, and spec 13 carries the finding.
      facet_values: {map: {block: skos_mapping}, addressable: false}

  skos_mapping:
    members:
      relation: {enum: [exactMatch, closeMatch, broadMatch, narrowMatch, relatedMatch], required: true}
      target: {scalar: string, required: true}

  # --- projections ----------------------------------------------------------

  projection:
    members:
      # The projection kinds a taxonomy may declare. Spec 6 (Projections) names
      # the set the engine implements, and Q19 adds `transcription` to it. This
      # position was marked as a gap until the generator arrived, and building
      # the generator showed it was one question that hides two.
      #
      # The kinds do not form one value set. They form two, and only this one
      # belongs on a declaration. Two kinds are engine-defined: the register of
      # spec 4 (Every obligation has exactly one disposition) and the corpus
      # descriptor of Q14. Neither takes its output path from a declaration, and
      # a taxonomy that named either here would put a second copy of one
      # artifact at a path the engine did not fix. So the enum below is the
      # declarable ten, and `headwater generate` writes the other two whether
      # or not any taxonomy mentions a projection at all.
      #
      # `verb_index` is the tenth, and #257 added it. Its rows are not the
      # graph: they are the dispatch table of the binary, and its empty cell is
      # a verb that no document of the corpus describes. It is declarable
      # because whether a corpus commits one, and where, is a schema decision
      # like every other output path. `for` names the one shelf that holds the
      # documents which describe a verb.
      kind:
        enum:
          - shelf_index
          - shelf_sections
          - relation_view
          - agent_rules
          - site_nav
          - graph_export
          - template
          - transcription
          - probe_result
          - verb_index
        required: true
      for: {seq: {scalar: string}}
      output: {scalar: string, required: true}
      profile: {scalar: string}
      format: {scalar: string}
      filter: {block: projection_filter}
      tombstone: {enum: [counted, sealed]}
      from: {block: projection_pin}
      identity: {block: projection_identity}

  # What a generated document is, for a projection whose output is a document of
  # the corpus rather than a list beside it.
  #
  # A generated Markdown file that carries no front matter is no node: it holds
  # no identifier, so no edge reaches it and no shelf resolves a kind for it.
  # That is right for an index of a shelf, which nothing cites. It is wrong for a
  # projection that takes over a path other documents already name, and this
  # block is what such a declaration adds.
  #
  # Three scalars, and the block is closed at three. An identifier is minted
  # once and is a declaration. A kind is a declaration. A name is a declaration:
  # it is what the document is called, and the taxonomy already demands one from
  # any generated document whose kind requires the facet in the `name` role.
  # `decision_register` requires `title`, and the tombstone at
  # `docs/spec/09-open-questions.md` is a `decision_register` that had no way to
  # supply it, so every emitter that labels a document fell through to its
  # identifier and a reader met `HW-REG-open-questions` in the sidebar, the
  # browser tab and the shelf's own index (#627).
  #
  # A summary, a status and a body are prose, and no member here can carry one.
  # The earlier form of this position was a `template`, and it was refused
  # because a taxonomy source sits outside the corpus root: prose written here
  # would move to the one file that no census row covers and no language regime
  # binds. A member that took an open mapping of facets would have re-admitted
  # that prose through a different syntax, and the refusal would then have been a
  # ruling about punctuation. This block cannot express a sentence, so the
  # refusal stays a ruling about substance.
  #
  # `name` does not reopen that refusal, and the reason is that it admits no new
  # class of prose. Eight shelves of this repository already declare a free-text
  # `title:` in a taxonomy source, and `shelf_label` renders each one into a
  # navigation group key, a page heading and a served `<title>`. A `name` here is
  # the same short string for a document rather than for a shelf. It is a label
  # and never a sentence, and the member is the facet's *role* rather than its
  # name, so the engine writes it under whichever facet this taxonomy puts in the
  # `name` role.
  #
  # `kind` names a kind and never a facet. The engine reads the shelf that claims
  # the output path and writes whatever that shelf needs to resolve the kind: the
  # discriminator on a heterogeneous shelf, and nothing at all on a homogeneous
  # one, where spec 2 (Placement is primary) forbids restating it.
  #
  # Nothing here declares an edge. Q4 rules that front matter is the one place an
  # edge is authored, and a taxonomy source is not front matter. A generated
  # document carries the reciprocal half of every edge that another document
  # declares into it, which the engine derives from the graph, and it carries no
  # other edge at all.
  projection_identity:
    members:
      id: {scalar: string, required: true}
      kind: {scalar: string, required: true}
      name: {scalar: string}

  projection_filter:
    members:
      include: {map: {seq: {scalar: string}}}
      exclude: {map: {seq: {scalar: string}}}

  projection_pin:
    members:
      anchor: {scalar: string, required: true}

  # --- obligations and controls ---------------------------------------------
  #
  # Spec 4 (Obligations are data, Controls are data) writes both blocks, and
  # every member below is a member it writes. Two of its members are gone: the
  # `id` of each entry is the key, for the reason the declaration carries.
  #
  # Every member here is required of the *source*, and no second notion of
  # required is needed for these two blocks. An entry is written whole or not at
  # all: a source that omits a member is refused where it is written, an overlay
  # operation's value is read against this shape, and a `remove` of a required
  # member is refused at merge time. The facet case that spec 13 records is a
  # different one, because a base declares a facet and an overlay refines it. No
  # adopter completes a publisher's obligation. An adopter that holds a
  # different invariant declares an obligation of their own.

  obligation:
    members:
      statement: {scalar: string, required: true}
      rationale: {scalar: string, required: true}
      # guess: spec 4 gives the two classes a section and a table, and it states
      # no set. The line between them moves when a judgment becomes data, and
      # that moves an obligation from one of these values to the other.
      class: {enum: [cohesion, coherence], required: true}
      # gap: `prevents` names a class of a documentation-defect taxonomy that
      # spec 4 derives empirically and no declaration here holds. Spec 4 walks
      # nine classes in prose, and an adopter with their own defect taxonomy
      # writes a class this file never saw. A closed set would refuse them.
      prevents: {scalar: string, required: true}
      # guess: spec 4 writes `high` and `medium` on its own obligations, and
      # `low` is the third that a register with two severities does not need to
      # write. This is not the severity a check reports: spec 12 rules that
      # severity is the check's, and the finding of spec 4's own example carries
      # `error` against an obligation that carries `medium`.
      severity: {enum: [high, medium, low], required: true}
      # Spec 4 gives every obligation exactly one disposition and admits no
      # silence. `verified` follows from a control and is never written here,
      # because the binding lives on the control and a second place to write it
      # is the drift spec 4 kills. The other two follow from nothing a control
      # carries, so this member is where they are stated. It is optional, and an
      # obligation that no control discharges and that omits it is the silence
      # spec 4 forbids: `obligation.disposition.missing` reports it.
      #
      # `one_of` over two closed mappings is what makes "exactly one" the shape
      # rather than a rule. Both keys together accept neither alternative, and
      # neither key accepts neither alternative.
      disposition:
        one_of:
          - {members: {gap: {block: disposition_gap, required: true}}}
          - {members: {unverifiable: {block: disposition_unverifiable, required: true}}}

  disposition_gap:
    members:
      # Spec 4: "No control yet. Wanted, and tracked with an owner and, ideally,
      # a target." The owner is required and the target is the "ideally".
      owner: {scalar: string, required: true}
      target: {scalar: string}

  disposition_unverifiable:
    members:
      # Spec 4: "No mechanism can exist. Accepted, with the reasoning recorded."
      reasoning: {scalar: string, required: true}

  control:
    members:
      # Spec 4 writes `check:relation-reciprocity` and
      # `scheduled:staleness-sweep`, and states no grammar for the prefix or for
      # what follows it. The engine reads two prefixes. `check:` names a rule id,
      # and that is what binds a finding to the obligation it serves. `phase:`
      # names a phase of the engine itself, from the closed set that
      # `headwater_check::register` publishes: a phase discharges an obligation
      # by doing the thing rather than by reporting a finding about it. A
      # mechanism with any other prefix names something outside this engine, and
      # the register says that this run did not observe it.
      mechanism: {scalar: string, required: true}
      discharges: {seq: {scalar: string}, required: true}
      # gap: spec 4 writes `pull_request` and `weekly`, which are an event and a
      # cadence. Nothing states either set or how the two live in one member.
      trigger: {scalar: string, required: true}
      # Spec 4 wrote `blocking` on one control and `detective` on the other, so
      # one member held values from two vocabularies and control health could
      # not be reported off it. They are two members here.
      #
      # `posture` is the promotion path, and it is spec 12's sense: "severity is
      # the check's, posture is the control's", where the question is whether a
      # finding blocks a gate. A new control starts advisory and evidence
      # promotes it.
      posture: {enum: [advisory, blocking], required: true}
      # `acts` is spec 4's other vocabulary: the four control classes of its
      # opening table, which say *when* a control acts rather than how loudly.
      # It is required because spec 4 gives every control one of the four, and
      # because the register reporting the distribution is what stops a system
      # building the first two classes and claiming the set.
      acts: {enum: [preventive, detective, corrective, adaptive], required: true}
      # Spec 4 writes one value, `task-per-finding`, and the member is optional
      # because a control that reports in place hands off to nobody.
      handoff: {scalar: string}
      # Spec 4 (Promotion) says the promotion criteria "are recorded with the
      # control", and it names three of them. Its next three subsections each
      # take a class of control off that path. So the record holds one of four
      # things, one per subsection, and `one_of` again makes "exactly one" the
      # shape:
      #
      #   criteria             the control is on the path
      #   final_posture        "Where promotion does not apply": one error class
      #                        is unrecoverable, so the evidence the machinery
      #                        collects is evidence about the wrong error
      #   permanently_advisory "Where promotion cannot finish": the remediation
      #                        needs judgment, whatever the false-positive rate
      #   produces_facts       "Promotion measures a rule, and not a producer of
      #                        facts": there is no false-positive rate to
      #                        measure, and the instrument is a fixture set
      #
      # The member is optional, and an advisory control that omits it has
      # nothing stating what would promote it. The register reports that rather
      # than inventing a window and a threshold, because a threshold is a
      # judgment that no section of the specification states.
      promotion:
        one_of:
          - {members: {criteria: {block: promotion_criteria, required: true}}}
          - {members: {final_posture: {block: promotion_exemption, required: true}}}
          - {members: {permanently_advisory: {block: promotion_exemption, required: true}}}
          - {members: {produces_facts: {block: promotion_exemption, required: true}}}

  promotion_criteria:
    members:
      # The three spec 4 names: "a stated observation window", "a false-positive
      # rate under a declared threshold", and the adjudicated sample without
      # which "a check whose sample was never adjudicated did not finish its
      # observation window".
      #
      # gap: each is prose here. Spec 4 states no unit for the window, no scale
      # for the threshold, and no shape for the sample. A duration, a ratio and
      # a reference to an evidence record are the three shapes those want, and
      # the specification names none of them. Spec 13 carries it.
      window: {scalar: string, required: true}
      threshold: {scalar: string, required: true}
      sample: {scalar: string, required: true}

  promotion_exemption:
    members:
      # Spec 4 asks for the reasoning in both cases: a control off the promotion
      # path with no stated reason is the assertion of taste that the whole
      # section exists to refuse.
      reasoning: {scalar: string, required: true}
