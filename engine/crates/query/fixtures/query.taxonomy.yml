# SPDX-License-Identifier: Apache-2.0
#
# The taxonomy the read fixtures are answered against. It is the smallest shape
# in which every read has something to answer from: three purposes, so that a
# term which separates one from the others is distinguishable from a term that
# separates none; one kind per purpose; a succession pair, a nucleus–satellite
# pair, and a governance edge onto a code path, so that all three clauses of
# spec 2's derived reading precedence are exercised; and one document whose
# warrant is `asserted`, which a pointer has to state out loud.
#
# It is not a resolved package, for the reason the check tree's is not: a
# fixture that depended on the base package would change whenever the base does.

purposes:
  rationale:
    intent: explain why a choice was made and what it forecloses
    answers: ["why is it this way", "what was rejected", "what does this constrain"]
  behavior:
    intent: state what the system does, as it is now
    answers: ["what does this component do", "what may I rely on"]
  procedure:
    intent: enable a reader to carry out a task correctly
    answers: ["how do I do this", "what do I do when it fails"]

facets:
  status:
    role: state
    required: true
    values:
      - {value: draft, role: initial}
      - {value: current, role: live}
      - {value: superseded, role: terminal-retained}
  status_since:
    role: state_entered
    required: true
  summary:
    role: scent
    required: true

anchors:
  code_path: {resolver: source-tree}

kinds:
  governed_document:
    abstract: true
    facets: {require: [status, status_since, summary]}
  decision:
    is_a: governed_document
    purpose: rationale
  specification:
    is_a: governed_document
    purpose: behavior
    sections: {require: [Behavior]}
    # The one rule that reads the clock, declared here so that a report of this
    # tree is a function of the date it was asked for. Two specifications refine
    # each other and satisfy it; two do not, and the later of those two is
    # inside its window on one date and past it on another. A server holds its
    # clock for its whole life, and this is what makes that visible.
    relations:
      expect:
        - id: detail-behind-it
          relation: refines
          to_kind: specification
          when: {status: current}
          within: 30d
          since: state_entered
          severity: warn
          rationale: a specification that refines nothing and that nothing refines states a behavior at one grain only
  # The purpose arrives by inheritance here, which is the case spec 2 permits
  # and which `purpose_of` has to walk the chain to answer.
  operations_document:
    is_a: governed_document
    purpose: procedure
  runbook:
    is_a: operations_document

shelves:
  decisions:
    path: query/decisions/**
    homogeneous: true
    kind: decision
  specs:
    path: query/specs/**
    homogeneous: true
    kind: specification
  runbooks:
    path: query/runbooks/**
    homogeneous: true
    kind: runbook

relations:
  # Succession: the successor governs the reading, and the family says so with
  # no `nuclearity` line at all.
  supersedes:
    family: succession
    from: [governed_document]
    to:   [governed_document]
    inverse: superseded_by
    reciprocal: required

  # Nucleus–satellite: the nucleus governs, and `nucleus: to` names it. This is
  # the case a family default cannot decide, because the satellite is the end
  # that declares the edge.
  refines:
    family: derivation
    from: [specification]
    to:   [specification]
    inverse: refined_by
    nuclearity: nucleus-satellite
    nucleus: to

  # Governance onto a code path. The source governs, and the target is an anchor
  # rather than a document, so no reading precedence between documents follows
  # from it. What it does carry is the anchor a route reads.
  governs:
    family: governance
    from: [governed_document]
    to:   [code_path]

  # Association, which spec 2's fourth clause leaves with no reading order.
  is_alternative_to:
    family: association
    from: [decision]
    to:   [decision]
    reciprocal: symmetric
