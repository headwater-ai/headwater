#
# The taxonomy the projection-filter fixtures are written against. Every
# declaration above `projections` is the one `generate.taxonomy.yml` carries,
# so the two trees differ in the projections alone and a difference in output
# is a difference in the filter.
#
# The `decisions` shelf holds two documents. `DR-FIX-0001` is `superseded` and
# `DR-FIX-0002` is `current`, so a filter over `status` separates them and an
# emitter that drops the filter writes both.
#
# The taxonomy the generated fixtures are written against. It is the smallest
# shape in which every branch of the verb has something to produce: a shelf that
# holds documents, a shelf that holds none, a governance edge and a succession
# pair so that the derived reading order is not the file order, a document whose
# warrant is `asserted`, and a declared kind that this engine does not emit.
#
# It is not a resolved package, for the reason the check tree's is not: a fixture
# that depended on the base package would change whenever the base does.

purposes:
  rationale:
    intent: explain why a choice was made and what it forecloses
    answers: ["why is it this way", "what was rejected"]
  procedure:
    intent: enable a reader to carry out a task correctly
    answers: ["how do I do this", "what do I do when it fails"]

facets:
  status:
    role: state
    required: true
    values:
      - {value: draft, role: initial}
      - {value: current, role: live}
      - {value: superseded, role: terminal-retained}
  status_since:
    role: state_entered
    required: true
  summary:
    role: scent
    required: true
  # The facet in the `name` role. Not required, because one guide leaves it
  # empty on purpose: that is the branch where a `shelf_sections` declines a
  # whole file rather than writing one with a section missing.
  title:
    role: name
    required: false
  # The discriminator of the heterogeneous shelf below. Not required, because a
  # document on a homogeneous shelf takes its kind from the directory and a
  # facet that restated it would be a second copy of one fact.
  doc_type:
    values: [decision, guide]

kinds:
  governed_document:
    abstract: true
    facets: {require: [status, status_since, summary]}
  decision:
    is_a: governed_document
    purpose: rationale
    identifier: {scheme: decision_id}
  guide:
    is_a: governed_document
    purpose: procedure
    identifier: {scheme: guide_id}

identifier_schemes:
  decision_id: {pattern: "DR-{namespace}-{seq:04d}", namespace: FIX, allocation: minted-once}
  guide_id: {pattern: "GD-{namespace}-{slug}", namespace: FIX, allocation: minted-once}

relations:
  supersedes:
    family: succession
    from: [decision]
    to: [decision]
    inverse: superseded_by
    reciprocal: required
  # A governance edge, so that a guide which one decision governs sorts below it
  # even though its file name sorts above.
  governs_guide:
    family: governance
    from: [decision]
    to: [guide]
    inverse: governed_by
    reciprocal: required

shelves:
  decisions: {path: "generate/decisions/**", homogeneous: true, kind: decision}
  guides:    {path: "generate/guides/**",    homogeneous: true, kind: guide}
  # Declared, and nothing is on it. An index of nothing asserts that a shelf is
  # there, so the verb reports it and writes no file. It is also the one
  # heterogeneous shelf, which is what gives the JSON Schema emitter a shelf
  # whose kind a front-matter member states. That is the only shape in which a
  # schema can select a kind for itself, and it holds no document, so it moves
  # no count.
  archive:
    path: "generate/archive/**"
    homogeneous: false
    discriminator: doc_type
    kinds: [decision, guide]

projections:
  # Unfiltered, and the control. Both documents of the shelf are named.
  - {kind: shelf_index, for: [decisions], output: "{shelf}/README.md"}

  # The same shelf and the same emitter, filtered to the one document that is
  # `current`. A filter is declared in the meta-schema for every projection
  # kind, and until #325 only the graph export read one.
  - kind: shelf_index
    profile: live
    for: [decisions]
    output: generate/decisions/LIVE.md
    filter:
      include:
        status: [current]

  # The sections emitter, filtered the same way, because it takes every
  # document of the shelf by the same route.
  - kind: shelf_sections
    profile: live
    for: [decisions]
    output: generate/decisions/LIVE-SECTIONS.md
    filter:
      include:
        status: [current]

  # An `include` clause over a value no document of this shelf states. The
  # shelf is not empty and the filter admits nothing, which is a different
  # outcome from an index of an empty shelf and gets its own reason.
  - kind: shelf_index
    profile: none
    for: [decisions]
    output: generate/decisions/NONE.md
    filter:
      include:
        status: [draft]
