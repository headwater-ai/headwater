# SPDX-License-Identifier: Apache-2.0
#
# The taxonomy the list-anchor export fixture is written against (#1247). It is
# the smallest shape in which a `governs` entry can be a list anchor: one kind,
# one shelf, one relation onto a `code_path` anchor that `source-tree` binds,
# and one native export.
#
# The corpus base is `fixtures/listanchor/`, so a pattern such as `src/a.rs`
# names a file beside the `docs/` root and not one under it.
#
# It is not a resolved package, for the reason the other fixture taxonomies here
# are not: a fixture that depended on the base package would move whenever the
# base does.

purposes:
  rationale:
    intent: explain why a choice was made and what it forecloses
    answers: ["why is it this way", "what was rejected"]

facets:
  status:
    role: state
    required: true
    values:
      - {value: draft, role: initial}
      - {value: current, role: live}
  status_since:
    role: state_entered
    required: true
  summary:
    role: scent
    required: true

kinds:
  governed_document:
    abstract: true
    facets: {require: [status, status_since, summary]}
  decision:
    is_a: governed_document
    purpose: rationale
    identifier: {scheme: decision_id}

identifier_schemes:
  decision_id: {pattern: "DR-{namespace}-{seq:04d}", namespace: FIX, allocation: minted-once}

relations:
  governs:
    family: governance
    from: [decision]
    to: [code_path]
    cardinality: many

anchors:
  code_path: {resolver: source-tree}

shelves:
  decisions: {path: "docs/decisions/**", homogeneous: true, kind: decision}

projections:
  - kind: graph_export
    format: json
    output: exports/native.json
