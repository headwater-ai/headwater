# SPDX-License-Identifier: Apache-2.0
#
# The state-set-twice tree read against a taxonomy where two relations write a
# state and both write the same one: `supersedes` and `replaces` write
# `superseded`, and `retires` writes nothing. Two setters that agree can tell
# no document two states, so the rule runs no instance. This is the direction
# of the gate that a count of setters alone gets wrong.

facets:
  status:
    role: state
    values:
      - {value: draft,      role: initial}
      - {value: current,    role: live}
      - {value: superseded, role: terminal-retained}
      - {value: retired,    role: terminal-retained}
  summary:
    role: scent

identifier_schemes:
  note_id: {pattern: "NOTE-{namespace}-{slug}", namespace: FIX, allocation: minted-once}

relations:
  supersedes:
    family: succession
    from: [note, page, plain]
    to:   [note, page, plain]
    inverse: superseded_by
    on_target: {set_state: superseded}
    created_by: author
  replaces:
    family: succession
    from: [note, page, plain]
    to:   [note, page, plain]
    inverse: replaced_by
    on_target: {set_state: superseded}
    created_by: author
  retires:
    family: succession
    from: [note, page, plain]
    to:   [note, page, plain]
    inverse: retired_by
    created_by: author
  cites:
    family: evidence
    from: [note, page, plain]
    to:   [note, page, plain]
    created_by: author

kinds:
  note:
    identifier: {scheme: note_id}
  page:
    identifier: {scheme: note_id}
    facets: {require: [status]}
  plain:
    identifier: {scheme: note_id}

shelves:
  notes:
    path: state-set-twice/notes/**
    homogeneous: true
    kind: note
  pages:
    path: state-set-twice/pages/**
    homogeneous: true
    kind: page
  plain:
    path: state-set-twice/plain/**
    homogeneous: true
    kind: plain
