# SPDX-License-Identifier: Apache-2.0
#
# The taxonomy the fixture tree is checked against. It is the smallest shape in
# which every generated check has something to generate from: one homogeneous
# shelf and one heterogeneous one, one facet with a value set and one without,
# one kind that inherits a facet requirement and one that forbids every facet,
# one relation that requires reciprocity and one that says nothing about it, and
# one windowed participation expectation.
#
# It is not a resolved package. `standin` puts the real one together, and this
# file is written out because a fixture that depended on the base package would
# change whenever the base does.

facets:

  # Enumerated, so `facet.value.not_permitted` has a set to test against, and
  # required, so `facet.required.missing` has something to miss.
  status:
    role: state
    required: true
    values:
      - {value: draft, role: initial}
      - {value: current, role: live}
      - {value: superseded, role: terminal-retained}

  # The origin a participation window is measured from. A declaration says
  # `since: state_entered` and never `since: status_since`, so the role is what
  # joins the two.
  status_since:
    role: state_entered
    required: true

  summary:
    role: scent
    required: true

  # The discriminator of the heterogeneous shelf. It declares no value set, so
  # the shelf's own `kinds` list is the only thing that says what it may hold,
  # and no instance of the enum rule is generated over it.
  doc_type:
    volatility: stable

# Two voice regimes and two language regimes, because each family has two
# outcomes worth a fixture. One of each is a declaration this engine has rules
# for. The other names a category and a profile it does not know, and the
# instance over it skips with that name in the reason rather than passing
# silently — which is the whole of what the meta-schema's `gap` marker costs at
# run time.

regimes:
  voice:
    declarative: {forbid: [future_intent, change_narration, phased_rollout]}
    guarded: {forbid: [hedging]}
  language:
    ste_house:
      tag: en-US
      controlled: ASD-STE100
      profile: house
      source_form: one_line_per_block
      # Two entries, because the replacement is what decides the posture. The
      # first is a substitution and an error, the second is a rewrite and
      # advisory.
      retired_terms:
        - {term: reference system, reason: the corpus renamed it, replacement: taxonomy}
        - {term: robust, reason: it stands in for the failure the thing survives}
    ste_strict: {tag: en-US, controlled: ASD-STE100, profile: strict}

kinds:
  governed_document:
    abstract: true
    facets: {require: [status, status_since, summary]}

  design_spec:
    is_a: governed_document
    voice: declarative
    language: ste_house

  evaluation:
    is_a: governed_document
    relations:
      expect:
        - id: evidence-cited
          relation: cited_by
          to_kind: design_spec
          when: {status: current}
          within: 30d
          since: state_entered
          severity: warn
          rationale: an evaluation that no specification cites closed nothing

  # The kind that carries a section contract, and the two regimes this engine
  # cannot read. A contract on `design_spec` would put a section requirement on
  # every document the other rules use, and a fixture that has to satisfy four
  # rules at once is one nobody can read.
  decision_record:
    is_a: governed_document
    voice: guarded
    language: ste_strict
    sections: {require: [Context, Decision]}

  # A kind that forbids every facet the two Shape rules read, so neither of them
  # generates an instance over it. That is what leaves a classified document
  # with no instance at all, which is the failing fixture the coverage rule
  # needs. See `crates/check/src/facet_value.rs` for why a rule that
  # instantiated over every typed document would make that finding unreachable.
  note:
    facets: {forbid: [status, status_since, summary]}

shelves:
  spec_series:
    path: check/spec/**
    homogeneous: false
    discriminator: doc_type
    kinds: [design_spec, note, decision_record]
  evaluations:
    path: check/evaluations/**
    homogeneous: true
    kind: evaluation

relations:
  cites_evidence:
    family: evidence
    from: [design_spec]
    to:   [evaluation]
    inverse: cited_by
    reciprocal: required

  # No `reciprocal`, so no instance of the reciprocity check is generated over
  # it. That is the half of "generated from the taxonomy" that a corpus with one
  # relation cannot show. Its endpoint sets are the ones the endpoint rule
  # tests: a design spec at the source end, and any governed document at the
  # target end, which an evaluation is by inheritance.
  assesses:
    family: evidence
    from: [design_spec]
    to:   [governed_document]

# All three states of the binding are here, because each one is worth recording.
# A finding names the obligation that the control binds it to. A rule that no
# control names says so in the report rather than carrying a quiet `None`. And a
# rule that two controls name reaches two obligations, which a finding cannot
# carry, so the register names both and the finding names neither. The base
# package binds every rule to exactly one.
#
# The obligations below run past the ten that the rules need, because the
# register has states of its own. There is one obligation per branch of
# `Disposition` and one control per branch of `Mechanism`, so the recorded
# report is the record of each.

obligations:
  OB-FIX-1:
    statement: A relation that requires reciprocity is declared at both of its ends
    rationale: One half of a pair is a claim the document at the other end never made
    class: cohesion
    prevents: content.inconsistent
    severity: medium
  OB-FIX-2:
    statement: A document does not restate in metadata what its placement already states
    rationale: A restatement is a second truth that eventually disagrees with the first
    class: cohesion
    prevents: content.inconsistent
    severity: medium
  OB-FIX-3:
    statement: Every facet a kind requires is declared by every document of that kind
    rationale: A facet nobody declared is a question the corpus cannot answer about itself
    class: cohesion
    prevents: content.incomplete
    severity: high
  OB-FIX-4:
    statement: A facet with a declared value set carries one of those values
    rationale: A value outside the set is a state no reader and no query can act on
    class: cohesion
    prevents: content.inconsistent
    severity: medium
  OB-FIX-5:
    statement: Both ends of a relation instance are kinds the relation permits
    rationale: An edge between kinds a relation forbids is an assertion the taxonomy never sanctioned
    class: cohesion
    prevents: content.inconsistent
    severity: medium
  OB-FIX-6:
    statement: A participation expectation is met inside the window the taxonomy declares
    rationale: A document that nothing ever links to is work that reached nobody
    class: cohesion
    prevents: process.maintenance
    severity: low

  OB-FIX-7:
    statement: Prose of a kind under a voice regime does not use the constructions it forbids
    rationale: A specification that narrates change cannot be read for what holds now
    class: cohesion
    prevents: content.inconsistent
    severity: low
  OB-FIX-8:
    statement: Prose of a kind under a language regime obeys the controlled language it names
    rationale: A rule that lives in a contributing guide is a rule no check can read
    class: cohesion
    prevents: content.unclear
    severity: low
  OB-FIX-9:
    statement: Every section a kind requires is a heading of every document of that kind
    rationale: A document missing a section answers a question its kind promised to answer
    class: cohesion
    prevents: content.incomplete
    severity: high
  OB-FIX-10:
    statement: A fragment a document writes into itself names a heading of that document
    rationale: A link that lands nowhere costs the reader the paragraph it was written for
    class: cohesion
    prevents: content.inconsistent
    severity: medium

  # The register's own two rules, and then one obligation per state the
  # register can put an obligation in. Every branch of `Disposition` and of
  # `Mechanism` has an entry here, so `check.report` is the record of each.

  OB-FIX-11:
    statement: Every obligation this taxonomy declares carries exactly one disposition
    rationale: An obligation that no control discharges and that states nothing reads from outside like one that is met
    class: cohesion
    prevents: process.traceability
    severity: high
  OB-FIX-12:
    statement: Every control names a mechanism this engine implements
    rationale: A register that claims coverage it does not have is worse than no register
    class: cohesion
    prevents: process.traceability
    severity: high

  # Verified, by a phase rather than by a rule.
  OB-FIX-13:
    statement: Every file under the corpus root is classified, or reported as unclassifiable
    rationale: A run that never saw a file reports nothing about it
    class: cohesion
    prevents: process.maintenance
    severity: high

  # Gap: no control, and the obligation says so with an owner and a target.
  OB-FIX-14:
    statement: A document reaches the reader who asked the question it answers
    rationale: A control whose signal reaches nobody who can act is not a control
    class: coherence
    prevents: process.contribution_friction
    severity: medium
    disposition:
      gap:
        owner: the fixture tree
        target: a reader feedback loop, which spec 4 lists as usually absent

  # Unverifiable: no mechanism can exist, and the reasoning is recorded.
  OB-FIX-15:
    statement: A specification still describes the system it specifies
    rationale: Form-correct prose can still be false, and nothing structural detects it
    class: coherence
    prevents: content.incorrect
    severity: high
    disposition:
      unverifiable:
        reasoning: The question is semantic, so spec 4 sends it to the accuracy audit and no check reaches it

  # The state spec 4 forbids: no control, and no statement either. This is the
  # failing fixture of `obligation.disposition.not_one`.
  OB-FIX-16:
    statement: A heading says what the section under it is about
    rationale: A reader who cannot skim a document reads all of it or none of it
    class: coherence
    prevents: presentation.organization
    severity: low

  # Two dispositions rather than one: a control discharges it, and it states a
  # gap as well. The second failing case of the same rule.
  OB-FIX-17:
    statement: Both ends of a relation instance are kinds the relation permits
    rationale: An edge between kinds a relation forbids is an assertion the taxonomy never sanctioned
    class: cohesion
    prevents: content.inconsistent
    severity: medium
    disposition:
      gap:
        owner: the fixture tree

  # Claimed on paper by a control whose mechanism this engine does not
  # implement. The failing fixture of `control.mechanism.unimplemented`, and of
  # `obligation.disposition.not_one` as well: a control the engine cannot run
  # discharges nothing, and this obligation states no disposition of its own, so
  # it carries none.
  OB-FIX-18:
    statement: A deprecated document names what replaced it
    rationale: A reader who lands on a dead end has to search for the live one
    class: cohesion
    prevents: content.outdated
    severity: medium

  # Discharged by a mechanism outside this engine, which spec 4 declares and
  # which is not an error. The passing fixture of the same rule.
  OB-FIX-19:
    statement: A document that nothing has verified for six months is swept
    rationale: Staleness is invisible until somebody looks for it
    class: cohesion
    prevents: content.outdated
    severity: low

  # A stated gap, and a control that claims it under a mechanism this engine
  # does not implement. The gap is what the register goes with, because nothing
  # discharges it, and the two dispositions on the page are still reported.
  OB-FIX-22:
    statement: Prose of a kind under a language regime does not write a term that regime retired
    rationale: A retirement that lives in a commit message is inherited by nobody
    class: cohesion
    prevents: content.inconsistent
    severity: low
  OB-FIX-21:
    statement: The source of a document under a language regime that fixes a source form is written in that form
    rationale: A source form is invisible to a reader and loud in a diff
    class: cohesion
    prevents: content.unclear
    severity: low
  OB-FIX-20:
    statement: A document names the audience it is written for
    rationale: Prose written for nobody in particular is read by nobody in particular
    class: coherence
    prevents: presentation.readability
    severity: low
    disposition:
      gap:
        owner: the fixture tree

controls:
  CT-FIX-1:
    mechanism: check:relation.reciprocity.missing
    discharges: [OB-FIX-1]
    trigger: pull_request
    posture: advisory
    acts: detective
  CT-FIX-2:
    mechanism: check:shelf.placement_is_primary
    discharges: [OB-FIX-2]
    trigger: pull_request
    posture: advisory
    acts: detective
  CT-FIX-3:
    mechanism: check:facet.required.missing
    discharges: [OB-FIX-3]
    trigger: pull_request
    posture: advisory
    acts: detective
  CT-FIX-4:
    mechanism: check:facet.value.not_permitted
    discharges: [OB-FIX-4]
    trigger: pull_request
    posture: advisory
    acts: detective
  CT-FIX-5:
    mechanism: check:relation.endpoint.not_permitted
    discharges: [OB-FIX-5]
    trigger: pull_request
    posture: advisory
    acts: detective
  CT-FIX-6:
    mechanism: check:relation.participation.overdue
    discharges: [OB-FIX-6]
    trigger: pull_request
    posture: advisory
    acts: detective
  CT-FIX-7:
    mechanism: check:voice.forbidden_construction
    discharges: [OB-FIX-7]
    trigger: pull_request
    posture: advisory
    acts: detective
  CT-FIX-8:
    mechanism: check:language.controlled.not_met
    discharges: [OB-FIX-8]
    trigger: pull_request
    posture: advisory
    acts: detective
  CT-FIX-9:
    mechanism: check:section.required.missing
    discharges: [OB-FIX-9]
    trigger: pull_request
    posture: advisory
    acts: detective
  CT-FIX-10:
    mechanism: check:link.fragment.unresolved
    discharges: [OB-FIX-10]
    trigger: pull_request
    posture: advisory
    acts: detective

  CT-FIX-11:
    mechanism: check:obligation.disposition.not_one
    discharges: [OB-FIX-11]
    trigger: pull_request
    posture: advisory
    acts: detective
  CT-FIX-12:
    mechanism: check:control.mechanism.unimplemented
    discharges: [OB-FIX-12]
    trigger: pull_request
    posture: advisory
    acts: detective

  # A phase of the engine. It discharges by running rather than by reporting.
  CT-FIX-13:
    mechanism: phase:census.classification
    discharges: [OB-FIX-13]
    trigger: pull_request
    posture: advisory
    acts: detective
    promotion:
      produces_facts:
        reasoning: A component that produces facts has no false-positive rate, and its instrument is this tree

  # A control over an obligation that states a gap as well, which is two
  # dispositions.
  CT-FIX-14:
    mechanism: check:relation.endpoint.not_permitted
    discharges: [OB-FIX-17]
    trigger: pull_request
    posture: advisory
    acts: detective

  # A mechanism under a prefix this engine reads, naming something it does not
  # implement.
  CT-FIX-15:
    mechanism: check:no.such.rule
    discharges: [OB-FIX-18]
    trigger: pull_request
    posture: blocking
    acts: preventive

  # A mechanism outside this engine. Spec 4 declares these, and the register
  # says only that this run did not observe it.
  CT-FIX-16:
    mechanism: scheduled:staleness-sweep
    discharges: [OB-FIX-19]
    trigger: weekly
    posture: advisory
    acts: detective
    handoff: task-per-finding
    promotion:
      criteria:
        window: two release cycles
        threshold: one finding in twenty is wrong
        sample: sixty findings, adjudicated at the periodic triage

  # A second mechanism this engine does not implement, under the other prefix
  # it reads, over an obligation that states a gap. The gap is the disposition
  # the register goes with, because nothing discharges it, and the claim on the
  # page is reported beside it.
  CT-FIX-19:
    mechanism: check:language.retired_term.used
    discharges: [OB-FIX-22]
    trigger: pull_request
    posture: advisory
    acts: detective
  CT-FIX-18:
    mechanism: check:language.source_form.not_met
    discharges: [OB-FIX-21]
    trigger: pull_request
    posture: advisory
    acts: detective
  CT-FIX-17:
    mechanism: phase:no.such.phase
    discharges: [OB-FIX-20]
    trigger: pull_request
    posture: advisory
    acts: detective
