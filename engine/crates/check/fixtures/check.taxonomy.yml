#
# The taxonomy the fixture tree is checked against. It is the smallest shape in
# which both generated checks have something to generate from: one homogeneous
# shelf and one heterogeneous one, one relation that requires reciprocity and
# one that says nothing about it.
#
# It is not a resolved package. `standin` puts the real one together, and this
# file is written out because a fixture that depended on the base package would
# change whenever the base does.

kinds:
  governed_document: {abstract: true}
  design_spec: {is_a: governed_document}
  evaluation:  {is_a: governed_document}

shelves:
  spec_series:
    path: check/spec/**
    homogeneous: false
    discriminator: doc_type
    kinds: [design_spec]
  evaluations:
    path: check/evaluations/**
    homogeneous: true
    kind: evaluation

relations:
  cites_evidence:
    family: evidence
    from: [design_spec]
    to:   [evaluation]
    inverse: cited_by
    reciprocal: required

  # No `reciprocal`, so no instance of the reciprocity check is generated over
  # it. That is the half of "generated from the taxonomy" that a corpus with one
  # relation cannot show.
  assesses:
    family: evidence
    from: [design_spec]
    to:   [governed_document]

# Two rules reach an obligation here and one does not, because both states are
# worth recording. A finding names the obligation that the control binds it to,
# and a rule that no control names says so in the report rather than carrying a
# quiet `None`. The base package binds all three.

obligations:
  OB-FIX-1:
    statement: A relation that requires reciprocity is declared at both of its ends
    rationale: One half of a pair is a claim the document at the other end never made
    class: cohesion
    prevents: content.inconsistent
    severity: medium
  OB-FIX-2:
    statement: A document does not restate in metadata what its placement already states
    rationale: A restatement is a second truth that eventually disagrees with the first
    class: cohesion
    prevents: content.inconsistent
    severity: medium

controls:
  CT-FIX-1:
    mechanism: check:relation.reciprocity.missing
    discharges: [OB-FIX-1]
    trigger: pull_request
    posture: advisory
  CT-FIX-2:
    mechanism: check:shelf.placement_is_primary
    discharges: [OB-FIX-2]
    trigger: pull_request
    posture: advisory
