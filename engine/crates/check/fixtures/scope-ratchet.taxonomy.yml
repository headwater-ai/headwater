#
# The smallest shape that exercises `relation.scope.ungoverned` (#1573). One
# anchor kind declares one scope pattern, `scope-ratchet-src/**`, and one kind
# governs it. The corpus under `scope-ratchet/` holds one document, which
# governs `a.rs` and `new_governed.rs`. Beside it, `new_ungoverned.rs` and
# `old_ungoverned.rs` sit in the scope and no edge reaches them.
# `scope-ratchet-before/` holds the version of `old_ungoverned.rs` that stood
# before the change. `tests/scope_ratchet.rs` reads this file.

identifier_schemes:
  fixture_id: {pattern: "SR-{namespace}-{slug}", namespace: FIX, allocation: minted-once}

#
# Two edges reach `new_ungoverned.rs` and neither governs it in scope, so the
# reach test is held on both of its filters. `cites` is onto the scoped anchor
# kind and is no `governance` relation. `governs_elsewhere` is a `governance`
# relation onto another anchor kind, which declares no scope.

anchors:
  code_path: {resolver: source-tree, scope: [scope-ratchet-src/**]}
  other_path: {resolver: source-tree}

kinds:
  governing_fixture:
    identifier: {scheme: fixture_id}

relations:
  governs:
    family: governance
    from: [governing_fixture]
    to:   [code_path]
    cardinality: many
  cites:
    family: association
    from: [governing_fixture]
    to:   [code_path]
    cardinality: many
  governs_elsewhere:
    family: governance
    from: [governing_fixture]
    to:   [other_path]
    cardinality: many

shelves:
  governing_fixtures:
    path: scope-ratchet/**
    homogeneous: true
    kind: governing_fixture
