# SPDX-License-Identifier: Apache-2.0
#
# The shape that exercises the removal half of `relation.scope.ungoverned`
# (#1573). One anchor kind declares one scope pattern,
# `scope-ratchet-removal-src/**`. `governs` is a `governance` relation onto it,
# and `cites` is an `association` relation onto it.
#
# The corpus under `scope-ratchet-removal/` holds two documents.
# `narrowing.md` governs `kept.rs` and `narrowed1*.rs`. `other.md` governs
# `shared.rs`. `scope-ratchet-removal-before/` holds the versions that stood
# before the change: a `narrowing.md` that also governed `dropped.rs`,
# `shared.rs` and `narrowed*.rs` and cited `stray.rs`, and a `departing.md`
# that the change deletes, which governed `departed.rs` and `gone.rs`.
# `old_debt.rs` stood ungoverned before the change and no prior entry reached
# it. `tests/scope_ratchet.rs` reads this file.

identifier_schemes:
  fixture_id: {pattern: "SRR-{namespace}-{slug}", namespace: FIX, allocation: minted-once}

#
# `governs_elsewhere` is a `governance` relation onto `other_path`, a second
# anchor kind whose scope admits `kept.rs` alone. The prior `narrowing.md`
# wrote `governs_elsewhere: stray.rs`, so a prior target is matched only
# against the scope of the anchor kind its relation reaches: `stray.rs` is in
# the `code_path` scope and not in the `other_path` scope, and it is no
# finding.

anchors:
  code_path: {resolver: source-tree, scope: [scope-ratchet-removal-src/**]}
  other_path: {resolver: source-tree, scope: [scope-ratchet-removal-src/kept.rs]}

kinds:
  governing_fixture:
    identifier: {scheme: fixture_id}

relations:
  governs:
    family: governance
    from: [governing_fixture]
    to:   [code_path]
    cardinality: many
  cites:
    family: association
    from: [governing_fixture]
    to:   [code_path]
    cardinality: many
  governs_elsewhere:
    family: governance
    from: [governing_fixture]
    to:   [other_path]
    cardinality: many

shelves:
  governing_fixtures:
    path: scope-ratchet-removal/**
    homogeneous: true
    kind: governing_fixture
