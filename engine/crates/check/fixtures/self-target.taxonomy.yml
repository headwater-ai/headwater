# SPDX-License-Identifier: Apache-2.0
#
# The taxonomy the self-target tree is checked against. One relation goes from
# a kind to that same kind, so an edge from a document to itself has both ends
# admitted: `relation.endpoint.not_permitted` passes it, and cannot be the rule
# that reports it.
#
# The relation declares an inverse, so that a document can also write the
# inverse half onto itself, and the rule has to read either half.
#
# `relates_to` is in the association family, the one family spec 2 lets point
# at its own document, so a self-edge on it is no instance of the rule.
#
# `leans_on` declares no family at all. Only a declared `association` is
# exempt, so a self-edge on a relation with no family is still reported.
#
# `governs` reaches a `code_path` anchor that `source-tree` resolves, so a path
# written under it binds as a pattern over the tree. An entry whose one literal
# pattern is the declaring document's own file is a self-reference (the owner
# ruled on #1350). A wildcard that covers the own file, and a list that holds
# the own file among other paths, are not.

facets:
  summary:
    role: scent

identifier_schemes:
  note_id: {pattern: "NOTE-{namespace}-{slug}", namespace: FIX, allocation: minted-once}

anchors:
  code_path: {resolver: source-tree}

relations:
  draws_on:
    family: evidence
    from: [explanation]
    to:   [explanation]
    inverse: drawn_on_by
    created_by: author
  leans_on:
    from: [explanation]
    to:   [explanation]
    created_by: author
  governs:
    family: governance
    from: [explanation]
    to:   [code_path]
    created_by: author
  relates_to:
    family: association
    from: [explanation]
    to:   [explanation]
    created_by: author

kinds:
  explanation:
    identifier: {scheme: note_id}

shelves:
  notes:
    path: self-target/notes/**
    homogeneous: true
    kind: explanation
