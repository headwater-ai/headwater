# SPDX-License-Identifier: Apache-2.0
#
# The smallest shape that exercises `headwater_graph::anchors::CommentScan`
# end to end: one kind whose `governs` reaches a `test_site` anchor, and four
# documents whose target files differ only in the comment each one carries.
# A `comment-scan` edge binds only where the target's comment cites the
# identifier of the document that asserts the edge, and that identifier is
# minted (#967). So `minted/` cites its own minted identifier and is clean,
# `unminted/` cites its own identifier, which the test's list does not hold,
# `other/` cites a different minted identifier and nothing else, and `two/`
# cites that other identifier first and its own second.
#
# The scheme is `{namespace}-VER-{seq:04d}` with namespace `HW`, and not the
# `CS-FIX-{slug}` it was before #967, so that each document's own identifier
# carries the `HW-VER-` prefix the resolver scans for. That is the shape of
# the verification identifier this repository's overlay declares, so the
# fixture exercises the prefix an adopter meets rather than one invented for
# the test.
#
# `Resolvers::over` is not enough here: `comment-scan` is not `source-tree`, so
# this file's test builds a `Resolvers` set by hand, with a
# [`headwater_graph::anchors::CommentScan`] over a fixed "minted" set rather
# than one read from a claim store on disk. `engine/crates/cli/src/main.rs` is
# what reads the claim store for a real run; this tree holds the behavior the
# resolver has once it is built, which is `headwater_check::run`'s business.

facets:
  status:
    role: state
    required: true
    values:
      - {value: draft,   role: initial}
      - {value: current, role: live}
      - {value: retired, role: terminal-retained}
  status_since:
    role: state_entered
    required: true
  summary:
    role: scent
    required: true

regimes:
  lifecycle:
    standard:
      initial: draft
      transitions: {draft: [current], current: [retired]}

identifier_schemes:
  fixture_id: {pattern: "{namespace}-VER-{seq:04d}", namespace: HW, allocation: minted-once}

anchors:
  test_site: {resolver: comment-scan}

kinds:
  verification_fixture:
    identifier: {scheme: fixture_id}
    lifecycle: standard
    facets: {require: [status, status_since, summary]}

relations:
  governs:
    family: governance
    from: [verification_fixture]
    to:   [test_site]
    cardinality: many
    created_by: author

shelves:
  verification_fixtures:
    path: comment-scan-target/**
    homogeneous: true
    kind: verification_fixture
