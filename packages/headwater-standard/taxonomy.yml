# SPDX-License-Identifier: Apache-2.0
#
# The base package of headwater/standard, as a file.
#
# It was derived rather than chosen: the first-run walkthrough
# (docs/evaluations/default-taxonomy-first-run.md) reads the immutable core and
# writes out the smallest taxonomy that satisfies it, then measures what five
# adopters add and delete over it. That walkthrough held the only committed copy
# of this content, as a fenced block inside its prose, and every tool that
# wanted the base parsed Markdown to reach it. This file ends that.
#
# The block in the walkthrough stays where it is, because it is the record of a
# derivation and not a source. This file is the source.
#
# One key differs from the block. It opened `package: headwater/standard`, which
# is the manifest key of spec 7 standing in front of eleven taxonomy
# declarations. `package` is a reserved reference root, so a taxonomy source may
# not declare it. The manifest is `package.yml` beside this file, and a taxonomy
# source names itself with `taxonomy:`.

taxonomy: headwater/standard
version: 1.0.0

purposes:
  rationale:
    intent: explain why a choice was made and what it forecloses
    answers: ["why is it this way", "what was rejected", "what does this constrain"]
  behavior:
    intent: state what the system does, as it is now
    answers: ["what does this component do", "what may I rely on"]

vocabularies:
  lifecycle_state:
    - {value: draft,      role: initial}
    - {value: current,    role: live}
    - {value: superseded, role: terminal-retained}
    - {value: deprecated, role: terminal-retained}

# Every facet declares `volatility`, and every enum value carries guidance. Both
# are facet acceptance tests of spec 2 (Facet acceptance tests), and `taxonomy
# validate` fails a facet that omits either. The four facets here are all
# `mutable`, which is what keeps a value of any of them out of an identifier, a
# path and a shelf pattern.

facets:
  status:
    role: state
    values: $vocabularies.lifecycle_state
    required: true
    volatility: mutable
    guidance:
      draft: the document is being written or argued over, and nothing may rely on it
      current: the document states what holds now, and a reader may rely on it
      superseded: a later document replaced this one, and the succession edge names it
      deprecated: the document is no longer to be relied on, and nothing replaced it
  status_since:
    role: state_entered
    type: date
    required: true
    volatility: mutable
  last_verified:
    role: freshness
    type: date
    stale_after_days: 180
    volatility: mutable
  summary:
    role: scent
    type: string
    required: true
    volatility: mutable

regimes:
  lifecycle:
    standard:
      initial: draft
      transitions: {draft: [current, deprecated], current: [superseded, deprecated]}
      retain_terminal: true
  voice:
    declarative: {forbid: [future_intent, change_narration, phased_rollout]}
  language:
    default: {tag: en-US, controlled: none}

anchors:
  code_path: {resolver: source-tree}

kinds:
  governed_document:
    abstract: true
    facets: {require: [status, status_since, last_verified, summary]}
  decision:
    is_a: governed_document
    purpose: rationale
    identifier: {scheme: decision_id}
    voice: declarative
    lifecycle: standard
    sections: {require: [Context, Decision, Consequences]}
  specification:
    is_a: governed_document
    purpose: behavior
    voice: declarative
    lifecycle: standard
    sections: {require: [Scope, Behavior]}

relations:
  supersedes:
    family: succession
    from: [governed_document]
    to:   [governed_document]
    inverse: superseded_by
    reciprocal: required
    nuclearity: multinuclear
    on_target: {set_state: superseded}
    created_by: scaffold
  governs:
    family: governance
    from: [governed_document]
    to:   [code_path]
    cardinality: many
    created_by: hook
  constrains:
    family: governance
    from: [decision]
    to:   [decision]
    created_by: agent
  conflicts_with:
    family: association
    from: [decision]
    to:   [decision]
    reciprocal: symmetric
    nuclearity: multinuclear
    invalid_when: {both: {status: current}}
    created_by: agent
  traces_to:
    family: evidence
    from: [governed_document]
    to:   [governed_document, code_path]
    created_by: hook

shelves:
  decisions:      {path: docs/decisions/**,      homogeneous: true, kind: decision}
  specifications: {path: docs/specifications/**, homogeneous: true, kind: specification}

identifier_schemes:
  decision_id: {pattern: "DR-{namespace}-{seq:04d}", namespace: repo, allocation: reconcile-first}

core:
  requires:
    - facet_role: state
    - facet_role: freshness
    - facet_role: scent
    - purpose: rationale
    - purpose: behavior
    - relation_family: succession
      lifecycle_sensitive: true

projections:
  - {kind: shelf_index, for: [decisions, specifications], output: "{shelf}/README.md"}

# Spec 4 (Obligations are data) rules that every finding names the obligation it
# serves, and spec 12 makes that a required method on a check. An obligation is
# data, so it is declared here or it is nowhere. The set below is derived the
# way the rest of this file is: one obligation for each check that these
# declarations generate, and the three coverage obligations that spec 4 states
# for every corpus.
#
# The key is the identifier. `prevents` names a class of the documentation
# defect taxonomy that spec 4 walks, and no declaration in the language holds
# that taxonomy yet.

obligations:

  OB-COV-1:
    statement: Every file under the corpus root is classified, or reported as unclassifiable
    rationale: The most broken document is the one that classification is most likely to miss, and a run that never saw it reports nothing about it
    class: cohesion
    prevents: process.maintenance
    severity: high

  OB-COV-2:
    statement: Every classified document is routed to at least one check
    rationale: A document that matched no check is indistinguishable from a document that passed every check
    class: cohesion
    prevents: process.maintenance
    severity: high

  OB-COV-3:
    statement: Every run reports what it saw, classified, checked and skipped, with a reason for each skip
    rationale: No findings across 380 of 412 documents is a different result from no findings across 412, and a report that cannot tell the two apart earns no trust
    class: cohesion
    prevents: process.traceability
    severity: medium

  OB-REL-1:
    statement: A relation that requires reciprocity is declared at both of its ends
    rationale: One half of a pair is a claim that the document at the other end never made
    class: cohesion
    prevents: content.inconsistent
    severity: medium

  OB-PLACE-1:
    statement: A document does not restate in metadata what its placement already states
    rationale: A restatement is a second truth that eventually disagrees with the first
    class: cohesion
    prevents: content.inconsistent
    severity: medium

  OB-FACET-1:
    statement: Every facet a kind requires is declared by every document of that kind
    rationale: A facet nobody declared is a question the corpus cannot answer about itself, and the reader who asks it gets silence rather than a gap
    class: cohesion
    prevents: content.incomplete
    severity: high

  OB-FACET-2:
    statement: A facet with a declared value set carries one of the values in that set
    rationale: A value outside the set is a state that no reader, no query and no projection can act on, and it reads as a state rather than as an error
    class: cohesion
    prevents: content.inconsistent
    severity: medium

  OB-REL-2:
    statement: Both ends of a relation instance are kinds that the relation permits
    rationale: An edge between kinds a relation forbids is an assertion that the taxonomy never sanctioned, and every query over that relation inherits it
    class: cohesion
    prevents: content.inconsistent
    severity: medium

  OB-VOICE-1:
    statement: Prose of a kind under a voice regime does not use the constructions that regime forbids
    rationale: A specification that narrates change cannot be read for what holds now, and a reader who cannot tell today from last quarter reads every sentence twice
    class: cohesion
    prevents: content.inconsistent
    severity: low

  OB-LANG-1:
    statement: Prose of a kind under a language regime obeys the controlled language and the variant it names
    rationale: A rule that lives in a contributing guide is a rule that no check reads and that every new author learns by being corrected
    class: cohesion
    prevents: content.unclear
    severity: low

  OB-SECT-1:
    statement: Every section a kind requires is a heading of every document of that kind
    rationale: A document that omits a section leaves unanswered the question its kind promised to answer, and a reader cannot tell that from an answer of none
    class: cohesion
    prevents: content.incomplete
    severity: high

  OB-LINK-1:
    statement: A fragment that a document writes into itself names a heading of that document
    rationale: A link that lands nowhere costs the reader the paragraph it was written to reach, and an anchor rots silently when the heading beside it is edited
    class: cohesion
    prevents: content.inconsistent
    severity: medium

  OB-REL-3:
    statement: A participation expectation is met inside the window the taxonomy declares
    rationale: A document that nothing links to inside its window is work that reached nobody, and the corpus cannot tell that from work nobody needed
    class: cohesion
    prevents: process.maintenance
    severity: low

# A control names the mechanism that discharges an obligation. The engine reads
# one mechanism prefix, `check:`, and what follows it is the id of a rule. That
# is the binding a finding travels along: a rule reaches its obligation through
# the control that names it.
#
# OB-COV-1 and OB-COV-3 carry no control here, and that is visible rather than
# hidden. Neither is discharged by a rule. The census classifies every file and
# the runner reports coverage, so both mechanisms are phases of the engine that
# no `check:` prefix names. Spec 4 gives such an obligation the disposition
# `gap`, and the language has no member that says so. Spec 13 carries it.

controls:

  CT-COV-2:
    mechanism: check:coverage.document_unchecked
    discharges: [OB-COV-2]
    trigger: pull_request
    posture: advisory

  CT-REL-1:
    mechanism: check:relation.reciprocity.missing
    discharges: [OB-REL-1]
    trigger: pull_request
    posture: advisory

  CT-PLACE-1:
    mechanism: check:shelf.placement_is_primary
    discharges: [OB-PLACE-1]
    trigger: pull_request
    posture: advisory

  CT-FACET-1:
    mechanism: check:facet.required.missing
    discharges: [OB-FACET-1]
    trigger: pull_request
    posture: advisory

  CT-FACET-2:
    mechanism: check:facet.value.not_permitted
    discharges: [OB-FACET-2]
    trigger: pull_request
    posture: advisory

  CT-REL-2:
    mechanism: check:relation.endpoint.not_permitted
    discharges: [OB-REL-2]
    trigger: pull_request
    posture: advisory

  CT-REL-3:
    mechanism: check:relation.participation.overdue
    discharges: [OB-REL-3]
    trigger: pull_request
    posture: advisory

  CT-VOICE-1:
    mechanism: check:voice.forbidden_construction
    discharges: [OB-VOICE-1]
    trigger: pull_request
    posture: advisory

  CT-LANG-1:
    mechanism: check:language.controlled.not_met
    discharges: [OB-LANG-1]
    trigger: pull_request
    posture: advisory

  CT-SECT-1:
    mechanism: check:section.required.missing
    discharges: [OB-SECT-1]
    trigger: pull_request
    posture: advisory

  CT-LINK-1:
    mechanism: check:link.fragment.unresolved
    discharges: [OB-LINK-1]
    trigger: pull_request
    posture: advisory
