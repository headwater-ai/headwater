#
# The consumer declaration for the n8n worked-instance corpus. It is not read
# from here: `headwater check` reads one corpus root, and this tree sits inside
# a directory that this repository excludes from its own corpus. `README.md`
# beside this directory states the three commands that assemble a scratch root
# out of this file, `overlay.yml`, `packages/headwater-standard/` and
# `corpus/packages/@n8n/`.
#
# `corpus.root` is `packages` and not `docs`, because n8n keeps its governed
# prose beside the code it governs and has no docs root that carries any. That
# is the whole subject of the run this fixture records.

taxonomy:
  package: headwater/standard
  version: 3.5.0
  bundles: [design-spec, evidence-and-obligation]
  overlay: .headwater/overlay.yml

# The exclusion is forced, and it is a finding rather than housekeeping. A
# taxonomy package is found under `packages/`, and n8n's governed prose is
# under `packages/` too. A corpus root that reaches the second reaches the
# first, so the run has to be told that the package it resolves is not corpus
# content. The design-spec, standards-spec and brd-prd fixtures never met this,
# because each of them roots its corpus at `docs`.
corpus:
  root: packages
  exclude:
    - path: packages/headwater-standard/**
      reason: >-
        package content. The taxonomy package this run resolves lives under
        `packages/`, which is also where n8n's governed prose lives.
