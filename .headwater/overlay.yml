# SPDX-License-Identifier: Apache-2.0
#
# This repository's overlay over headwater/standard 1.0.0 plus the design-spec
# bundle. An adopter overlay may add, override and remove. This one only adds.
#
# It exists because of one ordering constraint. Q4 rules that a relation target
# is an identifier and never a path, and no document in this corpus had an
# identifier. Neither the base nor the design-spec bundle gives one to a
# document, so the corpus mints its own here before it can declare an edge.
#
# `.headwater/README.md` records every place where this file guesses.

add:

  # --- identifier schemes ---------------------------------------------------
  # One scheme per kind group, each with a distinct literal prefix, so that no
  # two schemes in the namespace admit the same string (spec 2, identifier
  # integrity). The namespace is `HW` and it is part of every identifier, which
  # is the one lexical requirement that the invariant core makes.
  #
  # The local part is a minted slug and not the file name. A slug that a path
  # derives dies at the first rename, which is the defect that the OWL and SKOS
  # emitter already reports against its invented document IRI.

  identifier_schemes.spec_id:
    pattern: "SPEC-{namespace}-{slug}"
    namespace: HW
    allocation: minted-once

  identifier_schemes.register_id:
    pattern: "REG-{namespace}-{slug}"
    namespace: HW
    allocation: minted-once

  identifier_schemes.evaluation_id:
    pattern: "EVAL-{namespace}-{slug}"
    namespace: HW
    allocation: minted-once

  identifier_schemes.review_id:
    pattern: "REV-{namespace}-{slug}"
    namespace: HW
    allocation: minted-once

  # --- the kinds that carry them --------------------------------------------
  # The base gives `decision` an identifier and gives `specification` none. The
  # design-spec bundle adds six kinds and no identifier. Every one of the six is
  # a relation endpoint in this corpus, so every one needs a scheme.

  kinds.design_spec.identifier:         {scheme: spec_id}
  kinds.decision_register.identifier:   {scheme: register_id}
  kinds.obligation_register.identifier: {scheme: register_id}
  kinds.evaluation.identifier:          {scheme: evaluation_id}
  kinds.review_prompt.identifier:       {scheme: review_id}
  kinds.review_record.identifier:       {scheme: review_id}

  # --- the measurement layer ------------------------------------------------
  # Spec 5 (Measuring whether any of this works) says what a probe is: "a
  # document in the corpus, with a kind, a shelf, an identifier and an
  # acceptance", declaring a category, a task statement and an expectation from
  # a closed set. Nothing declared either kind until this block, so `headwater
  # probe` had no input and every efficacy claim in this corpus was unmeasured
  # for want of a declaration rather than for want of a run.
  #
  # It is in this overlay and not in the base package, because
  # [OBL-repo-0025](../docs/obligations/0025-where-the-probe-kind-ships-is-an-unsettled-clustering-question.md)
  # holds the clustering question open and no adopter has selected anything.
  # This repository declaring that it holds probes answers a different question
  # from every adopter of the package getting them, and the record stays open.
  #
  # Both kinds are kinds `headwater new` refuses, and the two refusals do not
  # mean the same thing. A category and an expectation are the author's
  # judgment, so a required closed value set with no role that determines it is
  # the cost this block accepts, and the check layer still reports a probe that
  # omits either. A transcript is written by the harness rather than by a
  # person, so a scaffolder that refuses to write one is right.

  identifier_schemes.probe_id:
    pattern: "PROBE-{namespace}-{slug}"
    namespace: HW
    allocation: minted-once

  # The local part of a run identity is a slug and not a digest, for the reason
  # every other scheme here mints one: a digest in an identifier is a value that
  # dies when the thing it covers is recomputed, and the run identity that a
  # transcript carries in its body is where the digests belong.
  identifier_schemes.run_id:
    pattern: "RUN-{namespace}-{slug}"
    namespace: HW
    allocation: minted-once

  facets.probe_category:
    values: [discovery, sufficiency, navigability, consistency]
    required: false
    volatility: stable
    guidance:
      discovery: the probe asks whether the agent finds the governing document at all
      sufficiency: the probe asks whether the agent has enough to act correctly once it has found the document
      navigability: the probe asks whether the agent gets from a code path to the governing document and back
      consistency: the probe asks whether two phrasings of one question reach one answer

  # The closed predicate set of spec 5. It is closed for the reason the sweep's
  # class set is: a form nobody declared is a form no grader can evaluate and no
  # report can total.
  facets.expectation:
    values: [opened, not_opened, cited, answered, patched]
    required: false
    volatility: stable
    guidance:
      opened: the transcript shows that the session read one of the documents this probe names
      not_opened: the transcript shows that the session read none of them
      cited: a produced artifact cites one of the identifiers this probe names
      answered: the final answer is one named value from the closed set this probe declares
      patched: a produced patch passes the check this probe names

  facets.tier:
    values: [regression, campaign]
    required: false
    volatility: stable
    guidance:
      regression: a fixed scenario set in one arm against a recorded baseline, which establishes no effect
      campaign: both arms, powered, one batch and one model version, for one named claim

  facets.arm:
    values: [present, absent]
    required: false
    volatility: stable
    guidance:
      present: the session ran against the corpus
      absent: the session ran against the declared ablation of it

  kinds.probe:
    is_a: governed_document
    purpose: evidence
    voice: declarative
    lifecycle: standard
    identifier: {scheme: probe_id}
    facets:
      require: [probe_category, expectation]
    sections:
      require: [Task, Expectation]

  kinds.probe_transcript:
    is_a: governed_document
    purpose: evidence
    voice: narrative
    lifecycle: standard
    identifier: {scheme: run_id}
    facets:
      require: [tier, arm]
    sections:
      require: [Run identity, Events]

  # The documents an `opened`, `not_opened` or `cited` expectation names. A
  # separate relation and not `traces_to`, because a grader has to tell the
  # targets of the predicate apart from the provenance of the probe, and one
  # relation carrying both would make every citation an expectation.
  relations.examines:
    family: evidence
    from: [probe]
    to:   [governed_document]
    cardinality: many
    created_by: author

  # `generator`, and the word is the whole argument of this layer. A transcript
  # that a person or an agent typed is a self-report, and spec 5 refuses one.
  relations.records:
    family: evidence
    from: [probe_transcript]
    to:   [probe]
    cardinality: many
    created_by: generator

  shelves.probes:
    path: docs/probes/**
    homogeneous: true
    kind: probe

  # Disjoint from the shelf above rather than under it, because `docs/probes/**`
  # would claim a path below it and two shelves that claim one path resolve a
  # kind by accident.
  shelves.probe_runs:
    path: docs/probe-runs/**
    homogeneous: true
    kind: probe_transcript

  # --- the controlled language of this repository ---------------------------
  # The base declares `controlled: none`, and the design-spec entry declines to
  # bind a language regime because RFCs are not written in Simplified Technical
  # English. This repository does hold its specification prose to a profile, and
  # this block is where it says so.
  #
  # Three members, and they answer three different questions. `controlled` and
  # `profile` name the writing rules. `source_form` is about the file rather
  # than the prose: CLAUDE.md asks for one logical line per paragraph, list item
  # or blockquote paragraph, with a deliberate break written as a trailing
  # backslash. `retired_terms` is the house list of stock phrasing that CLAUDE.md
  # states in prose, moved to where a check reads it. Each entry states why the
  # term is retired. None of them names a replacement, and that is the whole of
  # the judgment: a stock metaphor is repaired by naming the thing it stands in
  # for, and no substitution does that ([spec 2](../docs/spec/02-taxonomy-model.md)).

  regimes.language.ste_house:
    tag: en-US
    controlled: ASD-STE100
    profile: house
    source_form: one_line_per_block
    retired_terms:
      - term: load-bearing
        reason: it stands in for the thing that depends on it
      - term: load bearing
        reason: it stands in for the thing that depends on it
      - term: first-class
        reason: it stands in for what the thing actually gets
      - term: first class
        reason: it stands in for what the thing actually gets
      - term: battle-tested
        reason: it stands in for where the thing has run and for how long
      - term: battle tested
        reason: it stands in for where the thing has run and for how long
      - term: north star
        reason: it stands in for the goal
      - term: delve
        reason: it stands in for examine, study or read
      - term: seamless
        reason: it stands in for what the joins would otherwise cost
      - term: seamlessly
        reason: it stands in for what the joins would otherwise cost
      - term: holistic
        reason: it stands in for the parts it covers
      - term: holistically
        reason: it stands in for the parts it covers
      - term: deep dive
        reason: it stands in for a detailed review
      - term: leverage
        reason: it stands in for use or apply
      - term: leverages
        reason: it stands in for use or apply
      - term: leveraged
        reason: it stands in for use or apply
      - term: leveraging
        reason: it stands in for use or apply
      - term: robust
        reason: it stands in for the failure the thing survives

  kinds.design_spec.language:         ste_house
  kinds.decision_register.language:   ste_house
  kinds.obligation_register.language: ste_house

  # The obligation records carry the prose that the obligation register held
  # until #126 moved it. The regime follows the prose rather than the file it
  # sits in, so a rule that read a paragraph in `docs/spec/` still reads it on
  # `docs/obligations/`. Without this line the conversion would have taken 101
  # paragraphs of this repository's own writing out of every language rule.
  kinds.obligation_record.language:   ste_house

# --- projections ------------------------------------------------------------
# `projections` is a list in the base, so an `add` cannot reach it, and this is
# the one operation in this file that is not an `add`. Spec 13 records that
# nothing states whether a *bundle* may use `add_to`. An adopter overlay is not
# a bundle, and spec 2 supplies the operation for a list.
#
# The base declares an index for the two shelves that it declares, and this
# corpus holds neither of them. The shelf that this corpus does hold is
# `spec_series`, which the design-spec bundle declares. The specification table
# in the root README was the copy of that shelf that a human kept aligned, and
# the index below replaced it.

add_to:

  projections:
    - kind: shelf_index
      for: [spec_series]
      output: "{shelf}/README.md"

    # The redirect map. `docs/spec/09-open-questions.md` is a tombstone: all
    # twenty-one questions closed, each one is a document on the decisions shelf
    # now, and 136 citations in this corpus name an anchor in this file. An
    # anchor exists because a heading does, so the file has to keep writing one
    # heading for each decision, which is what `shelf_sections` does.
    #
    # The `identity` block is why a projection may take this path at all. Three
    # documents name `REG-HW-open-questions`, and a generated file with no front
    # matter holds no identifier, so all three edges would resolve to nothing.
    # The block declares the identifier and the kind, and the engine derives the
    # rest: `doc_type` because the `spec_series` shelf is heterogeneous, and the
    # `superseded_by` half of each `supersedes` that another document declares
    # into this one.
    - kind: shelf_sections
      for: [decisions]
      output: docs/spec/09-open-questions.md
      identity:
        id: REG-HW-open-questions
        kind: decision_register
