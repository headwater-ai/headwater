# SPDX-License-Identifier: Apache-2.0
#
# This repository's overlay over headwater/standard 2.0.0 plus the design-spec
# bundle. An adopter overlay may add, override and remove. This one only adds.
#
# It exists because of one ordering constraint. Q4 rules that a relation target
# is an identifier and never a path, and no document in this corpus had an
# identifier. Neither the base nor the design-spec bundle gives one to a
# document, so the corpus mints its own here before it can declare an edge.
#
# `.headwater/README.md` records every place where this file guesses.

add:

  # --- identifier schemes ---------------------------------------------------
  # One scheme per kind group, each with a distinct literal segment after the
  # namespace, so that no two schemes in the namespace admit the same string
  # (spec 2, identifier integrity). The namespace is `HW` and it opens every
  # identifier this corpus mints.
  #
  # The namespace is declared here and in no shipped source. The base package
  # and the decision-record bundle both leave `decision_id` and
  # `obligation_record_id` without one, because a constant either of them wrote
  # would be minted by every adopter at once. The two lines below are this
  # corpus answering that question for itself, and they are the reason the
  # resolved taxonomy carries a namespace on every scheme where this file
  # declares one on eight. `.headwater/taxonomy.lock` is where the resolved set
  # is counted, and it holds ten schemes today.
  # [Q25](../docs/decisions/0025-q25-where-the-namespace-goes-in-an-identifier-and-who-declares-it.md)
  # is the ruling on both halves.
  #
  # The local part is a minted slug and not the file name. A slug that a path
  # derives dies at the first rename, which is the defect that the OWL and SKOS
  # emitter already reports against its invented document IRI.

  identifier_schemes.decision_id.namespace: HW
  identifier_schemes.obligation_record_id.namespace: HW

  identifier_schemes.spec_id:
    pattern: "{namespace}-SPEC-{slug}"
    namespace: HW
    allocation: minted-once

  identifier_schemes.register_id:
    pattern: "{namespace}-REG-{slug}"
    namespace: HW
    allocation: minted-once

  identifier_schemes.evaluation_id:
    pattern: "{namespace}-EVAL-{slug}"
    namespace: HW
    allocation: minted-once

  identifier_schemes.review_id:
    pattern: "{namespace}-REV-{slug}"
    namespace: HW
    allocation: minted-once

  # --- the kinds that carry them --------------------------------------------
  # The base gives `decision` an identifier and gives `specification` none. The
  # design-spec bundle adds six kinds and no identifier. Every one of the six is
  # a relation endpoint in this corpus, so every one needs a scheme.

  kinds.design_spec.identifier:         {scheme: spec_id}
  kinds.decision_register.identifier:   {scheme: register_id}
  kinds.obligation_register.identifier: {scheme: register_id}
  kinds.evaluation.identifier:          {scheme: evaluation_id}
  kinds.review_prompt.identifier:       {scheme: review_id}
  kinds.review_record.identifier:       {scheme: review_id}

  # --- the measurement layer ------------------------------------------------
  # Spec 5 (Measuring whether any of this works) says what a probe is: "a
  # document in the corpus, with a kind, a shelf, an identifier and an
  # acceptance", declaring a category, a task statement and an expectation from
  # a closed set. Nothing declared either kind until this block, so `headwater
  # probe` had no input and every efficacy claim in this corpus was unmeasured
  # for want of a declaration rather than for want of a run.
  #
  # It is in this overlay and not in the base package, because
  # [HW-OBL-0025](../docs/obligations/0025-where-the-probe-kind-ships-is-an-unsettled-clustering-question.md)
  # holds the clustering question open and no adopter has selected anything.
  # This repository declaring that it holds probes answers a different question
  # from every adopter of the package getting them, and the record stays open.
  #
  # **The four closed value sets below are required, and getting there needed a
  # change to `headwater new`.** Two rules of this taxonomy language meet on a
  # facet whose value is the author's judgment, and neither yielded: the facet
  # canons refuse a facet that no kind requires as unread, and the scaffolder
  # refuses a kind that requires a closed value set no role determines. A probe
  # category is exactly such a value, so the `probe` kind fell between the two
  # and could be written by no route this engine offered. `headwater new
  # --facet <facet>=<value>` is that route. The value is validated against the
  # set before anything is written and recorded as hand entry, because a person
  # typed it.

  identifier_schemes.probe_id:
    pattern: "{namespace}-PROBE-{slug}"
    namespace: HW
    allocation: minted-once

  # The local part of a run identity is a slug and not a digest, for the reason
  # every other scheme here mints one: a digest in an identifier is a value that
  # dies when the thing it covers is recomputed, and the run identity that a
  # transcript carries in its body is where the digests belong.
  identifier_schemes.run_id:
    pattern: "{namespace}-RUN-{slug}"
    namespace: HW
    allocation: minted-once

  # A result is minted from the transcript it grades, so the slug of one is the
  # slug of the other. A separate scheme and not `run_id` again, because the two
  # are two nodes: an edge that named `HW-RUN-first` reaches the transcript, and
  # a citation of a rate has to reach the document that reports the rate.
  identifier_schemes.result_id:
    pattern: "{namespace}-RESULT-{slug}"
    namespace: HW
    allocation: minted-once

  facets.probe_category:
    values: [discovery, sufficiency, navigability, consistency]
    required: false
    volatility: stable
    guidance:
      discovery: the probe asks whether the agent finds the governing document at all
      sufficiency: the probe asks whether the agent has enough to act correctly once it has found the document
      navigability: the probe asks whether the agent gets from a code path to the governing document and back
      consistency: the probe asks whether two phrasings of one question reach one answer

  # The closed predicate set of spec 5. It is closed for the reason the sweep's
  # class set is: a form nobody declared is a form no grader can evaluate and no
  # report can total.
  facets.expectation:
    values: [opened, not_opened, cited, answered, patched]
    required: false
    volatility: stable
    guidance:
      opened: the transcript shows that the session read one of the documents this probe names
      not_opened: the transcript shows that the session read none of them
      cited: a produced artifact cites one of the identifiers this probe names
      answered: the final answer is one named value from the closed set this probe declares
      patched: a produced patch passes the check this probe names

  facets.tier:
    values: [regression, campaign]
    required: false
    volatility: stable
    guidance:
      regression: a fixed scenario set in one arm against a recorded baseline, which establishes no effect
      campaign: both arms, powered, one batch and one model version, for one named claim

  facets.arm:
    values: [present, absent]
    required: false
    volatility: stable
    guidance:
      present: the session ran against the corpus
      absent: the session ran against the declared ablation of it

  # The check a `patched` expectation grades a produced patch against, which
  # spec 5 calls the oracle route.
  #
  # **Every probe declares one, and four of the five expectation forms declare
  # `none`.** That reads as a field with a sentinel in it, and it is: the
  # taxonomy language has no way to say "required when another facet holds one
  # value", and a facet that no kind requires is refused as unread. So the
  # choice is a sentinel or a declaration this language cannot make.
  # [HW-OBL-0123](../docs/obligations/0123-a-facet-that-applies-to-one-value-of-another-facet-has-nowhere-to-say-so.md)
  # holds it. `headwater probe plan` enforces the pairing in both directions: a
  # `patched` probe that declares `none`, and a probe of any other form that
  # names a rule, each stop the run.
  facets.oracle:
    type: string
    required: false
    volatility: stable

  # `title` joins the three facets below because this shelf is rendered as a
  # list. `probes` carries a generated index and a navigation group, and both
  # read the facet in the `name` role, so a probe with no title renders as
  # `HW-PROBE-a-cold-agent-reaches-the-governing-document-through-the-corpus-descriptor`
  # (#427). headwater/standard declares the facet from 4.0.0. `probe_category`
  # is the discriminator a reader would otherwise scan for, and it is a value
  # from a closed set rather than a name.
  kinds.probe:
    is_a: governed_document
    purpose: evidence
    voice: declarative
    lifecycle: standard
    identifier: {scheme: probe_id}
    facets:
      require: [probe_category, expectation, oracle, title]
    sections:
      require: [Task, Expectation]

  kinds.probe_transcript:
    is_a: governed_document
    purpose: evidence
    voice: narrative
    lifecycle: standard
    identifier: {scheme: run_id}
    facets:
      require: [tier, arm]
    sections:
      require: [Run identity, Events]

  # What `headwater generate` writes over one transcript. Spec 5: "The probe
  # result is a document, generated from the transcript, the expectations and the
  # grader version. It carries the `regenerated` warrant, and `generate --check`
  # proves it."
  #
  # It requires no section and no facet of its own, and the reason is the one
  # spec 6 gives for every projection: a generated file is excused from the
  # document checks, because its content is a function of the emitter rather than
  # of an author. A required section here would be a rule that nothing reads, and
  # the emitter is what holds the shape.
  kinds.probe_result:
    is_a: governed_document
    purpose: evidence
    voice: declarative
    lifecycle: standard
    identifier: {scheme: result_id}

  # What an `opened`, `not_opened` or `cited` expectation names. A separate
  # relation and not `traces_to`, because a grader has to tell the targets of
  # the predicate apart from the provenance of the probe, and one relation
  # carrying both would make every citation an expectation.
  #
  # `code_path` is the second end, and it is the end that makes one measurement
  # possible at all. Spec 5 says the reach of a skill is a measurement rather
  # than a property, and the `opened` expectation over a transcript is the
  # instrument. A skill file sits outside the corpus root, so a relation that
  # named only a governed document could not point at one and that measurement
  # would have no probe. The anchor resolver already reaches it.
  relations.examines:
    family: evidence
    from: [probe]
    to:   [governed_document, code_path]
    cardinality: many
    created_by: author

  # `generator`, and the word is the whole argument of this layer. A transcript
  # that a person or an agent typed is a self-report, and spec 5 refuses one.
  relations.records:
    family: evidence
    from: [probe_transcript]
    to:   [probe]
    cardinality: many
    created_by: generator

  shelves.probes:
    path: docs/probes/**
    homogeneous: true
    kind: probe

  # Disjoint from the shelf above rather than under it, because `docs/probes/**`
  # would claim a path below it and two shelves that claim one path resolve a
  # kind by accident.
  shelves.probe_runs:
    path: docs/probe-runs/**
    homogeneous: true
    kind: probe_transcript

  # A third shelf and not a second kind on the one above it, because a
  # homogeneous shelf is what keeps the front matter of a generated document
  # short. The shelf states the kind, spec 2 forbids a facet that restates it,
  # and the block the emitter writes is then an identifier and nothing else.
  shelves.probe_results:
    path: docs/probe-results/**
    homogeneous: true
    kind: probe_result

  # --- the controlled language of this repository ---------------------------
  # The base declares `controlled: none`, and the design-spec entry declines to
  # bind a language regime because RFCs are not written in Simplified Technical
  # English. This repository does hold its specification prose to a profile, and
  # this block is where it says so.
  #
  # Three members, and they answer three different questions. `controlled` and
  # `profile` name the writing rules. `source_form` is about the file rather
  # than the prose: CLAUDE.md asks for one logical line per paragraph, list item
  # or blockquote paragraph, with a deliberate break written as a trailing
  # backslash. `retired_terms` is the house list of stock phrasing that CLAUDE.md
  # states in prose, moved to where a check reads it. Each entry states why the
  # term is retired. None of them names a replacement, and that is the whole of
  # the judgment: a stock metaphor is repaired by naming the thing it stands in
  # for, and no substitution does that ([spec 2](../docs/spec/02-taxonomy-model.md)).

  regimes.language.ste_house:
    tag: en-US
    controlled: ASD-STE100
    profile: house
    source_form: one_line_per_block
    retired_terms:
      - term: load-bearing
        reason: it stands in for the thing that depends on it
      - term: load bearing
        reason: it stands in for the thing that depends on it
      - term: first-class
        reason: it stands in for what the thing actually gets
      - term: first class
        reason: it stands in for what the thing actually gets
      - term: battle-tested
        reason: it stands in for where the thing has run and for how long
      - term: battle tested
        reason: it stands in for where the thing has run and for how long
      - term: north star
        reason: it stands in for the goal
      - term: delve
        reason: it stands in for examine, study or read
      - term: seamless
        reason: it stands in for what the joins would otherwise cost
      - term: seamlessly
        reason: it stands in for what the joins would otherwise cost
      - term: holistic
        reason: it stands in for the parts it covers
      - term: holistically
        reason: it stands in for the parts it covers
      - term: deep dive
        reason: it stands in for a detailed review
      - term: leverage
        reason: it stands in for use or apply
      - term: leverages
        reason: it stands in for use or apply
      - term: leveraged
        reason: it stands in for use or apply
      - term: leveraging
        reason: it stands in for use or apply
      - term: robust
        reason: it stands in for the failure the thing survives

  kinds.design_spec.language:         ste_house
  kinds.decision_register.language:   ste_house
  kinds.obligation_register.language: ste_house

  # The obligation records carry the prose that the obligation register held
  # until #126 moved it. The regime follows the prose rather than the file it
  # sits in, so a rule that read a paragraph in `docs/spec/` still reads it on
  # `docs/obligations/`. Without this line the conversion would have taken 101
  # paragraphs of this repository's own writing out of every language rule.
  kinds.obligation_record.language:   ste_house

  # A decision record is a normative statement that this repository makes about
  # itself. It stands to `docs/spec/09-decisions.md` as an obligation record
  # stands to its own register, and the register was bound where the record was
  # not. No document stated why. [Q27](../docs/spec/09-decisions.md#q27--whether-a-decision-record-is-governed-prose)
  # rules that a decision record is governed prose, and it states what this line
  # costs: 64 findings on the shelf when it was taken, every one of them
  # advisory, and one of them caused by an inline quotation. The kinds that stay
  # unbound carry text that this repository recorded rather than wrote, and Q27
  # names each one.
  kinds.decision.language:            ste_house

  # An evaluation is this repository's own argument, and the specification cites
  # it as evidence. 16 of the 17 records under `docs/evaluations/` declare
  # `cited_by` and no review record and no probe declares one, which is the line
  # between prose this repository wrote and text it recorded.
  # [Q28](../docs/spec/09-decisions.md#q28--whether-an-evaluation-is-governed-prose)
  # rules that an evaluation is governed prose, and it states what this line
  # costs: 432 findings on the shelf when it was taken, every one of them
  # advisory, 422 over the word limit and 10 on a semicolon. No adoption pair
  # holds any of them and Q28 states the measured reason. Nothing works the 432
  # down. What the line buys is the next evaluation, which arrives under the
  # rule, and Q28 measures that effect on two shelves rather than asserting it.
  kinds.evaluation.language:          ste_house

  # --- the interface contract -----------------------------------------------
  # One kind, and one document per verb of this engine. The tradition is
  # man-pages(7), which has fixed the headings of a command description since
  # the 1970s, plus one heading that the man tradition has no slot for.
  # [HW-EVAL-specifying-the-engine](../docs/evaluations/specifying-the-engine.md)
  # measured the gap that asks for it. The exit-status contract of a verb is
  # prose spread over five specification parts, and no document states, for one
  # verb, its inputs, its flags, its exit codes, the split between its two
  # streams, and the errors it can return.
  #
  # **It is in this overlay and not in `docs/taxonomies/`, and criterion 4 of
  # the library index is the reason.** An entry is admitted when it "carries a
  # worked instance corpus", and no document of this kind exists yet. A
  # taxonomy that never met a document is a guess about a tradition, which is
  # what that criterion refuses. [#255](https://github.com/headwater-ai/headwater/issues/255)
  # writes the first two contracts, and an entry can be proposed on the day
  # there is a corpus to admit it with. This is the reading
  # [HW-OBL-0025](../docs/obligations/0025-where-the-probe-kind-ships-is-an-unsettled-clustering-question.md)
  # already took for `probe`: a kind this repository holds is a different claim
  # from a kind every adopter of the package gets.
  #
  # **What it may reach is settled and not restated here.**
  # [Q29](../docs/decisions/0029-q29-whether-a-corpus-root-may-contain-code-and-what-an-interface-contract-may-reach.md)
  # rules that the corpus root stays `docs`, so a contract sits on the shelf
  # below and reaches its crate by the `governs` edge of the base package onto a
  # `code_path`. Nothing about `governs` is declared here and nothing needs to
  # be: its source is `governed_document`, which this kind is one of, and its
  # target is already `code_path`. It declares no inverse and no reciprocal, and
  # it cannot declare either. The far end is an anchor rather than a node, so
  # there is no document there to write the other half onto, and
  # `SourceTree::resolve` binds the edge on existence alone. Q29 concedes the
  # consequence and
  # [HW-OBL-0128](../docs/obligations/0128-nothing-holds-a-crate-to-having-a-contract-under-a-root-that-excludes-it.md)
  # holds it: nothing holds a crate to having a contract, and this declaration
  # does not change that.
  #
  # **The section contract.** man-pages(7) fixes an order and makes NAME,
  # SYNOPSIS and DESCRIPTION mandatory. Seven of its headings are below. NAME is
  # not one of them, because the `title` facet carries the name and spec 2
  # refuses a second copy of a value the front matter already holds. That is
  # also why `title` is the one facet this kind adds to the four that
  # `governed_document` requires: a verb index has to print a name, and this
  # kind is the only end of that index. `Preconditions` is the eighth heading
  # and the man tradition has no slot for it. Meyer's Design by Contract
  # supplies it, and the precondition of `headwater check` is that
  # `.headwater/taxonomy.lock` exists and that `taxonomy resolve` wrote it,
  # which the engine enforces and no document states. There is no DIAGNOSTICS
  # heading, because that is the BSD mdoc convention rather than the Linux list.
  #
  # **`section.required.missing` reads a heading and never what is under it.**
  # The rule matches the text of a heading at any level, case-insensitively, and
  # it reads no word below one. So a contract that writes all eight headings in
  # any order passes, and so does one that writes `TODO` under every one of
  # them. The order below is the order man-pages(7) fixes, and it is a rule for
  # a person and for the scaffolder, which writes the headings in this order.
  # No check reads it. A kind whose whole purpose is a description must not
  # imply that a check read the description, and this is where a reader meets
  # that. `engine/crates/cli/tests/interface_contract.rs` is the fixture that
  # holds both halves.

  identifier_schemes.interface_contract_id:
    pattern: "{namespace}-IFACE-{slug}"
    namespace: HW
    allocation: minted-once

  kinds.interface_contract:
    is_a: governed_document
    purpose: behavior
    voice: declarative
    lifecycle: standard
    language: ste_house
    identifier: {scheme: interface_contract_id}
    facets:
      require: [title]
    sections:
      require: [Synopsis, Description, Preconditions, Options, Exit status, Environment, Files, See also]

  # Disjoint from every shelf above it. `docs/interfaces/**` claims no path that
  # another pattern claims, so no document resolves to a kind by accident. No
  # `layout`, because nothing numbers a verb: the file is named from the title,
  # the way an evaluation is.
  shelves.interfaces:
    path: docs/interfaces/**
    homogeneous: true
    kind: interface_contract

  # --- the on-ramp ----------------------------------------------------------
  # A tutorial teaches the model of this system to somebody who holds none of
  # it. #102 says why that is a gap rather than a nicety, and it names three
  # questions to settle before anything is written. All three are settled here,
  # because this file is where a later reader meets the answer.
  #
  # **Which corpus does the tutorial use?** A throwaway one that the reader
  # makes in an empty directory, and then the reader's own repository. The
  # order is not a preference. A tutorial over the reader's own tree cannot
  # state what the reader should now see, because nobody but the reader knows
  # what is in it, and #102 requires every step to end in a state that is
  # checkable rather than judged. So the scratch corpus carries the steps, and
  # `headwater infer` carries the handover to the reader's own tree.
  #
  # **Does the tutorial ship inside the package, or beside the engine?** Beside
  # the engine, which is why this declaration is in the adopter overlay and not
  # in a bundle. The two are different documents that share a name. A tutorial
  # for a *package* teaches the kinds that package declares, and a third-party
  # publisher owes one for its own bundles as doctrine prose, which spec 7
  # already provides for. A tutorial for the *engine* teaches `check`, `new`,
  # `explain` and the lock, and none of those is package data. This corpus
  # holds the second kind. When the base package gains one of the first kind,
  # it declares its own kind and this declaration is not in its way.
  #
  # **Is a tutorial a Diátaxis kind here?** No, and this declaration decides
  # nothing about that. #6 holds two live proposals: Diátaxis as a facet over
  # existing kinds, and Diátaxis as the kind set of a documentation-site
  # bundle. Neither is resolved, and #6 records that a facet-only bundle cannot
  # reach `kinds.<k>.facets.require` on another entry's kinds at all. Waiting
  # for that resolution would mean writing the on-ramp as an untyped file,
  # which is the fourth clause of #102 unmet. So the kind below is this
  # repository's own, in this repository's own overlay, on the reading that
  # spec 10 already settled: Diátaxis classifies by reader mode and Headwater
  # organizes by authority and lifecycle, so a reader mode is not a kind here
  # even when its name matches one. If #6 later ships the kind set, a document
  # of that kind is a different thing from this one and the two do not collide.
  #
  # **The purpose is `procedure`, and it is declared here rather than found.**
  # The base package declares `rationale` and `behavior`, the two the core
  # requires. Neither answers "how do I start". Spec 2 names `procedure` in the
  # derivation of the small-team column, and spec 7's interview names it as the
  # question an adopter is asked, so the word is this project's own rather than
  # a coinage. The `answers` phrases are what a newcomer types, because routing
  # matches them before it matches any text and a tutorial that no route
  # reaches is a document nobody arrives at.
  #
  # **The house language regime binds this kind too.** That is the hard choice
  # and it is deliberate. Teaching prose fights a 25-word sentence limit, and
  # the sentence limit wins, because a reader who holds none of the model is
  # the reader least able to carry a long sentence. Exempting the most
  # reader-facing prose in the corpus from the rules the corpus applies to
  # itself would be the exemption this project would least be able to defend.
  #
  # **The section contract carries the argument of #102.** `Before you start`
  # states what the reader must already have, because a step that fails on a
  # missing precondition teaches nothing. `Steps` holds the numbered sequence.
  # `The words this teaches` is the glossary, and it is required because a
  # tutorial that walks a reader through the verbs without leaving the model
  # behind has built the thing #102 says already exists. `Where to go next`
  # hands the reader to their own repository. `section.required.missing` reads
  # a heading and never a word under it, so all four could hold `TODO` and
  # pass. The contract is a rule for a person and for the scaffolder, and this
  # is where a reader meets that.

  purposes.procedure:
    intent: "state the steps a reader follows, and the state each step reaches"
    answers:
      - "how do I start"
      - "how do I set this up"
      - "what are the steps"

  identifier_schemes.tutorial_id:
    pattern: "{namespace}-TUT-{slug}"
    namespace: HW
    allocation: minted-once

  kinds.tutorial:
    is_a: governed_document
    purpose: procedure
    voice: declarative
    lifecycle: standard
    language: ste_house
    identifier: {scheme: tutorial_id}
    facets:
      require: [title]
    sections:
      require: [Before you start, Steps, The words this teaches, Where to go next]

  # Disjoint from every shelf above it, and from `docs/taxonomies/**`, which the
  # corpus declaration excludes. No `layout`, because nothing numbers a
  # tutorial: the file is named from the title, the way a verb contract is.
  shelves.tutorials:
    path: docs/tutorials/**
    homogeneous: true
    kind: tutorial

  # --- the requirement layer ------------------------------------------------
  # Spec 3 gives a stable name to five artifacts: "decisions, requirements,
  # acceptance criteria, controls, and obligations". Three of the five had a
  # kind and an identifier scheme before this block. Two did not, and
  # [HW-EVAL-specifying-the-engine](../docs/evaluations/specifying-the-engine.md)
  # reports the gap as its first finding: "Spec 3 names two identified artifacts
  # that the schema cannot express." The two kinds below close it. No
  # specification part changes, because that sentence is now satisfied rather
  # than contradicted.
  #
  # **Both kinds serve the natively authored population, and nothing here
  # carries a transcribed one.**
  # [Q35](../docs/decisions/0035-q35-whether-one-requirement-kind-holds-an-imported-requirement-and-an-authored-one.md)
  # rules that `requirement` and `acceptance_criterion` serve the authored
  # population, and that a separate kind carries the imported one. This
  # repository declares no imported kind, because Q35 leaves that kind to an
  # adopter who has an upstream and this repository has none. That ruling is
  # what lets both kinds below require a facet and require sections: every
  # document of either kind is authored here, so every rule reads every one of
  # them. Q35 also says that `verified_by` names both kinds at its `from` end.
  # That sentence is about an adopter corpus that holds the imported kind, and
  # one endpoint is the correct reading in a corpus that holds none.
  #
  # **It is in this overlay and not in `docs/taxonomies/`, and criterion 4 of
  # the library index is the reason.** An entry is admitted when it "carries a
  # worked instance corpus", and no requirement existed anywhere in this
  # repository until this change. A taxonomy that never met a document is a
  # guess about a tradition, which is what that criterion refuses. The pair of
  # documents beside this block is the start of that corpus, and an entry can be
  # proposed on the day there are enough documents to admit it with. This is the
  # route `probe` and `interface_contract` both took, and `interface_contract`
  # has since grown 19 documents under `docs/interfaces/`.
  #
  # **Criterion 6 refuses the addresses a library entry would want.** The
  # `brd-prd` entry already holds `purposes.requirement`, and `shelves.requirements`
  # at `docs/requirements/**`. An entry would collide on both, and criterion 6
  # leaves it a rename or a `requires: [brd-prd]` dependency. The dependency is
  # refused here, because it would pull in the `brd` and `prd` kinds, which this
  # repository does not hold and no reader of it asks for. An adopter overlay is
  # not a bundle and answers to no confluence check against a bundle that
  # `.headwater/taxonomy.yml` does not select, so the local declaration takes
  # the natural names. The collision is safe today and it is a constraint on any
  # later entry.
  #
  # **What a promotion to `docs/taxonomies/` would have to rename, stated here
  # so that work does not rediscover it.** Three addresses collide with the
  # `brd-prd` entry: `purposes.requirement`, `shelves.requirements` at
  # `docs/requirements/**`, and `shelves.acceptance_criteria`, which claims a
  # sibling path under the same reading of that tradition. The shelf is the hard
  # one. `brd-prd` declares `docs/requirements/**` heterogeneous over
  # `[brd, prd]` with a `requirement_tier` discriminator, and the shelf below is
  # homogeneous over one kind, so the two shapes cannot merge. Criterion 6's
  # second remedy, a declared dependency where both entries mean the same thing,
  # is therefore unavailable, and a rename is the only route. Whoever writes
  # that entry renames all three, or proposes that the two become one entry that
  # rules on the tier question first.
  #
  # **The purpose is new, and each of the five that exist was read first.**
  # `rationale` is retrospective and belongs to a choice already made.
  # `behavior` states what the system does now, and a requirement states what a
  # thing must do before it is built. `evidence` is wrong for an acceptance
  # criterion, which is the standard a measurement is read against rather than
  # the measurement, and `probe` is the kind that serves `evidence` in this
  # territory. `obligation` is spec 4's word for what the corpus owes. Both
  # kinds below serve `requirement`, which is ordinary here, because four kinds
  # share `evidence` today.
  #
  # **Two homogeneous shelves, and not one heterogeneous shelf with a
  # discriminator facet.** The probe layer above already took that reading in
  # writing: a homogeneous shelf keeps the front matter of a document short, the
  # shelf states the kind, and spec 2 refuses a facet that restates it. A
  # discriminator facet is metadata that restates placement, which OB-PLACE-1
  # refuses. `docs/taxonomies/README.md` also records what a heterogeneous shelf
  # costs, measured on the `standards-spec` entry: a discriminator value the
  # shelf does not admit stops kind resolution, no rule instantiates over the
  # document, and a run holding that document alone reports 0 findings and exits
  # 0. The two paths below are disjoint from each other and from every shelf
  # above them.
  #
  # **The voice regime is local, and it is not a dependency on `brd-prd`.** The
  # base declares `declarative`, which forbids `future_intent`, and a
  # requirement is prospective by construction. `regimes.voice.prospective` is a
  # free address in the resolved set, which holds `declarative` and `narrative`
  # only, so the `add` below is legal with no bundle selected. The declaration
  # matches the one the `brd-prd` entry makes, and the match is a read of that
  # source rather than an import of it.
  #
  # **The house language regime binds both kinds, and the EARS deferral stands
  # anyway.** `controlled` is a member of a language regime and never of a kind,
  # so no kind can say `controlled: none`. A kind binds a regime by name, or it
  # binds none and generates no instance of `language.controlled.not_met`,
  # `language.source_form.not_met` or `language.retired_term.used`. Binding none
  # would put new prose of this repository outside the rules the repository
  # applies to itself, which is the exemption this project would least be able
  # to defend. `ste_house` also fights nothing in EARS:
  # `language.controlled.not_met` implements a 25-word sentence limit, no
  # semicolon in running prose, no contraction and no British spelling, and none
  # of the four touches `shall`, `When`, `While`, `Where` or `If`. What the
  # deferral protects is preserved, because no EARS regime is declared here and
  # no EARS rule ships here. **A later EARS rule cannot arrive as a second
  # `controlled` value on this regime**, because a kind binds one regime and
  # `controlled` is one scalar. It arrives as a separate regime that repeats
  # `source_form` and the 18 retired terms, or as a new member on
  # `regimes.language`, which is the shape the same evaluation proposes for BCP
  # 14. Either one is a meta-schema change.
  #
  # **`verified_by` reaches an acceptance criterion and a probe, and it reaches
  # no anchor.** Its family is `evidence`, and its closest sibling is
  # `discharges`, which declares the same shape from the other end. `code_path`
  # is deliberately absent. Reciprocity is silent over an anchor target, because
  # `Edge::declared_triple` returns nothing for a target that is not a document,
  # so `relation.reciprocity.missing` never fires on such an edge. One
  # `reciprocal: required` declaration that binds two endpoints and binds
  # nothing at all on a third would state one contract over two populations,
  # which is the shape Q35 refused one clause up. Every relation here that names
  # an anchor at either end declares no reciprocal, and the interface-contract
  # block above states why.
  #
  # **`created_by: scaffold`, and that is what lets one command write the pair.**
  # `headwater new --relates` is refused unless the relation declares it, and it
  # accepts the inverse name, so `--relates verifies=HW-REQ-0001` on a new
  # acceptance criterion writes the far half into the requirement.
  # `created_by: author` would have made the whole pair hand entry. This is the
  # argument `applied_in` and `elaborates` already used.
  #
  # **The scaffolder is a convenience here and not the guarantee.** A hand
  # written half plus `headwater check --fix` reaches the same complete pair,
  # because a missing reciprocal link is one of the corrections that verb
  # writes. What is enforced is narrower and stronger than any producer:
  # `relation.reciprocity.missing` is an error, so no half-written pair survives
  # a strict run, whoever wrote the half.
  #
  # **29148 names four verifying artifacts, and two of them get no edge.** The
  # four are an acceptance criterion, a probe, a check rule and a test. A test
  # is covered with no new declaration: the criterion names it in `Method` and
  # declares the base relation `traces_to` onto its `code_path`, which already
  # runs from a governed document to an anchor and declares no reciprocity.
  # **A check rule is a named gap.** A rule identifier is neither a document nor
  # an anchor. `Resolvers::over` builds the `source-tree` resolver and nothing
  # else, so an `anchors.check_rule` declaration today names a resolver no run
  # has, and every edge under it reports `Unbound::NoResolver` on every use.
  # What carries the coverage instead is the `Method` section, which names the
  # rule identifier in prose, and the control block of spec 4, which binds a
  # rule to an invariant through `mechanism: check:<rule-id>`.
  # [#411](https://github.com/headwater-ai/headwater/issues/411) holds the gap,
  # and it holds the two questions that stop it being mechanical: which crate
  # may name `headwater_check::RULES`, and whether a generated rule is
  # addressable at all.
  #
  # **The verification method is a facet and the fit criterion is a section,
  # which is the shape `probe` already uses.** 29148 supplies the closed method
  # set and a check reads it, so it is a facet. Volere supplies the fit
  # criterion, which the evaluation quotes as "a quantification of the
  # requirement written beside it, which is what makes a subjective statement
  # testable", and that is prose, so it is a section. The four values are lower
  # case, because every closed value set in this taxonomy is, and 29148's
  # capitalization is a rendering choice rather than a value.
  # `verification_method` is `volatility: mutable`, because a criterion checked
  # by inspection can later be checked by a test, and the permanence canon
  # forbids a mutable facet only in an identifier, a path or a shelf pattern.
  #
  # **`headwater new acceptance_criterion` refuses to guess the method, and
  # `--facet` is the route.** The facet is required, it declares a closed value
  # set, and it carries no role this engine derives a value for, so the
  # scaffolder writes nothing and names `--facet verification_method=<value>`.
  # That is the same wall the `probe` kind hit, and the measurement layer above
  # documents the route once.
  #
  # **`section.required.missing` reads a heading and never a word under it.** A
  # criterion that writes both headings and `TODO` under each one passes. The
  # section contract is a rule for a person and for the scaffolder, which writes
  # the headings in this order, and this is where a reader meets that.
  #
  # **What is deliberately not declared.** 29148's owner, priority, source and
  # status attributes, and its nine well-formedness characteristics. Nothing
  # here reads them, and a kind for each characteristic would repeat the mistake
  # the design-spec doctrine already named. No `traceability_matrix` projection
  # either: the evaluation names it as the natural output of this corpus, and it
  # needs a corpus that this change only starts.

  purposes.requirement:
    intent: "state what must hold before a thing is built, and what decides that it holds"
    answers:
      - "what must this do"
      - "what does done mean here"
      - "what would show that this is met"

  regimes.voice.prospective:
    forbid: [change_narration, phased_rollout]

  facets.verification_method:
    type: string
    values: [test, demonstration, inspection, analysis]
    required: false
    volatility: mutable
    guidance:
      test: run the system and compare a measured result against the fit criterion
      demonstration: operate the system and observe the behavior the fit criterion states, with no instrument beyond the observation
      inspection: read the artifact against the fit criterion, and run nothing
      analysis: reason from a model, a calculation or a result already established, where a run is not possible and not needed

  # `{seq:04d}` and `reconcile-first`, mirroring `decision_id` and
  # `obligation_record_id`, which are the two schemes here for a numbered object
  # that a reader cites on its own. 29148 treats a requirement as an identified
  # object and the field numbers them. `brd-prd` chose `minted-once` with a
  # slug, on the argument that a BRD is cited outside the corpus, and that is
  # refused here: spec 3's allocation rule never renumbers, so a citation is
  # stable either way, and the numbered form matches the two registers a reader
  # of this corpus already knows. `REQ` and `AC` are disjoint from the eleven
  # literal segments already minted.
  identifier_schemes.requirement_id:
    pattern: "{namespace}-REQ-{seq:04d}"
    namespace: HW
    allocation: reconcile-first

  identifier_schemes.acceptance_criterion_id:
    pattern: "{namespace}-AC-{seq:04d}"
    namespace: HW
    allocation: reconcile-first

  # The participation expectation is what makes an *absent* verifier visible. A
  # relation alone reports the edges that exist, and the argument for declaring
  # one here is that a requirement nothing verifies is a claim nobody can
  # settle. So a `current` requirement with no `verified_by` edge is reported
  # after 90 days, at `warn`, which is the posture `evidence-cited` takes on an
  # evaluation in the base package.
  #
  # **It names `acceptance_criterion`, `verified_by` admits two kinds, and the
  # gap between those two facts is a cost this block states rather than hides.**
  # `to_kind` is one name and a relation's `to:` is a list, so this expectation
  # recognizes the first endpoint and not the second. A `current` requirement
  # that a probe alone verifies is reported after 90 days as reaching nothing,
  # and the remediation tells its author to declare an edge already declared.
  # That is a false report, at `warn`, over a case no document in this corpus
  # holds today: the one requirement here is verified by an acceptance
  # criterion.
  #
  # **It is declared this way because no other declaration validates.**
  # `Participation::satisfied` reads an absent `to_kind` as "any neighbour on
  # this relation", which is exactly the reading wanted here, and the
  # meta-schema declares `to_kind` a required member, so that branch is a
  # decline point no declaration can reach.
  # [HW-OBL-0128](../docs/obligations/0128-nothing-holds-a-crate-to-having-a-contract-under-a-root-that-excludes-it.md)
  # already records that sentence, and
  # [HW-OBL-0039](../docs/obligations/0039-a-participation-expectation-names-one-target-kind.md)
  # holds the obligation. That record proposes an abstract kind over the target
  # kinds as the remedy, and this declaration measured it: `to_kind:
  # governed_document` is refused twice by expectation well-formedness, once for
  # naming a kind no shelf reaches and once because `verified_by` does not admit
  # it at its target end. So the recorded remedy does not run either, and
  # closing this needs the meta-schema member to become optional.
  #
  # `engine/crates/check/tests/participation_target.rs` is the fixture the rule
  # had no case for. It holds two kinds that differ in this one clause over one
  # tree, so the cost above is a number a reader can check rather than a worry,
  # and the day the meta-schema yields, that test already says what changes.
  kinds.requirement:
    is_a: governed_document
    purpose: requirement
    voice: prospective
    lifecycle: standard
    language: ste_house
    identifier: {scheme: requirement_id}
    facets:
      require: [title]
    sections:
      require: [Context, Requirement, Verification]
    relations:
      expect:
        - id: requirement-verified
          relation: verified_by
          to_kind: acceptance_criterion
          when: {status: current}
          within: 90d
          since: state_entered
          severity: warn
          rationale: a requirement that nothing verifies is a claim nobody can settle

  kinds.acceptance_criterion:
    is_a: governed_document
    purpose: requirement
    voice: prospective
    lifecycle: standard
    language: ste_house
    identifier: {scheme: acceptance_criterion_id}
    facets:
      require: [title, verification_method]
    sections:
      require: [Fit criterion, Method]

  relations.verified_by:
    family: evidence
    from: [requirement]
    to:   [acceptance_criterion, probe]
    cardinality: many
    inverse: verifies
    reciprocal: required
    created_by: scaffold

  shelves.requirements:
    path: docs/requirements/**
    homogeneous: true
    kind: requirement
    layout: "{seq:04d}-{slug}.md"

  # Disjoint from the shelf above rather than under it, for the reason the probe
  # shelves give: two shelves that claim one path resolve a kind by accident.
  shelves.acceptance_criteria:
    path: docs/acceptance-criteria/**
    homogeneous: true
    kind: acceptance_criterion
    layout: "{seq:04d}-{slug}.md"

# --- projections ------------------------------------------------------------
# `projections` is a list in the base, so an `add` cannot reach it, and this is
# the one operation in this file that is not an `add`. Spec 13 records that
# nothing states whether a *bundle* may use `add_to`. An adopter overlay is not
# a bundle, and spec 2 supplies the operation for a list.
#
# The base declares an index for the two shelves that it declares, `decisions`
# and `specifications`. This corpus holds the first and not the second, so the
# base writes `docs/decisions/README.md` and reports the other as an index of
# an empty shelf. Every other shelf of this corpus is named below.

add_to:

  projections:
    # An index at the root of each shelf this corpus holds that no other
    # declaration covers. `{shelf}` is the shelf's directory, so one entry
    # writes one file per shelf and no two land on one path.
    #
    # **The root of a shelf is a page a reader reaches.** HW-DR-0047 rules that
    # the generated half of the site is served at `https://headwater.tools/`,
    # and MkDocs renders `docs/<shelf>/README.md` as `<shelf>/index.html`. A
    # shelf with no index declaration has no such file, so its root answers 404
    # while every record under it is served. `/obligations/` is the register
    # this project points at as its own evidence, and it was one of the seven
    # roots in that state.
    #
    # Five shelves are absent, for three reasons. `decisions` is absent because
    # the base already declares an index for it. `interfaces` is absent because
    # the `verb_index` below writes `docs/interfaces/README.md`, and two
    # declarations on one path would each write over the other. `specifications`,
    # `probe_runs` and `probe_results` are absent because they hold no document,
    # and `headwater generate` reports an index of an empty shelf rather than
    # writing a file that asserts a shelf is there.
    #
    # **`probes` is the one name here another projection kind could claim.**
    # `facets.expectation` declares five predicate forms and this shelf holds
    # four probes, so an index driven from the closed set would name the form
    # that no probe measures, the way `verb_index` names the verb that no
    # contract describes. No emitter reads a facet's value set as the row
    # source, and
    # [#531](https://github.com/headwater-ai/headwater/issues/531) carries the
    # writing of the missing probes. A shelf index reads what is on the shelf,
    # which is the whole of what this declaration claims.
    - kind: shelf_index
      for: [spec_series, obligations, evaluations, requirements, acceptance_criteria, probes, reviews, tutorials]
      output: "{shelf}/README.md"

    # The redirect map. `docs/spec/09-open-questions.md` is a tombstone: all
    # twenty-one questions closed, each one is a document on the decisions shelf
    # now, and 136 citations in this corpus name an anchor in this file. An
    # anchor exists because a heading does, so the file has to keep writing one
    # heading for each decision, which is what `shelf_sections` does.
    #
    # The `identity` block is why a projection may take this path at all. Three
    # documents name `HW-REG-open-questions`, and a generated file with no front
    # matter holds no identifier, so all three edges would resolve to nothing.
    # The block declares the identifier and the kind, and the engine derives the
    # rest: `doc_type` because the `spec_series` shelf is heterogeneous, and the
    # `superseded_by` half of each `supersedes` that another document declares
    # into this one.
    - kind: shelf_sections
      for: [decisions]
      output: docs/spec/09-open-questions.md
      identity:
        id: HW-REG-open-questions
        kind: decision_register

    # The standing test of the grader, which spec 12 asks a correctness root for
    # and which nothing could run while a result was something a verb printed.
    # One transcript is one run and one result, so `{run}` is the transcript's
    # file stem and one declaration writes as many files as this corpus holds
    # transcripts.
    #
    # It writes none today. `docs/probe-runs/` holds no file, a transcript is
    # written by a recorder that observes a session from outside it, and no verb
    # of this engine writes one. `headwater generate` prints that reason on every
    # run, which is where an empty arm belongs rather than in a register a reader
    # has to go and look up.
    - kind: probe_result
      output: "docs/probe-results/{run}.md"
      identity:
        id: "HW-RESULT-{run}"
        kind: probe_result

    # The verb index, and the shelf above is the one end of it. Every verb the
    # binary dispatches gets a row, and a verb that no contract describes gets a
    # mark rather than a missing row. That cell is the deliverable:
    # [#257](https://github.com/headwater-ai/headwater/issues/257) states that an
    # index of the contracts that exist is a list of work already done.
    #
    # **It is not a `shelf_index`, and the difference is which end supplies the
    # rows.** A shelf index reads the documents that are there, so `interfaces`
    # on that declaration would write a table of two contracts and say nothing
    # about the fifteen verbs nobody has described.
    # [HW-OBL-0128](../docs/obligations/0128-nothing-holds-a-crate-to-having-a-contract-under-a-root-that-excludes-it.md)
    # calls that the reading which closes nothing.
    #
    # **No `identity`, so the file is no node.** Nothing cites a row of it, and
    # the two scalars an identity block carries would put an identifier on an
    # artifact that no edge names. A shelf index of this repository takes the
    # same shape for the same reason.
    #
    # The output lands on the shelf it describes, so a reader who opens
    # `docs/interfaces/` meets the whole surface rather than the described part
    # of it. The census reads the marker on the first line and excuses the file
    # from every document rule, which is why a file with no front matter may sit
    # on a homogeneous shelf.
    - kind: verb_index
      for: [interfaces]
      output: docs/interfaces/README.md

    # The whole graph, for the reader Q16 names and spec 5's server-reader
    # carve-out anticipates: a consumer outside this repository, with no
    # principal to filter for. Q17 rules that Headwater has no principals, so
    # `site` names the one profile this corpus exports rather than a narrower
    # cut, and it needs no `filter`.
    #
    # `format` is absent on purpose. `Declaration::emitter()` falls back to the
    # native graph JSON when an entry names none, and this entry wants exactly
    # that fallback rather than a naming of it.
    #
    # The output sits beside `.headwater/corpus.json`, the descriptor that
    # spec 7 already lists a declared export profile in as an entry point.
    # Committed like the four declarations above it: a generated artifact
    # this corpus ships, not a build output.
    #
    # This is the second profile the taxonomy assembles, not the first: every
    # entry above names no `profile` and so falls into `default`, the group
    # `profile.rs` names for "an entry that names no profile is not
    # profile-less, it is the one profile." `headwater export --format`, run
    # with no `--profile`, refuses rather than guess between `default` and
    # `site` now that both exist — `--profile site` names this one.
    - kind: graph_export
      profile: site
      output: .headwater/export.json

    # The site navigation. HW-DR-0036 picks MkDocs and states why: its `nav:`
    # is data and not code, its default `docs_dir` already matches this
    # corpus's root, and neither Docusaurus nor Astro has a plain-data format
    # to emit into. Q16 and spec 2's own worked example both already name
    # `.headwater/nav.yml` as the illustrative output, so this path is not new
    # to this corpus. An empty `for` covers every shelf, the same reading a
    # `shelf_index` with no `for` gives it, and an empty shelf is left out of
    # the written list rather than reported `Unwritten` for the whole file.
    - kind: site_nav
      output: .headwater/nav.yml
