# SPDX-License-Identifier: Apache-2.0
#
# What this repository takes, and how it differs. The shape is the consumer
# declaration of spec 7 (Consuming).
#
# `headwater taxonomy resolve` reads the `taxonomy:` block below, resolves the
# package it names with the bundles it selects and the overlay it declares, and
# writes `taxonomy.lock` beside this file. Everything downstream reads that lock
# and never these sources.
#
# `headwater check` reads the `corpus:` block here and nothing else in this
# file, because the lock says what the schema is and `corpus:` says what to
# walk.
#
# Two fields are assumptions, and `.headwater/README.md` records both.

taxonomy:
  package: headwater/standard
  version: 2.1.0
  bundles: [design-spec, decision-record]
  overlay: .headwater/overlay.yml

# Where a deviation from a conformance rule is declared, and the only key
# `headwater conformance` reads here. Spec 7 (Waivers) gives the reason it is in
# this file rather than beside the rule it waives: `headwater taxonomy vendor`
# replaces a vendored package directory whole, so a shipped rule is never edited
# locally and a waiver written next to one would not survive an upgrade.
#
# Four fields and every one is required. The expiry is what makes this different
# from a decision nobody revisits: an expired waiver is reported as expired and
# covers nothing, so the rule under it is evaluated as though no waiver stood
# there.
#
# No key here declares a level, and there is no such key to add. The report
# derives the level from the rules that pass, and a waiver moves the exit status
# of a `--level` run and never the level the report states.
conformance:
  waivers:
    - rule: pin.current
      reason: accepted_deviation
      owner: j.baxter
      until: 2027-02-28
      note: >-
        This repository publishes the package it also consumes, and it takes it
        from source under `packages/` rather than from an artifact that
        `headwater taxonomy publish` wrote. So there is no release record to
        pin a digest against. The rule is right and the gap stands: the report
        still counts L0 as unreached, and this waiver buys a green
        `--level L0` run and nothing else.

# The gap on `corpus.classified` carries no waiver. Two files under the corpus
# root are on no shelf, and the remedy is a declaration rather than a
# deviation, so the report is left saying so.

# What the census walks, and what it declares is not corpus content. The census
# reports a row for every file either way, so an exclusion changes what a row
# says and never whether there is one.
corpus:
  root: docs
  exclude:
    - path: docs/taxonomies/**
      reason: >-
        package content. This directory is the canonical taxonomy library, and
        a taxonomy package that lives inside the corpus it types has no home in
        the shelf model. Nothing in the base package or in either entry says
        whether package content is corpus content, and spec 13 records the gap;
        this repository answers it locally, here, with a reason. A fixture
        corpus under an entry is package content twice over, because it is a
        corpus that another root is meant to walk.
