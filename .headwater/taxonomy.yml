# SPDX-License-Identifier: Apache-2.0
#
# What this repository takes, and how it differs. The shape is the consumer
# declaration of spec 7 (Consuming).
#
# `headwater taxonomy resolve` reads the `taxonomy:` block below, resolves the
# package it names with the bundles it selects and the overlay it declares, and
# writes `taxonomy.lock` beside this file. Everything downstream reads that lock
# and never these sources.
#
# `headwater check` reads the `corpus:` block here and nothing else in this
# file, because the lock says what the schema is and `corpus:` says what to
# walk.
#
# Two fields are assumptions, and `.headwater/README.md` records both.

taxonomy:
  package: headwater/standard
  version: 4.8.0
  digest: sha256:d837a8567fc4b9c83f39439d168f55aff836e0515b51177bb276bf15a6bf6a87
  bundles: [design-spec, evidence-and-obligation, decision-record]
  overlay: .headwater/overlay.yml

# No waiver stands here for `pin.current` any more. Until #336 this repository
# consumed the package it publishes from source under `packages/`, which
# carried no release record for the digest above to name. #336 moved the
# authored source to `taxonomy-source/headwater-standard/` and ran `taxonomy
# publish --from` it, `taxonomy vendor` and `taxonomy resolve` once, by hand,
# so the vendored artifact stands with a real `release.yml`, and the digest
# above is the one that run printed. #792 then moved the root it stands in to
# `.headwater/packages/headwater-standard/`, which changed no byte of it.
# `headwater conformance` reads `pin.current` as met against it, and the
# `conformance:` key this file used to carry is gone with the waiver: absent
# is how a consumer declaration says it takes no deviation.

# The gap on `corpus.classified` carries no waiver. Two files under the corpus
# root are on no shelf, and the remedy is a declaration rather than a
# deviation, so the report is left saying so.

# What the census walks, and what it declares is not corpus content. The census
# reports a row for every file either way, so an exclusion changes what a row
# says and never whether there is one.
corpus:
  root: docs
  exclude:
    # The canonical taxonomy library lives under `docs/taxonomies/`. Its
    # doctrine and its index are corpus content here, typed `library_doctrine`
    # by `.headwater/overlay.yml`, because they are the prose an adopter reads
    # before choosing an entry (#350). The three rules below keep out what is
    # package content and not prose. Nothing in the base package says whether
    # package content is corpus content, and spec 13 records that gap. These
    # rules are this repository's local answer, and the base question stays
    # open. The fixture rule is a path pattern and not a test of what a file
    # declares, because only the three `n8n` fixture roots carry their own
    # `.headwater/taxonomy.yml` and the `corpus/` fixtures carry nothing that
    # tells them apart.
    - path: docs/taxonomies/*/fixtures/**
      reason: >-
        package content, and a corpus another root walks. A fixture holds
        planted defects on purpose, so a rule of this corpus that read one would
        report the defect the fixture exists to plant.
    - path: docs/taxonomies/*/templates/**
      reason: >-
        package content, and a skeleton rather than prose. Publish reads a
        template's front matter (#378), and a template stays outside every
        language regime, because its body is placeholders an author replaces.
    - path: docs/taxonomies/*/bundle.yml
      reason: >-
        package content, and a declaration rather than a document. The
        resolver reads it, and `headwater taxonomy validate` holds it.
