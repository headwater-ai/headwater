# SPDX-License-Identifier: Apache-2.0
#
# What a probe run of each tier may spend. `headwater probe plan` reads it,
# projects the cost of a run against the ceiling, and refuses a run above it.
#
# It is here rather than under the corpus root because a budget is a policy of
# the repository that runs the probes and not a fact about any document: nothing
# classifies it, no language regime binds it and no rule reads it. It is here
# rather than in `.headwater/taxonomy.yml` because a taxonomy does not decide
# how much money a run may cost. HW-DR-0076 rules that this file stays here and
# does not move; what no ruling may do is remove the number, because a harness
# with no ceiling cannot fail closed.
#
# Every field is required and none has a default. A default would be this engine
# choosing how much to spend.

# The instrument: the probe shelves, which every arm of every tier removes,
# the present arm too. A probe document states the answer it expects, and a
# transcript states the answers sessions gave, so a session that could read
# them would be graded against its own answer key. They are the instrument and
# not the treatment, so no arm holds them, and the claim of each tier stays
# about the paths its ablation names. `headwater probe plan` refuses a probe
# whose predicate names a document under one of them, at every tier.
#
# `.headwater/export.json` is here too. It is not committed since #1251, but
# a workspace can hold one that `headwater export --format json` wrote, and it
# restates every probe's expectation and `examines` target, which names the
# document an `opened` or `cited` probe is graded on. A session that exports
# again in an arm writes a copy with no probe in it, because the shelves are
# gone.
#
instrument:
  - docs/probes
  - docs/probe-runs
  - docs/probe-results
  - .headwater/export.json

# Folds: the files outside `docs/` that name a probe by its identifier or its
# slug and state neither its expectation nor its answer. Each is a derived
# file, a hand-written declaration, or a route fixture of an IDE client that
# names a probe as a path. `tools/probe/seal.sh` removes every other file
# outside `docs/` and the instrument that names a sealed probe, and
# `probe-record.sh` refuses a workspace that still holds one (exit 9). Two
# committed files are not folds and are removed, because each states an
# answer: `.claude/skills/fixtures.sh` asserts the answer of the status probe,
# and `tools/probe/probe-record-fixtures.sh` names the tombstone probe with
# its record (#1384). An entry is a path relative to the root, in the block
# form or the flow form. The engine reads this block, and `headwater probe
# plan --folds` prints it, which is what the seal and the guard read.
# A new file that names a probe is refused until it is declared here, so the
# list fails closed.
#
# The folds stay in every arm, the seal of #1229 included, less each line
# that names a document the seal deletes (#1293), and a title can hint at a
# target. So a present-arm rate over an `opened` probe is an upper bound on
# what the documents alone achieve.
#
# **Limit.** The seal and the guard find an answer by a name: the probe's
# identifier or slug, a declared answer key, or a document that names the
# probe. A file that states an answer and names none of them, in `docs/` or
# outside it, is not found by any search, and no mechanical check can find
# it. The campaign report of #1384 cites this paragraph for that limit.
folds:
  - .headwater/capture-cost.jsonl
  - .headwater/corpus.json
  - .headwater/nav.yml
  - .headwater/overlay.yml
  - .headwater/probe.yml
  - engine/crates/census/fixtures/corpus.census
  - engine/crates/graph/fixtures/corpus.graph
  - integrations/jetbrains/test/ClientTest.java
  - integrations/jetbrains/test/fixtures/route-pointers.jsonl
  - integrations/jetbrains/test/fixtures/route-text-only.jsonl
  - integrations/jetbrains/test/fixtures/route-withheld.jsonl
  - integrations/vscode/test/client.test.js
  - integrations/vscode/test/fixtures/route-pointers.jsonl
  - integrations/vscode/test/fixtures/route-text-only.jsonl
  - tools/probe/layer-campaign.spec
  - tools/probe/additive-campaign.spec
  - tools/probe/additive-screening.spec

# Answer keys: documents that an earlier session wrote in answer to a probe's
# task, and that name neither the probe nor its slug, so the seal below would
# keep them. A session that meets one finds its task already done. On the
# pilot of #980 every present-arm session of the `patched` probe found
# HW-OBL-0198, which a session of that probe wrote on 2026-09-16, and declined
# to write a duplicate. So the probe failed in every arm for a reason that was
# not about the corpus.
#
# `tools/probe/seal.sh` removes each key from a workspace, with its claim under
# `.headwater/ids/`, and removes every line of any other file that names the
# key's identifier or slug. A shelf index, spec 13's register and a paragraph
# that cites the key each lose that line and keep the rest. `probe-record.sh`
# refuses a workspace that still names a key. The engine reads this block,
# and `headwater probe plan --answer-keys <probe>` prints the keys of one
# probe, which is what the seal reads. Each probe maps to a sequence of paths
# relative to the root, in the block form or the flow form. An entry that
# leaves the tree refuses the whole file.
answer_keys:
  HW-PROBE-a-session-records-an-unmeasured-claim-in-the-shape-this-corpus-checks: [docs/obligations/0198-nothing-states-how-much-of-a-session-s-budget-the-standing-instructions-consume-before-work-starts.md]

# Leak strings (#1472): for each probe, the strings whose presence in text the harness
# loads into every session gives the probe's answer away. The seal finds an
# answer by a name, and this leak names none. The description of the
# authoring skill states the ruling the status probe expects, and it never
# names the probe. In the #1384 re-run, 30 of 30 present-arm sessions of that
# probe answered with no tool call.
#
# A leak string is never an `expected:` value. The accepted-event probe expects
# `merge`, a common word that every file holds, so its leak strings are the ruling's
# identifier and the phrases that state the ruling. HW-DR-0052 is one of them
# because its title says the merge activates a document.
#
# `sh tools/probe/seal.sh --leak <workspace> <probe>...` reads these over the
# always-loaded set: the memory files (`CLAUDE.md`, `AGENTS.md`,
# `CLAUDE.local.md`, `.claude/rules/` and each file they import), the front
# matter each skill, agent definition and command under `.claude/` is listed
# by, and the description of each MCP tool where the workspace declares a
# server. `tools/probe/leak.py` names each channel, and it reads this file and
# the front matter with a YAML parser. It prints one line per hit and exits 1
# on a leak string that `leaks_kept:` below does not keep. A probe with no
# entry here is printed as `undeclared`, because the check cannot see it. A
# probe whose entry is the empty sequence `[]` is declared with no answer
# string, and the check prints nothing for it (#1774).
#
# `--scenario` reads more channels, for the trees of the additive campaign:
# the whole `SKILL.md` of each skill, and the text the intent hook injects
# for each probe's task where the tree holds the hook. A hit in a file of
# the `harness` layer prints as `harness`, and does not fail the check.
# `tools/probe/seal.sh` states that contract.
leaks:
  HW-PROBE-a-session-names-the-status-a-settled-decision-carries-in-its-pull-request: [HW-DR-0052, "status: current"]
  HW-PROBE-a-session-names-the-event-that-makes-a-document-accepted: [HW-DR-0052, HW-DR-0034, the merge activates, merged to main, merge onto `main`]
  # The five harder probes of #1472, clause 2. Each names the identifier of
  # the record that holds its answer, and the phrase that states the answer.
  HW-PROBE-a-session-finds-a-ruling-from-a-task-in-plain-words: [HW-DR-0049, corpus-wide fold, HW-EVAL-why-corpus-counts-are-derived]
  HW-PROBE-a-session-says-where-a-figure-on-the-site-is-written: [HW-DR-0097, measured when the site is published]
  HW-PROBE-a-session-follows-a-citation-from-one-record-to-the-next: [HW-DR-0097]
  HW-PROBE-a-session-says-how-a-governs-line-reaches-a-document: [HW-DR-0104, --relates governs]
  # Its successor (#1709): the same task and key over the repaired tree.
  HW-PROBE-a-session-says-whether-a-command-or-a-hand-writes-a-governs-line: [HW-DR-0104, --relates governs]
  HW-PROBE-a-session-records-which-obligation-an-evaluation-discharged: [discharged_by, relation.reciprocity.missing]
  # The four harder variants of #1718, beside four probes at 30 of 30 in both
  # arms. None is kept: each answer is outside the always-loaded set. The
  # status variant asks for what only the body of HW-DR-0052 states, and the
  # skill description that names HW-DR-0052 states neither half of it.
  HW-PROBE-a-session-follows-two-citations-from-a-record-the-task-does-not-name: [HW-DR-0097, measured when the site is published]
  HW-PROBE-a-session-says-which-date-a-corrected-status-carries: [date of the correction, 66 documents standing at]
  HW-PROBE-a-session-answers-from-the-register-when-the-task-names-the-list-it-replaced: [HW-DR-0020, where-scent-lives]
  HW-PROBE-an-agent-reaches-the-adjudication-when-the-decision-a-tombstone-links-is-superseded: [HW-DR-0087, No paragraph limit joins the language rule]
  # The three probes of the additive campaign's set that declared none
  # (#1774, clause 5). The ruling-cited probe keys on HW-DR-0049, so it
  # takes the strings the plain-words probe declares for the same ruling.
  HW-PROBE-what-a-session-writes-points-back-at-the-ruling-it-rests-on: [HW-DR-0049, corpus-wide fold, HW-EVAL-why-corpus-counts-are-derived]
  # The cold-agent probe and the pointer probe key on `opened`: the key is an
  # act, the opening of the target, and no string states it. So each declares
  # the empty sequence, which the check reads as declared with no answer
  # string, and a missing entry still prints `undeclared`. A string that
  # named the target would be wrong for the pointer probe in particular: the
  # hook's route for its task names HW-OBL-0107, its own target, and that
  # pointer is the treatment the hook layer delivers, not a leak.
  HW-PROBE-a-cold-agent-reaches-the-governing-document-through-the-corpus-descriptor: []
  HW-PROBE-the-pointer-this-corpus-offers-for-a-task-is-the-document-a-session-opens: []

# The probes whose leak string stays in the present arm on purpose (#1472, the second
# outcome the issue offers). The leak string of the status probe is in the
# description of a skill because #1294 put it there: a skill reaches a session
# through its description, and `.claude/skills/fixtures.sh` holds the sentence.
# #1294 put it in `headwater-authoring`. #1578 made that skill a file the binary
# ships to adopters, which names no ruling of this corpus, so the sentence moved
# whole to the description of the internal `hw-corpus` skill. Every skill
# description is in the always-loaded set, so the present arm still delivers
# the same two strings in a skill description, and the leak check names
# `hw-corpus`. Removing it would change what the present arm delivers,
# which is the treatment the campaign measures. So the two probes say in
# their own documents that they measure the leak string, and a campaign reports each
# on its own line and never in a rate of its category. Only the owner can
# choose to remove the leak string instead.
leaks_kept:
  - HW-PROBE-a-session-names-the-status-a-settled-decision-carries-in-its-pull-request
  - HW-PROBE-a-session-names-the-event-that-makes-a-document-accepted

# Power (#1472): the rates a campaign is sized to separate, and the test. The
# discovery category of the #1384 re-run found 9 of 60 against 5 of 60, and a
# difference of that size is what the next run must be able to see. So the
# rates are 0.15 in the present arm against 0.08 in an arm without the layer,
# at a 5% two-sided level and 80% power. That is 325 sessions per arm without
# a continuity correction and 353 with the Fleiss correction. The issue's
# "about 350" is the corrected figure.
#
# A category under `pooled` pools its probes into one rate, as a result
# already does, so each of its k probes runs ceil(353 / k) repetitions: 118
# for the three discovery probes a campaign can plan. `sh tools/probe/campaign.sh
# --dry-run` computes the count from these fields and prints the formula
# beside it. The engine reads none of this block, and the plan still refuses
# repetitions above the ones a tier declares, so the count is priced by the
# dry run and not run by anybody until a person raises what the tier may
# spend.
#
# The additive campaign (#1774) sizes each of its rounds from two rates of its
# own, under `rounds:` below, and takes the level and the power from here.
# The dry run computes every count with the one formula it states, and
# nobody types 18 or 55.
power:
  present: 0.15
  absent: 0.08
  alpha: 0.05
  power: 0.80
  pooled: [discovery]

tiers:

  # Detect that something moved. One arm, one repetition, against a recorded
  # baseline. It establishes no effect, so no published claim rests on it, and
  # the ceiling is set where a scheduled weekly run is affordable without
  # anybody approving it each time.
  regression:
    budget_cents: 2000
    session_cost_cents: 25
    repetitions: 1
    arms: [present]

  # Estimate a difference for one named claim. Both arms, powered, one batch,
  # one model version.
  #
  # **The ceiling is the amount somebody has actually agreed to spend.** The
  # owner agreed on #980 on 2026-09-22 to roughly $464 for a powered campaign,
  # and ruled on 2026-09-28 on the design posted there: 30 repetitions per
  # probe, on `claude-sonnet-5`, with $300.00 here and $130.00 at the
  # documentation tier. That is $430.00 in all, inside the amount agreed. The
  # number moved because a person decided to spend more, which is the only
  # reason it may move. A plan above it still refuses, because a run that does
  # not happen is the cheaper error.
  #
  # It moved again on #1659, for the same reason. In run 20261002-1233 the
  # owner chose "Approve 2,142": "the campaign plan of 4,284 sessions at about
  # 2,142 dollars stands". In run 20261003-1026, on 2026-10-03, he ruled: "I am
  # giving the go ahead for 1659 so do it when ready." So the ceiling here is
  # $2,052.00, this tier's share of that plan: 4,104 sessions at the declared
  # 50 cents. The documentation tier keeps $130.00, because its share, $90.00,
  # is inside it. `tools/probe/campaign.sh --session-cents` is what holds a
  # batch below the figure it was given, and not this declaration.
  #
  # Spec 5 takes the session count from statistical power rather than from
  # taste: 0.50 against 0.75 at 80% power and a 5% two-sided level is about 58
  # sessions per arm. That count is per arm of one claim, and a result pools
  # every probe of its selection into one rate. So 30 repetitions over the 4
  # sufficiency probes is 120 sessions per arm, and over the 9 probes a
  # campaign can plan it is 270. Both clear 58. The 58 this tier declared
  # before bought that count once per probe, which is nine times the sessions
  # the claim needs over 9 probes (#980).
  #
  # `session_cost_cents` is the realized rate and not a guess: the two most
  # recent regression recordings on `claude-sonnet-5` spent 48.75 and 50.875
  # cents per session.
  #
  # The claim it measures is that the governance changes what an agent builds:
  # its ablation removes the four paths that deliver this repository's
  # governance and keeps `docs/`.
  #
  # Since #1010 the plan refuses a probe whose predicate names a document the
  # ablation removes, at this tier as at `documentation`. One probe does:
  # the authoring-skill probe expects `opened` over a file under `.claude/`,
  # which no absent-arm session can open, so its absent rate is zero by
  # construction and the pair would measure the ablation. So an unnarrowed
  # `--tier campaign` refuses on that probe before it reaches the ceiling.
  # That probe is a regression-tier instrument. A campaign runs over a
  # category that excludes it (`--category navigability` or
  # `--category sufficiency`), and there the ceiling is what refuses it.
  #
  # The discovery category holds that probe too. `--exclude` names it out, so
  # the other discovery probes plan at this tier: the two that the machine
  # half of Q16 rests on (#980), and the vocabulary probe of #1472.
  #
  # `max_turns` is the turn cap of each session (#1384). #980 needed 80 for
  # the four `patched` sessions it recorded again after the 60-turn cap of
  # 2026-09-28 stopped them. A session the cap stops is recorded as observed,
  # never dropped and never drawn again, so the cap is part of what the rate
  # measures, and both arms and both paired tiers share it.
  #
  # **The component arms (#1472).** The absent arm removes the whole layer at
  # once, so a difference between present and absent cannot say which part
  # of the layer caused it. Each component arm is the present tree with one
  # part taken out or put in, and `components` states that delta as data:
  #
  # - `no-hook` removes `.claude/hooks/intent.sh`. `.claude/settings.json`
  #   stays, so the harness still runs the hook's wrapper, which prints `hook
  #   script not found` and exits 1. A `UserPromptSubmit` hook that exits 1 is
  #   an error that does not block, so the session runs with no hook. Removing
  #   `settings.json` instead would remove the other hooks too.
  # - `no-skills` removes `.claude/skills`, the skills and their descriptions.
  # - `no-claude-md` removes `CLAUDE.md`, the standing instructions.
  # - `mcp` adds `.mcp.json`, copied from `tools/probe/arms/mcp/`, which
  #   declares `headwater mcp` as a project server. A committed `.mcp.json`
  #   does not load by itself under `claude -p`, because a project server
  #   needs approval, so `probe-record.sh` passes `--mcp-config` when the
  #   workspace holds one. It passes `--strict-mcp-config` in every arm, so
  #   no server of the recording host's own configuration loads into any arm.
  #
  # Every component arm is compared with the present arm of the same batch.
  # `sh tools/probe/ablate.sh campaign <workspace> <arm>` builds the arm from
  # the present tree, and `--diff campaign <arm> <present-tree>` prints the
  # delta and fails on any other difference. It takes the delta from
  # `headwater probe plan --tier campaign --arm <arm> --delta`, so any YAML
  # form the plan accepts under `components` builds the same tree.
  #
  # **What the arms cost.** Six arms is three times the sessions of the pair.
  # At the $300.00 of 2026-09-28 the plan of any category at 30 repetitions
  # was over the ceiling, and the plan refused it. `sh
  # tools/probe/campaign.sh --dry-run --spec tools/probe/layer-campaign.spec`
  # prints what each line and arm would cost against the ceiling. The owner
  # ruled on one ceiling for the whole plan before any of it ran (#1472), and
  # it is the $2,052.00 below.
  campaign:
    budget_cents: 205200
    session_cost_cents: 50
    repetitions: 30
    max_turns: 80
    arms: [present, absent, no-hook, no-skills, no-claude-md, mcp]
    ablation: [CLAUDE.md, .claude, .githooks, .headwater]
    components:
      no-hook: [.claude/hooks/intent.sh]
      no-skills: [.claude/skills]
      no-claude-md: [CLAUDE.md]
      mcp: [.mcp.json]

  # Estimate a difference for a second named claim: that the documents under
  # `docs/` change what an agent builds. Both arms, like the campaign. The
  # ceiling is the $130.00 the owner agreed to on #980 on 2026-09-28: 4
  # sufficiency probes, 30 repetitions, at the realized rate, for the absent
  # arm and a contingency. The present arm is the campaign's, recorded once,
  # because a present tree is the same tree at every tier (the owner's ruling
  # of the same day).
  #
  # Its ablation is the campaign's four paths and `docs`. So present against
  # absent at this tier measures the documents and the governance together.
  # The documents alone are this tier's absent arm against the campaign's
  # absent arm, and that difference holds only when both ran in one batch on
  # one model version. A `campaign` rate is never quoted for this claim.
  #
  # A probe whose predicate names a document (`opened`, `not_opened`,
  # `cited`) cannot be satisfied in an arm that removed the document, so
  # `headwater probe plan --tier documentation` refuses a selection that holds
  # one whose `examines` target sits under an ablation entry. `answered` and
  # `patched` probes are admitted, and `--category sufficiency` is the
  # selection meant for this tier.
  #
  # Two files outside `docs/` copy what a document states, and the ablation
  # removes them with it. `engine/crates/census/fixtures/corpus.census` lists
  # every path under `docs/`, and a decision's file name states its ruling.
  # `site/tutorial/index.html` states the ruling of HW-DR-0052 in one step.
  # Both are kept in the campaign's absent arm, like `docs/` itself.
  #
  # The absent tree is produced by
  # `sh tools/probe/ablate.sh documentation <workspace>`. Its cost over the
  # sufficiency probes is projected at the end of this file.
  #
  # Its turn cap is the campaign's, for the reason given there.
  documentation:
    budget_cents: 13000
    session_cost_cents: 50
    repetitions: 30
    max_turns: 80
    arms: [present, absent]
    ablation:
      - CLAUDE.md
      - .claude
      - .githooks
      - .headwater
      - docs
      - engine/crates/census/fixtures/corpus.census
      - site/tutorial/index.html

  # The additive campaign (#1774): one `scenario-<n>` arm for each scenario
  # declared under `scenarios:` below, each compared with its base. The plan
  # is HW-DR-0111, and `tools/probe/additive-campaign.spec` is its batch.
  #
  # `repetitions` is the final round's count, 55, the largest any round runs.
  # Every lower round passes `--repetitions` to the plan as a lowering, and
  # `sh tools/probe/campaign.sh --dry-run` computes each round's count from
  # its rates under `rounds:`. `max_turns` is the campaign tier's, for the
  # reason given there.
  #
  # `session_cost_cents` is the declared rate of the paired tiers. The
  # campaign of 2026-10-03 realized 35.0 cents a session: 149,681 cents over
  # 4,280 sessions. At 50 cents the whole plan is 7,112 sessions and
  # $3,556.00, and at 35.0 cents it is $2,489.20.
  #
  # The owner approved the screening round on 2026-10-18 (#1775), at $700
  # over every attempt of the round: a restart does not reset the count. The
  # screening plan is 1,008 sessions and $504.00, so $196.00 is room for a
  # restart. This ceiling was set to that $700, and it now bounds one batch
  # directory of any round: a tuning try of one layer is 72 sessions, or
  # $36.00, well inside it. `tools/probe/campaign-drive.sh` gives a restarted
  # batch the cap less what every earlier batch under its root spent. It
  # holds no total across roots, so the total of the tuning round against its
  # $1,512.00 (#1777) is kept by hand. The plan prices one line at a time, so
  # this ceiling admits a line of any round. The approval of each round under
  # `rounds:` is what refuses a round: `campaign.sh` refuses a line of a round
  # whose `approved_cents` is 0, with 5, before it builds a tree. HW-DR-0111
  # records each approval.
  additive:
    budget_cents: 70000
    session_cost_cents: 50
    repetitions: 55
    max_turns: 80
    arms: [scenario-0, scenario-1, scenario-2, scenario-3, scenario-4, scenario-5, scenario-6, scenario-7, scenario-8, scenario-9, scenario-10, scenario-11, scenario-12, scenario-13]

# **The additive campaign (#1774).** The arms above are each the present tree
# with a part removed. The campaign of milestone 0.07 turns that around: it
# starts from plain code and adds layers to it, so each layer is measured from
# the bottom of the stack as well as from the top. The plan is
# docs/decisions/0111-the-additive-campaign-adds-six-layers-to-plain-code-in-fourteen-scenarios-and-registers-one-comparison-each.md,
# and these two mappings are its data. The engine reads them, and `sh
# tools/probe/ablate.sh --scenario <n> <workspace>` builds a scenario's tree
# from `headwater probe plan --scenario <n> --delta`, so no script parses
# them.
#
# A layer names the paths it adds to plain code. `paths` are kept from the
# present tree, and `arms` are written from `tools/probe/arms/<layer>/`.
# Plain code is the present tree with the path of every layer removed. So a
# path of this repository that delivers Headwater and belongs to no layer
# is in plain code, and every scenario holds it. The census fixture and the
# tutorial page go with `docs`, because each states what a document says,
# and the documentation tier removes them for that reason. The built engine
# goes with `engine`: a session has no network and cannot build it, so a
# tree with the engine source and no binary has no `headwater` command.
# `.agents/skills` goes with `skills`, because `headwater init --harness`
# writes it. `AGENTS.md` and `.codex` are the Codex copies of the standing
# instructions and the hook, so they go with the rest of the harness, and
# scenario 2 differs from scenario 1 by one copy of `CLAUDE.md`. The Copilot
# copies under `.github/` go with the harness for the same reason:
# `copilot-instructions.md` links to `CLAUDE.md`, `hooks/hooks.json` wires the
# hooks, and `agents/` and `prompts/` bind the agents and commands. No
# `headwater init --harness` writes them, the maintainer's binding included.
#
# The hook layer holds one `UserPromptSubmit` entry, so it writes its own
# `.claude/settings.json`. The rest of the harness holds the whole file. The
# engine admits that one pair of equal paths: where a scenario holds both
# layers, as scenario 13 does, the whole file is kept.
#
# The engine refuses a layer path that two layers claim, a scenario that names
# a layer not declared here, a scenario 0 that holds a layer, and a scenario
# that differs from its base by anything but exactly one added layer.
layers:
  docs:
    paths:
      - docs
      - engine/crates/census/fixtures/corpus.census
      - site/tutorial/index.html
  engine:
    paths:
      - .headwater
      - engine/target/dev-release/headwater
  claude-md:
    paths: [CLAUDE.md]
