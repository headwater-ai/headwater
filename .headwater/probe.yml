# The fourteen scenarios of milestone 0.07, #1780 to #1793. Each but scenario
# 0 names one base, and the difference from that base is the one comparison
# the plan registers. `answer-once` is the block that answers each layer
# once, and `interaction` is the block that measures two layers together.
scenarios:
  0:
    block: answer-once
    layers: []
  1:
    block: answer-once
    base: 0
    layers: [docs]
  2:
    block: interaction
    base: 1
    layers: [docs, claude-md]
  3:
    block: answer-once
    base: 1
    layers: [docs, engine]
  4:
    block: answer-once
    base: 3
    layers: [docs, engine, skills]
  5:
    block: answer-once
    base: 3
    layers: [docs, engine, hook]
  6:
    block: answer-once
    base: 3
    layers: [docs, engine, mcp]
  7:
    block: interaction
    base: 5
    layers: [docs, engine, hook, mcp]
  8:
    block: interaction
    base: 4
    layers: [docs, engine, claude-md, skills]
  9:
    block: interaction
    base: 5
    layers: [docs, engine, claude-md, hook]
  10:
    block: interaction
    base: 5
    layers: [docs, engine, skills, hook]
  11:
    block: answer-once
    base: 10
    layers: [docs, engine, claude-md, skills, hook]
  12:
    block: answer-once
    base: 11
    layers: [docs, engine, claude-md, skills, hook, mcp]
  13:
    block: answer-once
    base: 11
    layers: [docs, engine, claude-md, skills, hook, harness]

# The common probe set of the additive campaign and its split, as HW-DR-0111
# fixes them. `headwater probe plan --set <name>` selects one set across
# categories. The engine refuses an empty set, a probe in both sets, and an
# identifier that no probe document carries.
sets:
  tuning:
    - HW-PROBE-a-session-records-which-obligation-an-evaluation-discharged
    - HW-PROBE-a-cold-agent-reaches-the-governing-document-through-the-corpus-descriptor
    - HW-PROBE-a-session-follows-two-citations-from-a-record-the-task-does-not-name
    - HW-PROBE-an-agent-reaches-the-adjudication-when-the-decision-a-tombstone-links-is-superseded
  held-out:
    - HW-PROBE-what-a-session-writes-points-back-at-the-ruling-it-rests-on
    - HW-PROBE-the-pointer-this-corpus-offers-for-a-task-is-the-document-a-session-opens
    - HW-PROBE-a-session-says-which-date-a-corrected-status-carries
    - HW-PROBE-a-session-says-whether-a-command-or-a-hand-writes-a-governs-line

# The rounds of the additive campaign. Each round names the set it runs, the
# two pooled rates it is sized to separate, and the most tries it may take.
# The level and the power are those of `power:` above. The dry run reads this
# block with `tools/probe/declared.py` and computes each round's repetitions
# with the formula `tools/probe/campaign-dry-run.sh` states: the sessions per
# scenario over the set's probes, rounded up. The screening round and each
# tuning try run the tuning set alone, and only the final round runs the
# held-out set, so no held-out result exists before it.
#
# `approved_cents` is the spend a person approved for every attempt of the
# round (#1775), and a round that declares none is approved for nothing.
# `tools/probe/campaign.sh` refuses a batch line of a round whose approval is
# 0, with 5, before it builds a tree or asks the harness anything. The owner
# approved the screening round, at $700, on 2026-10-18 (#1775). On
# 2026-10-19 the owner approved the tuning round, at $1,512.00 over every
# attempt and every layer (#1777): one layer at a time, every layer gets at
# least one paid try, and the owner accepts each layer's plan before any
# spend on that layer. HW-DR-0111 records both rulings. The final round waits
# on a ruling of its own.
rounds:
  screening:
    set: tuning
    rates: [0.625, 0.375]
    tries: 1
    approved_cents: 70000
  tuning:
    set: tuning
    rates: [0.625, 0.375]
    tries: 3
    approved_cents: 151200
  final:
    set: held-out
    rates: [0.90, 0.80]
    tries: 1
    approved_cents: 0

# The absent arm names a declared ablation (spec 5, "the counterfactual is not
# a category, it is an arm of every probe... the absent arm names a declared
# ablation, so what 'corpus absent' removed is a recorded fact"). The
# `ablation` field of each paired tier is that record, and the engine refuses
# a tier that runs the absent arm and declares none.
#
# **What each path delivers.** `CLAUDE.md`, `.claude/`, `.githooks/` and
# `.headwater/` are the whole of what delivers this repository's governance to
# a session: the standing instructions, the skills and agent definitions the
# harness reads, the commit-time enforcement, and the taxonomy, cache and
# probe declarations the engine resolves against. Removing them leaves a
# session with no orchestration prose to read, no skill to invoke, no hook to
# run and no working `headwater` binary to route or explain with, because
# `headwater check`, `route` and `explain` all read `.headwater/taxonomy.lock`
# and refuse with nothing to resolve. `docs/` is the corpus content. The
# campaign keeps it, so a probe's target document exists in both of its arms;
# the documentation tier removes it, which is why that tier admits no probe
# whose predicate names one. `engine/` and `tools/` are untouched in both.
#
# **How the tree is produced.** `sh tools/probe/ablate.sh <tier> <workspace>`
# takes a present-arm workspace — the full copy outside this repository that
# `tools/probe/probe-record.sh` already requires — and deletes the tier's
# `ablation` entries from it, in place, reading them from this file in the
# checkout and never from the workspace. It refuses a tier that declares no
# ablation, and a workspace inside this repository's own checkout, the guard
# `probe-record.sh` already applies to the same argument.
#
# **What the seal removes, in every arm, and why.** The instrument above, and
# each document under `docs/` whose bytes name a selected probe by its
# identifier or its slug. For the seven probes of the #980 batch, on
# 2026-09-29, those documents were 5 obligations and 1 evaluation, and each
# states a probe's expected value, a recorded verdict or answer of a session,
# or an `examines` target. So they are answer keys in the same sense as the
# instrument. The 2026-09-17 tombstone session read its own probe file before
# it answered (#1229).
#
# A deleted document goes with its identifier claim and with every line in
# the workspace that holds its identifier as a whole name or its file name,
# as an answer key below does. A JSON fold loses the array element instead,
# so it still parses. The #980 batch deleted HW-OBL-0013 and left its
# shelf-index line, its register line and its claim, and 23 of 30 present-arm
# sessions of the tombstone probe queried it (#1293). A generic slug, one
# word or a file name that another file shares such as `README`, removes no
# line.
#
# The seal deletes no other file. Every other file that names a probe does so
# by path or title and states no answer: the derived folds listed above, the
# census and graph fixtures, and a comment in the hand-written
# `.headwater/overlay.yml`. The present arm is meant to test `.headwater/`, so
# the seal keeps each one as a file. No probe's `examines` target names a
# probe, so the documents that a probe tests survive the seal.
#
# **What the seal does to the comparison.** It runs in every arm, so the
# sealed records are absent from both sides of every present-versus-absent pair, and
# the pair still differs only by the tier's `ablation`. A rate is then a rate
# over the corpus less those records. The `documentation` tier removes all of
# `docs/` in its absent arm anyway, so the seal changes only its present arm.
# `sh tools/probe/seal.sh <workspace> <probe-id>...` is the mechanism, and
# `probe-record.sh` refuses a workspace that still holds the instrument
# (exit 8) or a record under `docs/` that names the probe (exit 9).
# Every transcript on `docs/probe-runs/` was recorded before the seal existed.
#
# `session_cost_cents` was a declared number and not a measured one until the
# first regression run gave it something to fit against. Two committed
# regression-tier transcripts carry a realized cost over eight probes each: 390
# cents and 407 cents, or 48.75 and 50.875 cents per session. The paired tiers
# now declare 50. The regression tier keeps 25, because its ceiling already
# clears ten sessions at the realized rate.
#
# What a campaign costs at these numbers. The plan projects each category on
# its own: sufficiency 4 x 2 x 30 = 240 sessions, $120.00; navigability 3 x 2 x
# 30 = 180 sessions, $90.00; discovery without the authoring-skill probe 2 x 2
# x 30 = 120 sessions, $60.00. That is $270.00 against the campaign's $300.00.
# The documentation tier plans its sufficiency selection at 240 sessions,
# $120.00, against $130.00, and a batch records only its absent arm, 120
# sessions, because the present arm is the campaign's. The plan checks one
# selection against the ceiling, and `tools/probe/campaign.sh` holds the sum
# of a tier's sessions to it while it spends.
