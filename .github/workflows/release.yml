# SPDX-License-Identifier: Apache-2.0
#
# The engine release: a `v*` tag, or a hand run with a `tag` input, builds
# three archives (glibc Linux, static musl Linux, Apple silicon macOS), runs
# the musl and macOS archives on hosts that did not build them, and creates
# the GitHub release only when both smoke jobs pass.
#
# To run a change to this file on its branch before it merges, with no release:
#
#   gh workflow run release.yml --ref <branch> -f tag=v0.1.2 -f publish=false
#
# The reasons live in records, and this file cites them rather than restating
# them. Each record governs this file, so an edit here makes it suspect:
#
#   HW-DR-0088  the `v*` namespace, apart from the taxonomy release
#   HW-DR-0090  the release notes state the `release.digest`
#   HW-DR-0091  the runner images are written here, and the build is `--locked`
#   HW-PD-0009  every asset goes into the one `gh release create` call
#   HW-PD-0010  the tag is compared with the version the binary prints
#   HW-PD-0012  a separate file, one tag value, and names a fixture can read
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and attach the archives to
        required: true
      smoke-apt:
    name: The Debian package installs through a signed APT repository on ${{ matrix.image }}
    needs: [tag, build]
    # The decisive test of the APT route (#764). It builds a `file:` repository
    # from the package the build uploaded, signs it with a key made in this
    # container and thrown away with it, and installs through apt on the
    # oldest and the newest distribution the package supports. The owner's
    # key is never here, so the job runs on every branch. The negative half is
    # the reason the job exists: the same package, signed by another key or
    # not signed at all, must be refused, because a job that only installs
    # would pass on an unsigned repository. Publishing waits on this job.
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:bullseye', 'ubuntu:24.04']
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    # `sh` is dash here and refuses `pipefail`, as in `smoke-linux`.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: headwater-deb
      - name: Sign a local repository, refuse the badly signed ones, install from the good one
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -eo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if command -v cargo || command -v rustc; then
              echo "::error::this container has a Rust toolchain, so it cannot show that the package needs none" && exit 1
          fi
          version="${TAG#v}"
          version="${version/-/\~}"
          deb="headwater_${version}_amd64.deb"
          [ -f "$deb" ] || { echo "::error::the build uploaded no $deb" && exit 1; }
          [ -s surface-deb.txt ] || { echo "::error::the build uploaded no surface.deb list, so this job would pass any package" && exit 1; }
          # The tools that make and sign a repository, from the distribution's
          # own mirror, before any Headwater source exists.
          apt-get update -qq
          apt-get install -y -qq gnupg apt-utils >/dev/null

          # Two ephemeral keys. `good` is the key apt is told to trust, and
          # `other` signs the repository apt must refuse.
          for name in good other; do
              export GNUPGHOME="/srv/gpg-$name"
              mkdir -p -m 0700 "$GNUPGHOME"
              gpg --batch --quiet --passphrase '' --quick-gen-key "Headwater smoke $name <$name@smoke.invalid>" ed25519 sign never
              gpg --batch --export >"/srv/$name.gpg"
          done

          # One repository per case, each holding the same package.
          repo() {
              local dir="/srv/apt-$1" signer="$2"
              mkdir -p "$dir/pool/main/h/headwater" "$dir/dists/stable/main/binary-amd64"
              cp "$deb" "$dir/pool/main/h/headwater/"
              (cd "$dir" && apt-ftparchive packages pool >dists/stable/main/binary-amd64/Packages)
              apt-ftparchive -o APT::FTPArchive::Release::Suite=stable -o APT::FTPArchive::Release::Codename=stable \
                  -o APT::FTPArchive::Release::Components=main -o APT::FTPArchive::Release::Architectures=amd64 \
                  release "$dir/dists/stable" >/srv/Release
              mv /srv/Release "$dir/dists/stable/Release"
              if [ -n "$signer" ]; then
                  export GNUPGHOME="/srv/gpg-$signer"
                  gpg --batch --yes --clearsign -o "$dir/dists/stable/InRelease" "$dir/dists/stable/Release"
                  gpg --batch --yes --armor --detach-sign -o "$dir/dists/stable/Release.gpg" "$dir/dists/stable/Release"
              fi
              chmod -R a+rX "$dir"
          }
          repo good good
          repo other other
          repo unsigned ''

          # apt reads one list per case and no other source, so a case
          # cannot borrow a result from another.
          mkdir -p /srv/no-parts
          apt_case() {
              printf 'deb [signed-by=/srv/good.gpg] file:/srv/apt-%s stable main\n' "$1" >"/srv/$1.list"
              rm -rf /var/lib/apt/lists/*
              apt-get -o Dir::Etc::SourceList="/srv/$1.list" -o Dir::Etc::SourceParts=/srv/no-parts "${@:2}"
          }
          for bad in other unsigned; do
              if apt_case "$bad" update >"/srv/$bad.out" 2>&1; then
                  cat "/srv/$bad.out"
                  echo "::error::apt accepted the \`$bad\` repository, which the key it trusts did not sign" && exit 1
              fi
              cat "/srv/$bad.out"
              if ! grep -Eq 'NO_PUBKEY|is not signed|signatures (couldn.t|were invalid)|not be verified' "/srv/$bad.out"; then
                  echo "::error::apt refused the \`$bad\` repository for a reason that is not its signature" && exit 1
              fi
              if apt_case "$bad" install -y headwater >/dev/null 2>&1 || dpkg -s headwater >/dev/null 2>&1; then
                  echo "::error::headwater installed from the \`$bad\` repository" && exit 1
              fi
              echo "apt refused the \`$bad\` repository and installed nothing from it"
          done

          apt_case good update
          apt_case good install -y headwater

          [ "$(command -v headwater)" = /usr/bin/headwater ] || { echo "::error::headwater is at $(command -v headwater), not /usr/bin/headwater" && exit 1; }
          printed=$(headwater --version | awk '{print $NF}')
          if [ -z "$printed" ]; then
              echo "::error::the installed binary printed no version on $(head -1 /etc/os-release)" && exit 1
          fi
          case "${TAG#v}" in
              "$printed"*) echo "$TAG carries $printed, installed by apt, on $(grep PRETTY_NAME /etc/os-release)" ;;
              *) echo "::error::the tag names ${TAG#v} and the installed binary prints $printed" && exit 1 ;;
          esac

          # What dpkg says it installed, as files, against `surface.deb`.
          installed=$(dpkg -L headwater | while read -r path; do [ -f "$path" ] && echo "$path"; done | sort)
          declared=$(sort surface-deb.txt)
          if [ "$installed" != "$declared" ]; then
              echo "::error::dpkg -L and surface.deb differ"
              diff <(echo "$declared") <(echo "$installed") || true
              exit 1
          fi
          for path in $declared; do
              [ -s "$path" ] || { echo "::error::$path is empty or absent" && exit 1; }
          done
          # The package is taxonomy-free and runs nothing at install (#764).
          if dpkg -L headwater | grep -E 'taxonomy|\.headwater'; then
              echo "::error::the package carries a taxonomy path" && exit 1
          fi
          for script in preinst postinst prerm postrm; do
              if [ -e "/var/lib/dpkg/info/headwater.$script" ]; then
                  echo "::error::the package carries a $script script" && exit 1
              fi
          done
          echo "installed exactly surface.deb: $(echo $declared)"

  publish:
        # `false` runs every build and both smoke jobs and creates no release,
        # which is how this file is run on a branch before it merges.
        description: Create the release once every archive has run
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tag:
    name: The tag this run is about
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: The tag this run is about
        # Every job below reads this output and never `github.ref_name` (HW-PD-0012).
        id: tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
              v*) ;;
              *) echo "::error::\`$tag\` is not a tag of the form this workflow releases" && exit 1 ;;
          esac
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: tag
    # Three archives, one per row, each name written in full (HW-PD-0012).
    # Each runner image is written here and sets the floor of its archive
    # (HW-DR-0091): the gnu row needs glibc 2.39 or later because
    # `ubuntu-24.04` built it. The `headwater-check` action downloads the gnu
    # archive by that name, so it stays. #975 and HW-DR-0077 are why the musl
    # and darwin rows exist.
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            archive: headwater-${TAG}-x86_64-unknown-linux-gnu.tar.gz
            checksum: headwater-${TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            archive: headwater-${TAG}-x86_64-unknown-linux-musl.tar.gz
            checksum: headwater-${TAG}-x86_64-unknown-linux-musl.tar.gz.sha256
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: headwater-${TAG}-aarch64-apple-darwin.tar.gz
            checksum: headwater-${TAG}-aarch64-apple-darwin.tar.gz.sha256
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - name: The toolchain this build needs
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: The C toolchain a static musl link needs
        # `tract-linalg` compiles C and assembly kernels through `cc`, and on
        # the musl target `cc` looks for `musl-gcc`. The hosted image does not
        # carry it.
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build the engine
        # `--locked`: HW-DR-0091.
        run: cargo build --release -p headwater-cli --locked --target ${{ matrix.target }}
        working-directory: engine
      - name: The binary prints the version the tag names
        # The version guard, and the guard on it: HW-PD-0010. Each row runs its
        # own binary here, on the host that built it.
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -eo pipefail
          printed=$(./engine/target/${{ matrix.target }}/release/headwater --version | awk '{print $NF}')
          if [ -z "$printed" ]; then
              echo "::error::the binary printed no version, so this step would pass for any tag" && exit 1
          fi
          case "${TAG#v}" in
              "$printed"*) echo "$TAG carries $printed" ;;
              *) echo "::error::the tag names ${TAG#v} and the binary prints $printed" && exit 1 ;;
          esac
      - name: The archive and the checksum beside it
        # Both names come from the matrix row, written in full (HW-PD-0012).
        #
        # `shasum -a 256` rather than `sha256sum`, because macOS carries only
        # the first. It writes the same line, and `sha256sum -c` reads it.
        # `COPYFILE_DISABLE` keeps macOS `tar` from adding `._` resource files.
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          COPYFILE_DISABLE: 1
        run: |
          asset="${{ matrix.archive }}"
          checksum="${{ matrix.checksum }}"
          stage=$(mktemp -d)
          cp engine/target/${{ matrix.target }}/release/headwater "$stage/headwater"
          cp LICENSE "$stage/LICENSE"
          tar -czf "$asset" -C "$stage" headwater LICENSE
          shasum -a 256 "$asset" >"$checksum"
          cat "$checksum"
          mkdir dist
          mv "$asset" "$checksum" dist/
      - name: The manifest of the workflow's own commit
        # `surface.archive` in the overlay is the one list of what an archive
        # holds (HW-DR-0077). It is read at `github.sha` and not at the tag,
        # because a hand run checks out a tag cut before the manifest existed.
        # On a tag push the two are the same commit.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: manifest
          sparse-checkout: .headwater/overlay.yml
          sparse-checkout-cone-mode: false
      - name: The archive holds the members the consumer surface declares
        # The list lives only in the overlay, so this step reads it rather
        # than carrying a copy. A member the archive has and the list does not,
        # or the other way round, is named and stops the release.
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -eo pipefail
          declared=$(awk '
              /^  surface:/ { surface = 1; next }
              surface && /^  [^ ]/ { surface = 0 }
              surface && /^    archive:/ { archive = 1; next }
              archive && /^      - / { sub(/^      - /, ""); print; next }
              archive { archive = 0 }
          ' manifest/.headwater/overlay.yml | sort)
          if [ -z "$declared" ]; then
              echo "::error::the overlay at ${{ github.sha }} declares no surface.archive, so this step would pass any archive" && exit 1
          fi
          held=$(tar -tzf "dist/${{ matrix.archive }}" | sed 's|^\./||' | grep -v '^$' | sort)
          extra=$(comm -13 <(printf '%s\n' "$declared") <(printf '%s\n' "$held"))
          missing=$(comm -23 <(printf '%s\n' "$declared") <(printf '%s\n' "$held"))
          if [ -n "$extra" ] || [ -n "$missing" ]; then
              [ -z "$extra" ] || echo "::error::the archive holds members surface.archive does not declare: $(echo $extra)"
              [ -z "$missing" ] || echo "::error::the archive lacks members surface.archive declares: $(echo $missing)"
              exit 1
          fi
          echo "the archive holds exactly surface.archive: $(echo $declared)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  smoke-linux:
    name: The static Linux archive runs on an older distribution with no toolchain
    needs: [tag, build]
    # The decisive test of the musl archive. `debian:bullseye` carries glibc
    # 2.31, older than the 2.39 the gnu archive needs, and no Rust at all. The
    # job reads the archive the build uploaded and never the build tree, so it
    # runs what a stranger downloads. Publishing waits on this job.
    runs-on: ubuntu-24.04
    container: debian:bullseye
    # Inside a container GitHub's default shell is `sh -e {0}`, which is dash
    # on Debian and refuses `set -o pipefail`. The first run of this job died
    # on that line. `bash` is in the image and nothing else is added.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: x86_64-unknown-linux-musl
      - name: Unpack, verify and run the archive
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -eo pipefail
          asset="headwater-${TAG}-x86_64-unknown-linux-musl.tar.gz"
          checksum="headwater-${TAG}-x86_64-unknown-linux-musl.tar.gz.sha256"
          if command -v cargo || command -v rustc; then
              echo "::error::this container has a Rust toolchain, so it cannot show that the archive needs none" && exit 1
          fi
          sha256sum -c "$checksum"
          tar -xzf "$asset"
          # `ldd` exits 1 for a static executable and 0 for a static-pie one on
          # some glibc versions, so its status says nothing here and its words
          # decide. A line with `=>` is a shared library the binary loads.
          ldd ./headwater >ldd.txt 2>&1 || true
          cat ldd.txt
          if grep -q '=>' ldd.txt || ! grep -Eq 'not a dynamic executable|statically linked' ldd.txt; then
              echo "::error::the archive holds a dynamically linked binary, so it runs only where its C library is" && exit 1
          fi
          printed=$(./headwater --version | awk '{print $NF}')
          if [ -z "$printed" ]; then
              echo "::error::the binary printed no version on $(head -1 /etc/os-release)" && exit 1
          fi
          case "${TAG#v}" in
              "$printed"*) echo "$TAG carries $printed, statically linked, on $(grep PRETTY_NAME /etc/os-release)" ;;
              *) echo "::error::the tag names ${TAG#v} and the binary prints $printed" && exit 1 ;;
          esac

  smoke-macos:
    name: The macOS archive runs on a host that did not build it
    needs: [tag, build]
    # A second `macos-14` host that installs nothing. The hosted image does
    # carry a Rust toolchain, so the binary runs with an environment that
    # holds only `/usr/bin` and `/bin`, and every library it loads must be
    # one the operating system ships. Publishing waits on this job.
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aarch64-apple-darwin
      - name: Unpack, verify and run the archive
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -eo pipefail
          asset="headwater-${TAG}-aarch64-apple-darwin.tar.gz"
          checksum="headwater-${TAG}-aarch64-apple-darwin.tar.gz.sha256"
          shasum -a 256 -c "$checksum"
          tar -xzf "$asset"
          otool -L ./headwater
          foreign=$(otool -L ./headwater | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/)' || true)
          if [ -n "$foreign" ]; then
              echo "::error::the binary loads libraries macOS does not ship: $foreign" && exit 1
          fi
          printed=$(env -i PATH=/usr/bin:/bin ./headwater --version | awk '{print $NF}')
          if [ -z "$printed" ]; then
              echo "::error::the binary printed no version" && exit 1
          fi
          case "${TAG#v}" in
              "$printed"*) echo "$TAG carries $printed on $(sw_vers -productVersion) $(uname -m)" ;;
              *) echo "::error::the tag names ${TAG#v} and the binary prints $printed" && exit 1 ;;
          esac

  publish:
    name: Attach the archives to the release
    # Every archive has run on a host that did not build it before this job
    # starts. `publish: false` stops here, and this job alone asks for
    # `contents: write` (HW-PD-0012).
    needs: [tag, build, smoke-linux, smoke-macos]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: The digest the package in this tree publishes
        # The notes state the `release.digest` (HW-DR-0090). This step reaches
        # no network, and `tools/repo/readme-fixtures.sh` runs it by the name
        # above (HW-PD-0012), so do not rename it.
        run: |
          digest=$(awk '/^release:/{b=1;next} /^[^ \t#]/{b=0} b && /^  digest:/{print $2; exit}' .headwater/packages/headwater-standard/release.yml)
          if [ -z "$digest" ]; then
              echo "::error::.headwater/packages/headwater-standard/release.yml states no release.digest, so this release would carry none" && exit 1
          fi
          printf 'release.digest: %s\n\nThis tag carries `headwater/standard` with that `release.digest`. Pass the value to `headwater taxonomy vendor <dir> --expect %s`. It is what `headwater taxonomy publish` printed for the package in this tree, and it is not a checksum of any one file.\n' "$digest" "$digest" >release-notes.md
      - name: Attach every archive and its checksum to the release
        # Every asset in the one `create` call, and a tag that has a release
        # refuses (HW-PD-0009). `--notes-file` is the step above, and `gh`
        # puts its text before the generated list (HW-DR-0090). The six names
        # are written again in full for `tools/repo/readme-fixtures.sh`
        # (HW-PD-0012).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gnu="headwater-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          gnu_sum="headwater-${TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256"
          musl="headwater-${TAG}-x86_64-unknown-linux-musl.tar.gz"
          musl_sum="headwater-${TAG}-x86_64-unknown-linux-musl.tar.gz.sha256"
          darwin="headwater-${TAG}-aarch64-apple-darwin.tar.gz"
          darwin_sum="headwater-${TAG}-aarch64-apple-darwin.tar.gz.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::error::$TAG already has a release, and GitHub will not let this step add assets to it. Delete the release (not the tag) and run this workflow again." && exit 1
          fi
          gh release create "$TAG" "$gnu" "$gnu_sum" "$musl" "$musl_sum" "$darwin" "$darwin_sum" --title "$TAG" --generate-notes --notes-file release-notes.md
      - name: What the release now carries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release view "$TAG" --json assets --jq '.assets[].name'
