# SPDX-License-Identifier: Apache-2.0
#
# The taxonomy release: a `taxonomy/headwater-standard/v*` tag, or a hand run
# with a `tag` input, publishes `taxonomy-source/headwater-standard` at the
# tagged commit and attaches `headwater-standard-<version>.zip` to the tag's
# release, with the digest in its notes. #757 found the gap, and #760 named
# this shape.
#
# The reasons live in records, and this file cites them rather than restating
# them. Each record governs this file, so an edit here makes it suspect:
#
#   HW-DR-0088  a tag namespace of its own, apart from `v*`
#   HW-DR-0089  publish the source at the tag, never zip the vendored copy
#   HW-DR-0090  the release notes state the `release.digest`
#   HW-DR-0091  the engine that publishes is built `--locked`
#   HW-PD-0009  the archive goes into the one `gh release create` call
#   HW-PD-0010  the tag is compared with the version `publish` wrote
#   HW-PD-0012  a separate file, one tag value, and a name a fixture can read
name: Release (taxonomy)

on:
  push:
    tags:
      - 'taxonomy/headwater-standard/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: The taxonomy tag to build and attach the artifact to
        required: true

permissions:
  contents: read

jobs:
  artifact:
    name: A published taxonomy artifact attached to the tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: The tag this run is about, and the version it names
        # Every step below reads this output and never `github.ref_name` (HW-PD-0012).
        id: tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
              taxonomy/headwater-standard/v*) ;;
              *) echo "::error::\`$tag\` is not a tag of the form this workflow releases" && exit 1 ;;
          esac
          version="${tag#taxonomy/headwater-standard/v}"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: The toolchain this build needs
        run: |
          rustup update --no-self-update stable
          rustup default stable
      - name: Build the engine
        # `--locked`: HW-DR-0091.
        run: cargo build --release -p headwater-cli --locked
        working-directory: engine
      - name: Publish the package, and read the digest it printed
        # `--from` is read relative to this step's working directory, which
        # has to be the repository root: the source package's bundle paths
        # resolve against the tree `publish` is reading, and running from
        # inside `engine/` or handing `--from` a path relative to somewhere
        # else makes a bundle under `docs/taxonomies` resolve outside the tree
        # `publish` refuses to read from.
        #
        # The version guard, and the guard on it: HW-PD-0010.
        id: publish
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -eo pipefail
          stage=$(mktemp -d)
          printed=$(./engine/target/release/headwater taxonomy publish \
              --from taxonomy-source/headwater-standard --out "$stage" \
              | tee /dev/stderr | awk '/^  digest /{print $2}')
          if [ -z "$printed" ]; then
              echo "::error::publish printed no digest, so this step would pass for any tag" && exit 1
          fi
          printed_version=$(awk '/^version:/{print $2}' "$stage/package.yml")
          if [ "$printed_version" != "$VERSION" ]; then
              echo "::error::the tag names $VERSION and the published record carries $printed_version" && exit 1
          fi
          echo "stage=$stage" >>"$GITHUB_OUTPUT"
          echo "digest=$printed" >>"$GITHUB_OUTPUT"
      - name: The archive beside the digest
        # The name is written in full (HW-PD-0012).
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          STAGE: ${{ steps.publish.outputs.stage }}
        run: |
          asset="headwater-standard-${VERSION}.zip"
          repo_root=$(pwd)
          (cd "$STAGE" && zip -qr "$repo_root/$asset" .)
          echo "asset=$asset" >>"$GITHUB_ENV"
      - name: Attach the archive to the release, with the digest in its notes
        # The archive goes into the one `create` call, and a tag that has a
        # release refuses (HW-PD-0009). `--notes` states the digest (HW-DR-0090).
        # `--latest=false` keeps `releases/latest` an engine release: the site
        # copies its APT repository from there, and a taxonomy release that
        # became "latest" took `apt/` off the site (HW-DR-0094, #1449).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::error::$TAG already has a release, and GitHub will not let this step add assets to it. Delete the release (not the tag) and run this workflow again." && exit 1
          fi
          notes=$(printf 'release.digest: %s\n\nPass this value to `headwater taxonomy vendor https://github.com/%s/releases/download/%s/%s --expect %s`, with headwater v0.2.1 or later, or to `headwater taxonomy vendor <dir> --expect %s` on an unpacked copy of the zip. It is the value `headwater taxonomy publish` printed for this tag, not a checksum of %s.' \
              "$DIGEST" "$GITHUB_REPOSITORY" "$TAG" "$asset" "$DIGEST" "$DIGEST" "$asset")
          gh release create "$TAG" "$asset" --title "$TAG" --notes "$notes" --latest=false
      - name: What the release now carries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release view "$TAG" --json assets --jq '.assets[].name'
