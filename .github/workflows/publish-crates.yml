# SPDX-License-Identifier: Apache-2.0
#
# Publishes every workspace crate to crates.io, leaves first, so that
# `cargo install headwater-cli` resolves (#735). A `v*` tag starts it, or a
# hand run with a required `tag` input.
#
# The reasons live in records, and this file cites them rather than restating
# them. Each record governs this file, so an edit here makes it suspect:
#
#   HW-DR-0088  the `v*` namespace, the same tag as `release.yml`
#   HW-PD-0010  the tag is compared with the version `cargo metadata` reads
#   HW-PD-0011  the fixed order, the skip that lets a rerun continue, the
#               index wait and the wait for a 429
#   HW-PD-0012  a separate file and one tag value
name: Publish crates

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: The tag whose version this dispatches a crates.io publish for
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Every workspace crate, leaves first, to crates.io
    runs-on: ubuntu-24.04
    steps:
      - name: The tag this run is about
        # Every step below reads this output and never `github.ref_name` (HW-PD-0012).
        id: tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
              v*) ;;
              *) echo "::error::\`$tag\` is not a tag of the form this workflow publishes" && exit 1 ;;
          esac
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: The toolchain this build needs
        run: |
          rustup update --no-self-update stable
          rustup default stable
      - name: Publish the closure in dependency order, skipping what is already there
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: engine
        run: |
          set -eo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
              echo "::error::no CARGO_REGISTRY_TOKEN secret; nothing below can publish" && exit 1
          fi
          # Leaves first, fixed rather than computed on each run (HW-PD-0011).
          # `engine/crates/cli/tests/publish_order.rs` holds this list against
          # the workspace, and it reads the variable below by its name.
          order="headwater-hash headwater-mark headwater-paint headwater-vcs headwater-fetch headwater-verbs headwater-yaml \
                 headwater-doc headwater-ref headwater-meta headwater-resolve \
                 headwater-census headwater-graph headwater-lock headwater-check \
                 headwater-probe headwater-scaffold headwater-sweep \
                 headwater-adapter headwater-audit headwater-import \
                 headwater-query headwater-generate headwater-compat headwater-embed \
                 headwater-conformance headwater-cli"
          version=$(cargo metadata --no-deps --format-version 1 |
                     python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"]=="headwater-cli"))')
          # The version guard: HW-PD-0010.
          case "${TAG#v}" in
              "$version") ;;
              *) echo "::error::the tag names ${TAG#v} and the workspace carries $version" && exit 1 ;;
          esac
          # A 429 names the moment the new-crate limiter refills, e.g. "Please
          # try again after Tue, 08 Sep 2026 20:48:04 GMT". Wait to it, 5 seconds
          # more, and try the same crate again. Any other failure stops the job
          # (HW-PD-0011).
          publish_with_retry() {
              crate="$1"
              while true; do
                  set +e
                  output=$(cargo publish -p "$crate" --locked 2>&1)
                  rc=$?
                  set -e
                  echo "$output"
                  if [ "$rc" -eq 0 ]; then
                      return 0
                  fi
                  retry_at=$(echo "$output" | grep -oE 'try again after [A-Za-z]{3}, [0-9]{2} [A-Za-z]{3} [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2} GMT' | sed 's/^try again after //')
                  if [ -z "$retry_at" ]; then
                      echo "::error::cargo publish failed for $crate for a reason this loop cannot wait out"
                      return 1
                  fi
                  retry_epoch=$(date -u -d "$retry_at" +%s)
                  now_epoch=$(date -u +%s)
                  wait=$((retry_epoch - now_epoch + 5))
                  if [ "$wait" -lt 5 ]; then
                      wait=5
                  fi
                  echo "crates.io's new-crate limit holds $crate until $retry_at; sleeping ${wait}s"
                  sleep "$wait"
              done
          }
          # A crate the registry has at this version is skipped, so a rerun
          # continues (HW-PD-0011). crates.io refuses curl's default User-Agent.
          for crate in $order; do
              status=$(curl -sS -H 'User-Agent: headwater-publish-workflow (https://github.com/headwater-ai/headwater)' \
                  -o /dev/null -w '%{http_code}' \
                  "https://crates.io/api/v1/crates/$crate/$version")
              if [ "$status" = "200" ]; then
                  echo "$crate $version already on crates.io, skipping"
                  continue
              fi
              # The index lists every workspace dependency before the crate
              # publishes, and the crate itself before the next one starts, or
              # the job stops naming what it waited for (HW-PD-0011, #1197).
              sh ../tools/repo/crates-index-wait.sh "$crate" "$version"
              echo "publishing $crate $version"
              publish_with_retry "$crate"
              sh ../tools/repo/crates-index-wait.sh --published "$crate" "$version"
          done
