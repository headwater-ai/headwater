# SPDX-License-Identifier: Apache-2.0
#
# What #735 asked for and #707 explicitly did not: a route from this
# workspace to crates.io. `release.yml` hands a stranger a binary; this hands
# a Rust user `cargo install headwater-cli`, which needs every crate the
# binary depends on to exist on the registry too, not only the binary crate.
#
# # WHY THIS FIRES ON A TAG, THE SAME AS `release.yml`
#
# A tag is a version bump a person already decided to cut, not a moving
# branch head. Firing on `push: tags: [v*]` ties one crates.io publish to
# one cut, the same commitment `release.yml` ties one binary to, rather than
# to whatever `main` holds at some later moment nobody chose. `workflow_dispatch`
# takes the same tag as an input, required and not defaulted to `main`, for a
# run against a tag that already exists — a step this workflow gained after
# the tag was cut, or a crate rejected for a reason unrelated to the tag. The
# version guard beside `publish_with_retry` below is what a checkout at the
# wrong tag, or a tag cut before the version bump it was meant to carry,
# cannot get past silently.
#
# # WHY ONE STEP AND NOT TWENTY-THREE
#
# The order is not alphabetical and not arbitrary: it is `cargo metadata`'s
# own dependency closure, leaves first, so that by the time this step reaches
# `headwater-cli` every crate it depends on already resolves through the
# registry rather than through the path this workspace builds with locally.
# Getting that order right, once, next to the loop that walks it, is safer
# than getting it right in twenty-three separate step orderings that a future
# edit can silently reorder.
#
# # WHY EACH CRATE IS CHECKED BEFORE IT IS PUBLISHED
#
# `cargo publish` refuses a version that already exists, so a rerun after a
# partial failure — crate 9 of 23 rejected for a reason the first 8 already
# cleared — would otherwise fail immediately on crate 1. The check makes a
# rerun resume rather than restart: a crate the registry already carries at
# this version is skipped, and the loop's first real publish is wherever the
# previous run stopped. The check needs its own `User-Agent`: crates.io's
# API rejects curl's default one with a 403, which this loop cannot tell
# apart from a 404, so an unset header reads every crate as unpublished and
# turns "resume" back into "restart".
#
# # WHY THE INDEX GATE
#
# crates.io's sparse index takes a short, unspecified interval to make a freshly
# published crate resolvable to the next `cargo publish` that depends on it.
# Publishing `headwater-yaml` and immediately publishing `headwater-doc`,
# which depends on it, is exactly the race this workflow must close. A fixed
# sleep cannot prove that the dependency is visible, so the loop below reads the
# sparse index and waits for the exact release version before publishing a crate.
#
# # WHY A FAILED PUBLISH RETRIES INSTEAD OF EXITING
#
# crates.io throttles a new crate name, not a new version of one already
# claimed: five in a burst, then one every ten minutes, read from the
# `PublishNew` limiter this registry runs. Twenty-three crates share one
# workspace and most of them are new names, so the closure below runs into
# that limiter as a matter of course, not as a failure of this workflow. A
# 429 names the exact GMT timestamp crates.io will accept the next one at;
# the loop reads that timestamp back out of `cargo publish`'s own error and
# sleeps to it, so one dispatch carries the whole closure to completion
# without a person watching for each ten-minute window to reopen. A failure
# that is not a 429 still stops the run: that is a crate this workflow
# cannot fix by waiting.
name: Publish crates

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: The tag whose version this dispatches a crates.io publish for
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Every workspace crate, leaves first, to crates.io
    runs-on: ubuntu-24.04
    steps:
      - name: The tag this run is about
        # One value for both entry points: the ref for a tag push, the input
        # for a hand run. Every step below reads this and never
        # `github.ref_name`, so the two paths cannot diverge — the same
        # reason `release.yml` names this step the same way.
        id: tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
              v*) ;;
              *) echo "::error::\`$tag\` is not a tag of the form this workflow publishes" && exit 1 ;;
          esac
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: The toolchain this build needs
        run: |
          rustup update --no-self-update stable
          rustup default stable
      - name: Publish the closure in dependency order, skipping what is already there
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: engine
        run: |
          set -eo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
              echo "::error::no CARGO_REGISTRY_TOKEN secret; nothing below can publish" && exit 1
          fi
          # Leaves first. `cargo metadata --no-deps --format-version 1` over
          # this workspace names the same 25 crates and the same edges; this
          # list is that graph's topological order, walked once when #735 was
          # filed and not recomputed on every run, so a dependency a future
          # crate adds is a diff here and not a silent reorder underneath one.
          # `headwater-paint` joined at #479 as a second leaf beside
          # `headwater-hash`: it depends on nothing and `headwater-check`
          # depends on it, so it goes anywhere before that crate.
          # `headwater-vcs` joined at #929 as a third: it depends on nothing,
          # and only `headwater-cli` depends on it. `headwater-fetch` joined at
          # #959 as a fourth, on the same terms: no workspace dependency, and
          # `headwater-cli` its one dependent (HW-DR-0075).
          order="headwater-hash headwater-mark headwater-paint headwater-vcs headwater-fetch headwater-verbs headwater-yaml \
                 headwater-doc headwater-ref headwater-meta headwater-resolve \
                 headwater-census headwater-graph headwater-lock headwater-check \
                 headwater-probe headwater-scaffold headwater-sweep \
                 headwater-adapter headwater-audit headwater-import \
                 headwater-query headwater-generate headwater-compat headwater-embed \
                 headwater-conformance headwater-cli"
          version=$(cargo metadata --no-deps --format-version 1 --locked |
                     python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"]=="headwater-cli"))')
          # The tag names the version this run is meant to publish. A checkout
          # at the wrong ref, or a tag cut before the version bump it was
          # meant to carry, produces a workspace that is not what the tag
          # says — the same defect `release.yml`'s own version-match step
          # guards, and the same reason it is written here rather than
          # trusted.
          case "${TAG#v}" in
              "$version") ;;
              *) echo "::error::the tag names ${TAG#v} and the workspace carries $version" && exit 1 ;;
          esac
          metadata_file="$RUNNER_TEMP/headwater-cargo-metadata.json"
          cargo metadata --no-deps --format-version 1 --locked >"$metadata_file"

          # The sparse index path is specified by crates.io: one-character
          # names live under `1/`, two under `2/`, three under `3/<first>/`,
          # and longer names under `<first two>/<next two>/`.
          index_path() {
          python3 -c 'import sys
          name = sys.argv[1]
          if len(name) == 1:
              print(f"1/{name}")
          elif len(name) == 2:
              print(f"2/{name}")
          elif len(name) == 3:
              print(f"3/{name[0]}/{name}")
          else:
              print(f"{name[:2]}/{name[2:4]}/{name}")' "$1"
          }

          index_has_version() {
              crate="$1"
              index_url="https://index.crates.io/$(index_path "$crate")"
              curl -fsS --retry 3 --retry-delay 2 \
                  -H 'User-Agent: headwater-publish-workflow (https://github.com/headwater-ai/headwater)' \
                  "$index_url" |
          python3 -c 'import json, sys
          version = sys.argv[1]
          for line in sys.stdin:
              try:
                  entry = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if entry.get("vers") == version and not entry.get("yanked", False):
                  raise SystemExit(0)
          raise SystemExit(1)' "$version"
          }

          verified_crates=""
          crate_is_verified() {
              case " $verified_crates " in
                  *" $1 "*) return 0 ;;
                  *) return 1 ;;
              esac
          }

          wait_for_crate_index() {
              crate="$1"
              if crate_is_verified "$crate"; then
                  return 0
              fi
              deadline=$(( $(date +%s) + 600 ))
              while ! index_has_version "$crate"; do
                  now=$(date +%s)
                  if [ "$now" -ge "$deadline" ]; then
                      echo "::error::crates.io sparse index did not list $crate $version within 600s" >&2
                      return 1
                  fi
                  echo "waiting for crates.io sparse index to list $crate $version"
                  sleep 5
              done
              verified_crates="$verified_crates $crate"
          }

          workspace_dependencies() {
              python3 - "$1" "$metadata_file" <<'PY'
          import json
          import sys

          crate, metadata_path = sys.argv[1:]
          with open(metadata_path, encoding="utf-8") as stream:
              metadata = json.load(stream)
          workspace_names = {package["name"] for package in metadata["packages"]}
          package = next(package for package in metadata["packages"] if package["name"] == crate)
          for dependency in package["dependencies"]:
              if dependency["name"] in workspace_names and dependency.get("path"):
                  print(dependency["name"])
          PY
          }

          wait_for_workspace_dependencies() {
              crate="$1"
              dependencies=$(workspace_dependencies "$crate")
              for dependency in $dependencies; do
                  if ! wait_for_crate_index "$dependency"; then
                      echo "::error::$crate is waiting for workspace dependency $dependency $version" >&2
                      return 1
                  fi
              done
          }

          # A 429 from `cargo publish` names the exact moment the PublishNew
          # limiter refills, e.g. "Please try again after Tue, 08 Sep 2026
          # 20:48:04 GMT". This waits to that moment, plus a five-second
          # margin, and tries the same crate again. Anything that is not a
          # 429 — a bad description, a yanked dependency, a token crates.io
          # has revoked — is not a wait, so the loop lets that exit the job.
          publish_with_retry() {
              crate="$1"
              while true; do
                  set +e
                  output=$(cargo publish -p "$crate" --locked 2>&1)
                  rc=$?
                  set -e
                  echo "$output"
                  if [ "$rc" -eq 0 ]; then
                      if printf '%s\n' "$output" | grep -q 'timed out waiting for availability'; then
                          echo "cargo publish warned that $crate timed out waiting for availability; waiting for its index entry before continuing"
                      fi
                      # A successful upload is not complete until the sparse
                      # index can resolve it. This also handles Cargo's
                      # timeout warning without allowing the next crate to run.
                      wait_for_crate_index "$crate"
                      return $?
                  fi
                  retry_at=$(echo "$output" | grep -oE 'try again after [A-Za-z]{3}, [0-9]{2} [A-Za-z]{3} [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2} GMT' | sed 's/^try again after //')
                  if [ -z "$retry_at" ]; then
                      echo "::error::cargo publish failed for $crate for a reason this loop cannot wait out"
                      return 1
                  fi
                  retry_epoch=$(date -u -d "$retry_at" +%s)
                  now_epoch=$(date -u +%s)
                  wait=$((retry_epoch - now_epoch + 5))
                  if [ "$wait" -lt 5 ]; then
                      wait=5
                  fi
                  echo "crates.io's new-crate limit holds $crate until $retry_at; sleeping ${wait}s"
                  sleep "$wait"
              done
          }
          for crate in $order; do
              wait_for_workspace_dependencies "$crate"
              status=$(curl -sS -H 'User-Agent: headwater-publish-workflow (https://github.com/headwater-ai/headwater)' \
                  -o /dev/null -w '%{http_code}' \
                  "https://crates.io/api/v1/crates/$crate/$version")
              if [ "$status" = "200" ]; then
                  echo "$crate $version already on crates.io, skipping"
                  wait_for_crate_index "$crate"
                  continue
              fi
              echo "publishing $crate $version"
              publish_with_retry "$crate"
          done
