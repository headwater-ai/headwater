# SPDX-License-Identifier: Apache-2.0
#
# The loop, closed over this repository. Two jobs, and they answer two different
# questions.
#
#   engine    does the code hold to its own fixtures?
#   headwater does this corpus hold to its own taxonomy?
#
# The second job runs several steps, and only one of them is advisory. A stale lock
# blocks, because `headwater check` reads the lock and never the sources: a lock
# that the sources no longer produce means the verdict came from a taxonomy that
# nobody committed, and an advisory finding about the corpus then answers a
# question nobody asked.
#
# The check itself is advisory and it stays that way until a rule earns a
# promotion. The posture is not set here: `headwater check` exits 0 with findings on stdout
# unless it is given `--strict`, which is the default spec 6 fixes. So a
# promotion is one flag on one line, with the diff that added it as its audit
# trail, rather than a `continue-on-error` that hides which rules block.
#
# No action from outside the `actions` organization. `actions/checkout` and
# `actions/cache` are GitHub's own, and the bar this states is that rather
# than a count of two: an action from anywhere else runs code nobody here
# reviews, on every push, with a token in the environment.
#
# Which runner both jobs take is a repository variable rather than a value
# written here, so moving between the self-hosted runner and `ubuntu-latest`
# costs no commit and no pull request. `CI_RUNNER` holds a JSON list of
# labels, and an unset variable means the self-hosted runner:
#
#   gh variable set CI_RUNNER --body '["ubuntu-latest"]'   # GitHub-hosted
#   gh variable delete CI_RUNNER                           # self-hosted again
#   gh variable list                                       # which one is live
#
# The self-hosted runner is the default because a GitHub-hosted job spends the
# org's included Actions minutes (2,000/month on the Free plan), and the
# spending limit defaults to $0, which refuses such a job outright rather than
# billing it. A self-hosted runner's compute is not metered against that limit
# at all. The hosted image answers a different question: it takes 20 concurrent
# jobs on this plan where the self-hosted runner takes one, so several branches
# under review at once are a reason to spend minutes that one branch is not.
#
# Both images carry a rustup-managed stable toolchain rather than a distro one,
# so the pinned floor is still what the container command in
# `engine/README.md` is for. `--break-system-packages` on every
# `pip install --user` below is what a PEP 668 Python needs, which the
# self-hosted runner is and which the comment ahead of the `mkdocs` install
# already names as a thing a contributor hits reproducing this locally. pip
# accepts the flag where PEP 668 does not apply, so it costs the hosted image
# nothing.
#
# A hosted job restores a cargo cache and a pip cache, and the self-hosted
# runner takes neither: `~/.cargo` and `engine/target` already persist on its
# disk, so restoring them there would be an upload and a download in place of
# a directory that is already correct. `runner.environment` is what tells the
# two apart. So a hosted minute estimate is a cold build on the first run of a
# lock file and a warm one after it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# On the self-hosted runner a superseded run is not merely wasted compute: one
# runner serves this repository and it takes one job at a time, so a run
# nobody will read holds the only runner, and every other branch waits behind
# a verdict about a commit nobody will merge. Three pushes to one branch in
# ten minutes queued three full runs of both jobs, at three to fourteen
# minutes each. On a GitHub-hosted runner the queue is not the cost and the
# minutes are, which is the same reason under a different meter.
#
# The group is per ref, so two different pull requests never cancel each
# other. `github.ref` is `refs/pull/N/merge` on a pull request and
# `refs/heads/main` on a push, which separates them without a second key.
#
# Cancellation is for pull requests only. A run on `main` is the only thing
# that reads the composition of merges, so two merges landing a minute apart
# must produce two verdicts rather than one; cancelling the first would lose
# the only check that ever sees that pair together.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  engine:
    name: Engine tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted", "headwater"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: The cargo cache, on a hosted runner only
        # A hosted runner starts empty, so with no cache the registry is
        # refetched and every dependency is rebuilt on every run. The
        # self-hosted runner needs none of it, because `~/.cargo` and
        # `engine/target` persist on its disk between runs. Hence the
        # condition rather than a comment asking somebody to remember.
        #
        # The key is the lock file, so a dependency change starts a new cache
        # rather than patching an old one. `restore-keys` then falls back to
        # the newest cache of this job, which is what makes a lock bump pay
        # for the crates that moved rather than for all of them.
        #
        # The job name is in the key because this job builds test and debug
        # artifacts and the job below builds a release binary. One key over
        # both would have each run evict the other's `target`.
        #
        # A restored `engine/target` reaches nothing that reads it but cargo,
        # which decides for itself what is stale. `.githooks/fixtures.sh`
        # copies with `ls-files -co --exclude-standard` and `target/` is
        # ignored, so the scratch repository that step builds does not see it.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
          key: cargo-${{ runner.os }}-engine-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-engine-
      - name: The toolchain this build needs
        # Rust 1.90 or later, which `[workspace.package]` in `engine/Cargo.toml`
        # declares and `tools/engine-readme-fixtures.sh` holds against the lock.
        # This step installs current stable, which is above that floor, so the
        # floor is never exercised here — the container commands in
        # `engine/README.md` are the only place it is, and they are the place it
        # broke unnoticed for twelve days.
        run: |
          rustup update --no-self-update stable
          rustup default stable
          cargo --version
      - name: Format
        # No `--locked` here, and it is not an omission: `cargo fmt` rejects
        # the flag outright with `error: unexpected argument '--locked' found`.
        # It reads no manifest and resolves nothing, so there is no lock for it
        # to rewrite. `cargo --version` above is exempt for the same underlying
        # reason and a different surface one: it ACCEPTS `--locked` and exits 0,
        # ignoring it. Every cargo step in this file that resolves a manifest
        # carries the flag, and `tools/build-declaration-fixtures.sh` reads that
        # population by parsing every `run:` value rather than by matching a
        # line shape, so a step added below answers for itself whether it is
        # written plainly, behind a `cd`, behind an environment assignment, in a
        # nested shell or in a block scalar.
        run: cargo fmt --check
        working-directory: engine
      - name: Lint
        # `--locked` before the `--`, or clippy passes it to rustc.
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: engine
      - name: The second implementation of SHA-256 the cross-check runs against
        # `crates/hash/tests/oracle.rs` holds this engine's SHA-256 against
        # `sha256sum`. The package digest of a fetched artifact is computed with
        # that function, and Q22 argued the reuse on the grounds that an
        # implementation defect is answerable by evidence. This is the evidence,
        # so its absence has to be a failure rather than a skip.
        run: sha256sum --version
      - name: The stock validators the two differentials run against
        # Two suites hold an emitter to an implementation nobody here wrote.
        # `engine/crates/generate/tests/differential.rs` compares the emitted
        # JSON Schema's finding set with the engine's.
        # `engine/crates/adapter/tests/fixtures.rs` validates the emitted SARIF
        # against the OASIS schema and reads the finding set back out of it.
        # Absent, each comparison skips, because the pinned build container
        # carries no Python. The two variables below turn a skip into a failure,
        # so neither gate can go quiet by losing a dependency.
        run: python3 -m pip install --user --break-system-packages jsonschema PyYAML
      - name: Test
        run: cargo test --locked
        working-directory: engine
        env:
          HEADWATER_STOCK_VALIDATOR: required
          HEADWATER_SARIF_VALIDATOR: required
          HEADWATER_SHA256_ORACLE: required
          HEADWATER_JSON_ORACLE: required
          # `bash` is the only reader that can say a completion script loads,
          # so `engine/crates/cli/tests/completions.rs` runs the command line
          # clause 8 of #321 states through it. A runner that lost `bash`
          # fails here rather than reporting a script nothing read.
          HEADWATER_SHELL_ORACLE: required

  headwater:
    name: headwater check (advisory)
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted", "headwater"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, because the step that describes this change reads
          # the base of the pull request and a shallow clone does not hold it.
          # `.githooks/change-manifest` refuses a base revision it cannot see
          # rather than describing a shorter change, so a depth of 1 would turn
          # that step red instead of quietly reporting a change of nothing.
          fetch-depth: 0
      - name: The cargo cache, on a hosted runner only
        # The same step in the `engine` job above carries the reasoning. The
        # key differs by one word because that job builds test artifacts and
        # this one builds a release binary, and a shared key would have each
        # run evict the other's `target`.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
          key: cargo-${{ runner.os }}-headwater-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-headwater-
      - name: The pip cache, on a hosted runner only
        # For the `mkdocs` and `pymdown-extensions` install below, which is
        # pinned and is the only pip step here heavy enough to be worth a
        # cache round-trip. The two pure-Python packages the `engine` job
        # installs are not, so that job has no equivalent of this step.
        #
        # The key is this file, because this file is where those pins are
        # written. Any edit here starts a new cache, which costs one download
        # and never serves a wheel that a changed pin no longer names.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: pip-${{ runner.os }}-
      - name: The toolchain this build needs
        run: |
          rustup update --no-self-update stable
          rustup default stable
      - name: Build the engine
        run: cargo build --release -p headwater-cli --locked
        working-directory: engine
      - name: The commit gate refuses what it claims to refuse
        # `.githooks/pre-commit` and the producer under it sit outside the
        # corpus root, so no check reads them and `cargo test` never sees them.
        # This step is what holds them, and it runs over this corpus rather than
        # a fixture tree: the rule it drives reads the lifecycle regime a kind
        # binds, and this repository binds two.
        #
        # It blocks. A commit gate is the one gate a contributor can skip with
        # `--no-verify`, which is exactly why a broken one stays invisible.
        #
        # First of the corpus steps, because it copies every tracked and
        # untracked file into a scratch repository, and every step below writes
        # a report into the workspace that would ride along.
        run: sh .githooks/fixtures.sh
      - name: The committed lock is what the sources resolve to
        # This one blocks, and it is the only step here that does. It is not a
        # finding about the corpus: a stale lock means the verdict below was
        # reached against a taxonomy that nobody committed, so the advisory
        # posture has nothing to be advisory about.
        run: ./engine/target/release/headwater taxonomy resolve --check
      - name: Every projection is what this corpus produces
        # This blocks too, and for the reason the step above blocks rather than
        # the reason the check below is advisory. A projection that differs from
        # its source is not a judgment about prose somebody wrote. It is a
        # derived artifact that is out of date, the remedy is one command, and
        # spec 12 blocks on what a machine repairs.
        #
        # It needs no `--now`. Nothing this verb writes reads a clock, which is
        # what lets it sit above the step that fixes the date for the three runs
        # after it.
        run: ./engine/target/release/headwater generate --check
      - name: The site this corpus's navigation builds
        # This blocks, and the failure it catches is the one that produced
        # #425: a generated artifact that nobody ever fed to its consumer. The
        # nav was held to regeneration by the step above for a week while every
        # path in it named a file MkDocs could not find, because no run of
        # anything asked MkDocs. It has to sit after that step, because a site
        # built from a stale nav proves nothing.
        #
        # The version is pinned because MkDocs's validation defaults are the
        # policy here: `exclude_docs` and the `validation` block arrived in
        # 1.5, and `nav.omitted_files` levels in 1.6. An unpinned install would
        # let a future release move this gate with no commit in this
        # repository. The unpinned `jsonschema PyYAML` step above is not a
        # precedent for a tool whose defaults are what `mkdocs.yml` reasons
        # against.
        #
        # `pip install --user` works on this runner and it does not work
        # everywhere. A PEP 668 environment, which is most current Debian and
        # Ubuntu hosts, refuses it, and `python3 -m venv` fails there too where
        # `ensurepip` is absent. A contributor reproducing this locally wants
        # `pip install --target <dir>` with `PYTHONPATH`, or
        # `--break-system-packages`.
        #
        # `PyYAML` is named rather than left to MkDocs's own dependency
        # resolution. MkDocs 1.6.1 pulls it in, and the compose step below
        # reads `.headwater/taxonomy.lock` with it, so leaving it implicit
        # would make that step fail on a release of MkDocs that stopped
        # depending on it.
        #
        # `pymdown-extensions` is pinned for the reason `mkdocs` is, and it
        # carries more weight than a version floor: `mkdocs.yml` names
        # `pymdownx.slugs.slugify` as the rule that derives every heading
        # anchor on the site, so a release that moved that function would move
        # 2577 anchors and 3559 links with no commit in this repository. #431
        # is what the pin protects, and the step below is what would catch it.
        run: |
          python3 -m pip install --user --break-system-packages \
            mkdocs==1.6.1 pymdown-extensions==10.11.2 PyYAML
          python3 -m mkdocs build --strict
      - name: The build wrote nothing into the deployed site
        # `site/` is the hand-built half HW-DR-0037 governs, `wrangler.jsonc`
        # names it as the asset directory with no build command, and Cloudflare
        # deploys it on every push to the default branch. `mkdocs build` cleans
        # `site_dir` before it writes, and MkDocs's default `site_dir` is
        # `site`. So deleting one line of `mkdocs.yml` empties the live site,
        # exits 0 and emits no warning under `--strict`. Measured three ways,
        # on throwaway configurations: the line deleted, `site_dir: site`, and
        # a subdirectory config with `site_dir: ../site`.
        #
        # This observes the damage rather than the configuration, which is why
        # it catches the third of those: an assertion on the resolved
        # `site_dir` reads the one config file it is named, and a config file
        # in a subdirectory is one it was never named. It also catches a
        # mechanism nobody has thought of yet — a plugin, a `hooks:` entry, a
        # future emitter — because it asks git what moved and matches no string
        # at all. A gate that matches a string can be satisfied by a corpus
        # that writes the string, which is the blind spot the grep in the step
        # below actually has: two rendered pages quote `rel="describedby"` in
        # their own prose.
        #
        # It cannot fire on a legitimate change. The working tree equals `HEAD`
        # when this job starts, so what it reports is what the steps above it
        # did and never what the pull request carries.
        #
        # Above the step below rather than after it: with `site_dir` moved,
        # `.headwater/site-build` is never created and that step's `cp` fails
        # first, which would end the job with `cp: cannot create regular file`
        # and none of this diagnosis.
        #
        # `.githooks/pre-commit` carries the other half of this, and shares no
        # line with it. This holds the merge; that holds the push, which is
        # what Cloudflare deploys.
        run: |
          moved=$(git status --porcelain -- site/)
          if ! git diff --quiet HEAD -- site/ || [ -n "$moved" ]; then
            echo "the MkDocs build wrote into \`site/\`, which is the deployed site and not a" >&2
            echo "build output. \`mkdocs build\` cleans \`site_dir\` before it writes, and a" >&2
            echo "\`site_dir\` that resolves onto \`site/\` empties it and exits 0. Read the" >&2
            echo "comment above \`site_dir:\` in \`mkdocs.yml\`. What moved:" >&2
            git status --porcelain -- site/ >&2
            exit 1
          fi
      - name: Every rendered page points at the corpus descriptor
        # This blocks, and it catches what the step above cannot see. Measured
        # on a throwaway worktree: with `theme.custom_dir` deleted,
        # `mkdocs build --strict` still exits 0 with zero warnings while every
        # page loses the element. MkDocs has no opinion about a `<link>` that
        # a theme does not emit, so the gate on HW-DR-0038's ruling is this
        # grep and never the build. That is the failure mode #430 records, met
        # a second time. It is a step of its own rather than two more lines on
        # the step above, because this file runs one step per defect and the
        # two defects are independent: a red build means the nav or a page is
        # broken, and a missing pointer means the theme override was dropped.
        #
        # The copy runs after the build, because `mkdocs build` cleans
        # `site_dir` before it writes. `.headwater/corpus.json` sits outside
        # `docs_dir`, so MkDocs copies none of it and no second copy is
        # committed under `docs/`. A copy placed before the build is a silent
        # no-op.
        #
        # The `|| true` is required. GitHub Actions runs `run:` under `bash
        # -e`, `grep -L` exits 1 when it finds nothing, and a failing command
        # substitution in an assignment trips `-e`. So the success case is
        # what would end the job.
        #
        # `404.html` is the one page with no pointer, and that is structural
        # rather than an oversight: MkDocs renders it from the theme's own
        # `404.html`, which extends `base.html` and never reaches `main.html`.
        # A reader who arrived at a 404 reached no corpus to be pointed at.
        run: |
          cp .headwater/corpus.json .headwater/site-build/corpus.json
          missing=$(grep -rL 'rel="describedby"' .headwater/site-build --include='*.html' | grep -v '/404\.html$' || true)
          if [ -n "$missing" ]; then
            echo "pages with no pointer to the corpus descriptor:" >&2
            printf '%s\n' "$missing" >&2
            exit 1
          fi
      - name: Every rendered page carries its own canonical URL
        # This blocks, and it is a step of its own for the same reason the step
        # above is: this file runs one step per defect, and the two defects are
        # independent. The pointer to the corpus descriptor dies when
        # `theme.custom_dir` is dropped. The canonical URL dies when `site_url`
        # is dropped from `mkdocs.yml`, and `mkdocs build --strict` exits 0 with
        # no warning while every one of the 302 pages loses the element.
        # HW-DR-0048 recorded that absence and #556 closed it.
        #
        # It is a tool rather than two more lines of `grep` because the
        # assertion a `grep` can make is the weaker half. A page whose canonical
        # names some other page carries the string `rel="canonical"` and passes
        # a presence test, and a wrong canonical is worse than none: it hands a
        # crawler a confident wrong answer. So the tool compares each page's
        # canonical against the URL that page is served at, which is what
        # catches a wrong origin, a dropped trailing slash and a typo in
        # `site_url`. That is a parser and a URL join rather than a pattern, and
        # a tool can be held by a fixtures suite where an inline `grep` cannot.
        #
        # It reads the generated half and never the assembled root. None of the
        # eight hand-built pages carries a canonical URL, so the presence
        # assertion over the assembled root would be red on correct input from
        # its first run.
        #
        # The population is walked from the built directory, `404.html` is
        # exempt for the structural reason the tool's header states, and an
        # empty population exits 2 rather than passing. The step below provokes
        # each of those.
        run: python3 tools/check-site-canonical.py .headwater/site-build
      - name: The canonical URL checker refuses what it claims to refuse
        # Spec 12 refuses a check that ships with no failing fixture, and
        # `tools/site-fragments-fixtures.sh` is the shape this follows. Two of
        # its cases run over a scratch copy of the real build: one deletes a
        # page's canonical element, the other points it at another URL, and the
        # second is the one a presence grep would pass. It writes only under a
        # temporary directory.
        run: sh tools/site-canonical-fixtures.sh
      - name: The crawler files are what the committed pages say
        # `tools/refresh-crawler-files.sh` derives `site/llms.txt`,
        # `site/robots.txt` and `site/sitemap.xml` from the `<title>`, the
        # `<meta name="description">` and the path of every page committed
        # under `site/`. Nothing in the three is typed by a person, so a page
        # added, removed or retitled makes them stale and nothing said so.
        #
        # The sitemap joined them in #554. The copy #535 committed was a list
        # of seven URLs a person typed, and it already omitted
        # `site/changelog/` on the day it landed — the same failure this step
        # was added to catch, in the one file that was not yet covered.
        #
        # The script's own header records why it was left out of CI: CI was
        # down org-wide, and `wrangler.jsonc` ran no build step between the
        # commit and the served bytes, so a human had to run it by hand. Both
        # of those have stopped being true. This job runs, and HW-DR-0047 puts
        # a build on the deploy path. The discipline that header asks for is
        # held here instead of asked for.
        #
        # Measured rather than supposed: adding `site/changelog/index.html` in
        # #546 staled `llms.txt`, and the only thing that caught it was a
        # person remembering to run the script. `--check` writes nothing and
        # prints a diff of committed against measured.
        run: sh tools/refresh-crawler-files.sh --check
      - name: Every hand-built page carries the same visual register
        # `tools/site-tokens.css` is the one copy of the color tokens and the
        # three type stacks that the hand-built pages share, and HW-DR-0050
        # rules it. Each page carries that block verbatim between its two
        # `headwater:tokens` markers, written by the script and never by hand.
        #
        # A page cannot link the file instead. `site/_headers` gives every
        # hand-built path `default-src 'none'` with `style-src 'unsafe-inline'`
        # and no `'self'`, so a hand-built page fetches nothing at read time —
        # the property HW-DR-0037 states and HW-DR-0039 relies on. So the copy
        # runs before the commit, which is the move HW-DR-0039 already made for
        # a figure on the same pages.
        #
        # Measured rather than supposed: the eight pages each carried their own
        # copy of the six color tokens until this landed, and four of them had
        # drifted to a seventh the other four did not declare.
        #
        # A page under `site/` with no marker pair fails this step too. That is
        # deliberate: a ninth page opting out of the shared register would do it
        # by carrying no marker, and a silent skip is what would let it.
        run: sh tools/refresh-site-tokens.sh --check
      - name: The figures on the hand-built pages came from a run
        # HW-DR-0039 rules that a number on a hand-built page is interpolated
        # from a run of this engine rather than typed by a person, and
        # `tools/refresh-figures.sh` is that build. It writes 34 measured
        # figures into `data-figure` elements, and it holds the 43 verbatim
        # blocks of `site/tutorial/index.html` against the tutorial document
        # that `.claude/tutorial/fixtures.sh` runs.
        #
        # This is the third step that reads `site/`, and it belongs beside the
        # other two and before the assembly, so the composed directory carries
        # figures that already agree with this tree.
        #
        # Measured rather than supposed: HW-DR-0039 recorded that no hook and
        # no job ran this script. Nothing ran it between 2026-08-26 and
        # 2026-09-06, and by then 59 figure occurrences on three pages and 11
        # of the 43 verbatim blocks had gone stale, on a site the deploy was
        # already serving.
        #
        # The pre-commit clause of the same name carries an escape hatch and a
        # `python3` guard that let a commit through. This step carries neither,
        # which is what makes it the half that holds. A figure measured but
        # reaching no page fails it too, for the same reason a page with no
        # marker pair fails the step above: an empty `site/`, a renamed marker
        # or a moved page otherwise passes over a check that ran on nothing.
        run: sh tools/refresh-figures.sh --check
      - name: The two halves of the site compose into one served directory
        # This is the input the deploy serves, and this step is the only place
        # that runs the composition where a person reads the result. The
        # deploy runs the same script — HW-DR-0047 rules that it does — so a
        # break in the assembly is found by this runner, on the push that
        # caused it, rather than by a visitor.
        #
        # `--check` re-asserts what the step above already holds about
        # `site/`: the assembly reads that half and never writes it. Two
        # independent guards on one invariant is deliberate. The #430 step
        # catches `mkdocs build` writing there, and this one catches the
        # assembly writing there, and the two run different code.
        #
        # The spot checks below are paths from each half plus the theme
        # assets and the descriptor, because a composition that silently
        # produced only one half would otherwise exit 0. They are named
        # paths rather than a count: a count moves whenever a shelf gains a
        # document, and a step that has to be re-blessed on ordinary work
        # stops being read.
        #
        # No shelf root is named in that list, because the check after it
        # covers every one of them and derives the names rather than typing
        # them. This step named `spec`, `decisions` and `interfaces` until
        # #528: those were the three shelves that had an index projection,
        # and a step that names the shelves that already work asserts
        # nothing about the seven that did not. The obligations shelf keeps
        # a check of its own shape below, because a served root that lists
        # no record is a different failure from a missing root.
        #
        # THE DERIVED CHECK, AND WHY IT ASSERTS A FILE
        #
        #   `.headwater/corpus.json` names one entry point per shelf that
        #   holds a document, and `.headwater/taxonomy.lock` gives each of
        #   those shelves its directory. Both are committed, and
        #   `headwater generate --check` and `taxonomy resolve --check` hold
        #   each of them current, so an eleventh shelf is covered by the push
        #   that adds it and nobody has to remember this step exists.
        #
        #   It asserts that `<shelf>/index.html` is a file, and never that a
        #   request answers 200. `python3 -m http.server` generates a
        #   directory listing where no `index.html` is, so a local `curl` of
        #   `/obligations/` answered 200 while Cloudflare answered 404. That
        #   difference is the whole reason seven missing shelf roots stayed
        #   invisible until 2026-09-06, and a status code is therefore not
        #   evidence this step will accept.
        run: |
          sh tools/assemble-site.sh --check
          for path in tutorials/your-first-governed-corpus/index.html \
                      css/base.css js/base.js search/search_index.json corpus.json \
                      index.html ns/index.html tutorial/index.html; do
            if [ ! -f ".headwater/site-deploy/$path" ]; then
              echo "the assembled site is missing \`$path\`" >&2
              exit 1
            fi
          done
          if [ -z "$(find .headwater/site-deploy/obligations -name index.html -print -quit)" ]; then
            echo "the assembled site carries no obligation record page" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys, yaml

          deploy = ".headwater/site-deploy"
          shelves = yaml.safe_load(open(".headwater/taxonomy.lock"))["resolved"]["shelves"]
          descriptor = json.load(open(".headwater/corpus.json"))

          roots = set()
          for corpus in descriptor["corpora"]:
              prefix = corpus["root"] + "/"
              for entry in corpus["entry_points"]:
                  pattern = shelves[entry["shelf"]]["path"]
                  if not pattern.startswith(prefix) or not pattern.endswith("/**"):
                      sys.exit(
                          "the shelf `%s` is declared at `%s`, which this step cannot map to a "
                          "served root. Read the comment above it." % (entry["shelf"], pattern)
                      )
                  roots.add(pattern[len(prefix):-3])

          missing = [r for r in sorted(roots) if not os.path.isfile("%s/%s/index.html" % (deploy, r))]
          if missing:
              print("shelf roots that hold a document and serve no index page:", file=sys.stderr)
              for root in missing:
                  print("    /%s/" % root, file=sys.stderr)
              print(
                  "each one needs a `shelf_index` projection in `.headwater/overlay.yml`, or a "
                  "reason recorded there for holding none.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print("%d shelf roots each serve an index page: %s" % (len(roots), ", ".join(sorted(roots))))
          PY
      - name: Every hand-built page carries the narrow content policy
        # `site/_headers` sets the wide policy under `/*`, because a generated
        # page links its stylesheet, its script, its fonts and its search
        # index as files beside it. Each hand-built path then re-asserts the
        # narrow policy that half has always carried, and HW-DR-0037 is the
        # record stating that a hand-built page reaches nothing at read time.
        #
        # A hand-built page with no rule of its own falls through to the wide
        # policy, in silence and with nothing to read. That already happened:
        # #534 wrote the wide default, #546 added `site/changelog/` hours
        # later, and the changelog page has served the wide policy since.
        # Neither pull request was wrong on its own and nothing connected
        # them, which is the shape of defect this repository exists to report.
        #
        # So the list below is derived from the committed pages rather than
        # typed, and a page added tomorrow is covered by the push that adds
        # it.
        run: |
          python3 - <<'PY'
          import os, sys

          pages = []
          for entry in sorted(os.listdir("site")):
              if entry == "index.html":
                  pages.append("/")
              elif os.path.isfile(os.path.join("site", entry, "index.html")):
                  pages.append("/%s/*" % entry)

          declared = {
              line.strip() for line in open("site/_headers") if line.startswith("/")
          }

          missing = [path for path in pages if path not in declared]
          if missing:
              print("hand-built pages with no rule in `site/_headers`:", file=sys.stderr)
              for path in missing:
                  print("    %s" % path, file=sys.stderr)
              print(
                  "each one falls through to the wide policy under `/*`, which exists for "
                  "the generated half. Give it the narrow policy the pages beside it carry.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print("%d hand-built pages each carry a rule: %s" % (len(pages), ", ".join(pages)))
          PY
      - name: Every in-site fragment resolves against the page it is served beside
        # THE INSTRUMENT THAT WOULD HAVE CAUGHT #431 ON THE DAY IT LANDED
        #
        #   335 links pointed at an anchor no built page carried, for three
        #   weeks, under a green build. MkDocs reported every one of them at
        #   `info` and exited 0, and until the generated half was served
        #   nobody could follow one. `validation.anchors: warn` in
        #   `mkdocs.yml` fixes the severity, and the step above would now fail
        #   on the same population.
        #
        #   This step is the second reader, and it is not redundant with that
        #   one. MkDocs validates links between *source documents*. This
        #   parses the *served bytes*: it walks every `.html` file under the
        #   assembled directory, collects the `id` attributes each page
        #   actually carries, and resolves every in-site `href` fragment
        #   against them. That population is larger — 3559 links against 293
        #   pages on the tree that added this step — and it includes the
        #   theme's own table of contents, the generated navigation and the
        #   hand-built half, none of which reaches MkDocs's validator at all.
        #
        #   It runs after the compose step because the assembled directory is
        #   what a visitor is served, and #431 existed precisely because the
        #   only instrument over this read Markdown.
        #
        # It fails on a dead fragment and reports a dead path without failing.
        # The tool's own header states why, and #406 owns the path half.
        # `sh tools/site-fragments-fixtures.sh` provokes every one of those
        # outcomes, including each refusal, and runs in the step below.
        run: python3 tools/check-site-fragments.py
      - name: The fragment checker refuses what it claims to refuse
        # Spec 12 refuses a check that ships with no failing fixture, and
        # `.githooks/fixtures.sh` is the shape this follows: every refusal is
        # provoked on purpose and so is every pass, because a gate that
        # refuses everything is as useless as one that refuses nothing. It
        # writes only under a temporary directory.
        run: sh tools/site-fragments-fixtures.sh
      - name: Every served page loads in a browser with an empty console
        # THE READER THAT RUNS THE PAGE RATHER THAN PARSING IT
        #
        #   Three steps above this one walk the same directory and none of them
        #   runs a line of JavaScript. #532 is what lived in that gap: on 13 of
        #   the served pages the theme's own `js/base.js` threw twice on load,
        #   every specification part a visitor reads first was affected, and
        #   `mkdocs build --strict`, `check-site-fragments.py` and the assembly
        #   check all reported green for as long as it stood.
        #
        #   This serves the assembled directory on a loopback port and loads
        #   every page in headless Chrome. It asserts three things per page and
        #   not one, because an absence-of-errors check goes quiet the moment
        #   its own mechanism breaks: HTTP 200, a probe it injects at serve
        #   time having actually run, and an empty console with `keyCodes`
        #   defined on the pages that load the theme script. The tool's header
        #   states why each bar is there, and the 404s that first read as
        #   passes are recorded in it.
        #
        # THE SKIP, AND WHY IT IS NOISY
        #
        #   Exit 3 means no browser was found, so nothing was loaded. It is a
        #   separate status precisely so that a caller cannot read it as a
        #   pass, and this step turns it into a workflow annotation rather than
        #   a silent green tick. `.claude/hooks/fixtures-live.sh` takes the
        #   same posture toward a harness it cannot install: it skips what is
        #   not there and says so, rather than failing or going quiet.
        #
        #   The verb this repository ships for reaching a model is deliberately
        #   not named on this line. `.claude/skills/fixtures.sh` asserts that
        #   no CI job calls it by grepping this file for its name, and that
        #   grep does not distinguish a comment from a `run:` step — measured,
        #   by writing one here and watching the job fail.
        run: |
          status=0
          python3 tools/check-site-console.py || status=$?
          if [ "$status" = 3 ]; then
            echo "::warning title=Browser console check skipped::No Chrome or Chromium on this runner, so no page was loaded and this step checked nothing. Install one, or set HEADWATER_CHROME."
            exit 0
          fi
          exit "$status"
      - name: The console checker refuses what it claims to refuse
        # Spec 12 refuses a check that ships with no failing fixture, and the
        # reason carries double weight for a check whose verdict is an absence.
        # The suite injects a page that throws, and points the checker at
        # `/bin/true` — which exits 0 and prints nothing, byte for byte what a
        # clean run looks like — to prove the probe is what tells those apart.
        # It writes only under a temporary directory, and it skips with exit 3
        # on a host with no browser for the reason the step above does.
        run: |
          status=0
          sh tools/site-console-fixtures.sh || status=$?
          if [ "$status" = 3 ]; then
            echo "::warning title=Browser console fixtures skipped::No Chrome or Chromium on this runner, so none of these cases ran."
            exit 0
          fi
          exit "$status"
      - name: The identifier claim store conflicts on a collision and merges on a coincidence
        # The store answers "is this number taken" through git rather than
        # through a rule, so the two outcomes it rests on are properties of
        # `git merge` and of `.gitattributes` and nothing in this repository
        # states them. This suite drives two branches from one base over
        # scratch repositories and pins both, provokes the `merge=union`
        # failure on purpose, and refuses an empty claim anywhere in the
        # shipped store. It builds no engine and writes only under a temporary
        # directory.
        run: sh tools/id-store-fixtures.sh
      - name: The run directory refuses a reused id, a short line, a stored total and a second claimant
        # `tools/run-dir.sh` is the ledger of a build-order run: a directory
        # under the git common dir, its tabular parts as JSON lines, and every
        # total derived by the reader and never stored, which is HW-DR-0049
        # applied to a ledger and HW-PD-0005 is why. The tool refuses a
        # second start under one id, a log line missing a key, and a line
        # that carries a total. This suite provokes each refusal, holds the
        # derived total against the lines it wrote, checks that the doctrine
        # a run copies in is the checked-in doctrine byte for byte, and races
        # two claimants for one artifact to hold that exactly one owns it.
        #
        # It needs `jq`, which is a developer dependency and nothing an
        # adopter runs. A runner without it skips with a warning rather than
        # failing, the way the browser console step does. It writes only
        # under a temporary directory.
        run: |
          status=0
          sh tools/run-dir-fixtures.sh || status=$?
          if [ "$status" = 3 ]; then
            echo "::warning title=Run directory fixtures skipped::No jq on this runner, so none of these cases ran."
            exit 0
          fi
          exit "$status"
      - name: The run census counts a turn once per message and a call by what it is for
        # `tools/run-census.sh` is the measurement behind HW-PD-0003 as a
        # tool: one usage record per message id, because a response is
        # written to the log as several lines that each carry the same record,
        # and a Bash call grouped by its leading verb, because the cost that
        # matters was spread over 43 pull requests with no command repeated
        # enough to look like a loop. This suite holds both against a
        # transcript written by hand whose right answer is known. It needs
        # `jq` and skips with a warning without it.
        run: |
          status=0
          sh tools/run-census-fixtures.sh || status=$?
          if [ "$status" = 3 ]; then
            echo "::warning title=Run census fixtures skipped::No jq on this runner, so none of these cases ran."
            exit 0
          fi
          exit "$status"
      - name: The build still declares its license and still refuses to rewrite its lock
        # Two declarations that are green the day they land and green forever.
        # `--locked` on a lock that is in sync changes no exit status, so
        # dropping it from a step, or landing one more copy of the install
        # command without it, costs nothing until the day it costs everything.
        # The license half is self-guarding in the removal direction — deleting
        # the `[workspace.package]` key fails every cargo command with
        # `error inheriting 'license' from workspace root manifest` — and not
        # at all in the direction where a crate added later forgets the member
        # line.
        #
        # This suite enumerates every population from the tree rather than
        # listing it, gives each one a case that fails when the enumeration
        # comes back empty, and provokes every one of its judges against a
        # planted defect so that an empty offender list means something. It
        # builds nothing: its one cargo call is `metadata --no-deps --locked`.
        run: sh tools/build-declaration-fixtures.sh
      - name: The first screen resolves, and says one true thing about its own tag
        # Two properties of the root `README.md`, and NOT its prose. Nothing
        # else here reads that file at all: `docs/` is the corpus root, so no
        # engine rule sees it; `docs_dir: docs`, so `mkdocs build --strict`
        # never sees it; and every `README` named in a workflow, a hook or
        # another script under `tools/` is `engine/README.md` or
        # `docs/interfaces/README.md`.
        #
        # What this step holds is the referential integrity of that page —
        # every relative link and every fragment resolving — together with four
        # claims the page makes about itself: the opening image at 1280 by 640
        # under 1 MB, every GitHub URL naming the owner and repository the
        # remote names, the exclusive or below, and no count of milestones.
        #
        # What it does NOT hold is the prose. A British spelling, a
        # contraction, a hard-wrapped paragraph, a retired term and `headwater`
        # lower case in running prose all pass, because the language regime
        # binds kinds under the corpus root and this file is not a governed
        # document. A second copy of a rule living in a script is what this
        # repository refuses everywhere else, so this suite reimplements none
        # of them.
        #
        # The case it exists for is the exclusive or between the pinned
        # `git checkout` in the paste block and the sentence above the fence
        # that says the tag is not cut. Cutting the tag without deleting that
        # sentence leaves the first screen telling a stranger to omit a line
        # that now works, and every other gate here stays green.
        #
        # It asks the configured remote whether the tag resolves, which is one
        # `git ls-remote` and the only network any fixture suite performs. A
        # remote it cannot read is reported red rather than skipped, because
        # the exclusive or is then undecided and an undecided invariant is not
        # a passing one. Every scratch arm stubs that remote with a local bare
        # repository instead.
        #
        # It also RUNS one command out of the page, which is the one thing no
        # gate here did until then: the page told a newcomer to run a
        # `taxonomy vendor` invocation that always exited 1 and printed the same
        # refusal whether their digest matched or not, and every gate read the
        # page rather than running it. That group needs a built engine and takes
        # the newer of the two profiles. It builds none itself, which is why it
        # sits in this job and after the build step above; a run with no engine
        # is reported red rather than skipped, for the same reason the
        # unreadable remote is. It writes only under a temporary directory, and
        # the arm that succeeds installs a package over a copy of this checkout
        # made there rather than over the checkout.
        run: sh tools/readme-fixtures.sh
      - name: The library index accounts for every bundle, and the vendored copy has not drifted
        # Two properties of `docs/taxonomies/README.md`, and NOT its prose.
        #
        # The first is set equality. The library carried six bundles and the
        # admission table listed five, and the missing one,
        # `evidence-and-obligation`, is required by two of the entries the
        # table does admit and selected by the `headwater/starter` recipe. So
        # a composer reading the index was made to select a bundle the index
        # gave no name, no link and no reason for. Nothing reported it: the
        # lock names no `README.md`, no rule of the engine reads a table, and
        # `taxonomy resolve --check` and `headwater check --strict` both exit
        # 0 over the omission. This step reads the bundles out of
        # `contents.bundles` and the accounted-for entries out of the section,
        # and compares the two sets in both directions. It writes down no
        # count of either, because the ordinal narrative the same section used
        # to carry was a count in disguise and it went stale the same way.
        #
        # The second is that `docs/taxonomies/README.md` and
        # `packages/headwater-standard/bundles/README.md` are byte-identical,
        # along with every doctrine and template the anatomy table declares as
        # carried. Measured on 2026-09-07: one line appended to either copy
        # alone leaves `taxonomy resolve --check` and `headwater check
        # --strict` at exit 0 with a byte-identical report, because the lock
        # names neither file and the release digest is compared only at
        # `vendor` time. The authored page and the page a consumer receives
        # could disagree indefinitely with every other gate green.
        #
        # It holds no reading of the seven admission criteria, and it holds
        # none of the prose. That page classifies to no kind, so no language
        # rule reads it, and a second copy of a rule living in a script is
        # what this repository refuses everywhere else.
        #
        # It runs `awk`, `sed` and `cmp`, builds no engine, opens no socket,
        # and writes only under a temporary directory.
        run: sh tools/library-index-fixtures.sh
      - name: The command an outsider runs still runs
        # `engine/README.md` carries two `docker run` recipes, and on 2026-09-07
        # both exited 101 before compiling a line: `ordered-float 5.5.0` had
        # entered `engine/Cargo.lock` on 2026-08-26 declaring `rust-version =
        # "1.90"`, and both recipes pinned a 1.85 image. They were dead for
        # twelve days and a hundred and eleven commits, this repository went
        # public with them dead, and a change on the day it went public edited
        # both of them without running either.
        #
        # Nothing could have noticed. The floor was prose in a Markdown file and
        # a string in an image tag, and no crate of this workspace declared
        # `rust-version`, so a routine `cargo update` could raise the real floor
        # above the pinned image with every gate here green.
        #
        # The case this step exists for compares the highest `rust-version`
        # across `cargo metadata --locked` against the tag those recipes pin. It
        # runs no container and builds nothing, which is the whole reason it can
        # be a required step: the container itself is minutes of cold compile
        # for a floor this reading establishes in milliseconds.
        #
        # It also holds the four things those recipes explain at length and
        # nothing else reads — the `--user` on the test half and root on the
        # other, the `git rev-parse --show-toplevel` mount, the two blocks that
        # a blank line alone would render as one `<pre>`, and the absence of
        # `-D warnings` — and it holds the nine files that state the floor to
        # one another. `--locked` on those recipes belongs to
        # `tools/build-declaration-fixtures.sh` and is not read twice here.
        run: sh tools/engine-readme-fixtures.sh
      - name: The contributor loop still lists what this job runs
        # `DEVELOPING.md` is the contributor loop, and one section of it is a
        # copy of this file: the list of what CI runs. A hand-kept list of that
        # kind goes stale with no exit status moving, and the measurement is on
        # record — the best hand-written one this repository produced named 8
        # script invocations on 2026-09-06, on a day this workflow ran 15.
        #
        # This step derives the population from every `run:` value of this file
        # — scripts that are executed, cargo commands, and engine verbs — and
        # compares it against the page in both directions, so a gate added here
        # without a line on the page fails the day it lands, and a gate the page
        # names that no job runs fails too. It is the second `run:` walk under
        # `tools/`; the header of the script says why it is not shared with
        # `tools/build-declaration-fixtures.sh`.
        #
        # This step is therefore a member of its own population, and the page
        # names it. It builds nothing, runs no container and opens no socket.
        run: sh tools/developing-fixtures.sh
      - name: Every declared export profile is what this corpus produces
        # `export_plan()` is a separate code path from `plan()`: it re-filters
        # the declared projections by `--profile` rather than writing every
        # one of them, so the step above never exercises it. A declaration
        # with no filter, like the `graph_export` entry this corpus carries,
        # takes the same path a narrower profile would, and this step is what
        # holds that path to a committed, current file rather than trusting
        # the step above to cover it by coincidence.
        run: ./engine/target/release/headwater export --check
      - name: This repository is at the rung it claims
        # `headwater conformance` measures the adoption rather than the corpus,
        # and with no flag it exits 0 whatever it finds. `--level L0` is the one
        # thing that moves its status, and this step is where this repository
        # submits to its own rule set.
        #
        # It blocks, and until #336 it blocked on a state that was waived rather
        # than met: `pin.current` was a gap, because this repository consumed
        # the package it publishes from source under `packages/`, which carried
        # no release record. #336 moved the authored source to
        # `taxonomy-source/headwater-standard/` and vendored a real artifact
        # into `packages/headwater-standard/` in its place, so `pin.current` is
        # met against a real digest now and the waiver this comment used to
        # describe is gone from `.headwater/taxonomy.yml`.
        #
        # The level the report states is a measurement and not a claim this
        # step can move by itself: `--level L0` only fails the job when a rule
        # under it is neither met nor waived. With `pin.current` met on its own
        # terms, this step now blocks on `lock.current` alone, and a future
        # regression that reopened the gap without a waiver would fail here
        # rather than pass silently.
        #
        # It needs no `--now`. Nothing this step reads takes a clock any more,
        # now that no waiver expiry is in play, and it sits above the line that
        # fixes a date for the three runs after it, which share one value for a
        # different reason.
        run: ./engine/target/release/headwater conformance --level L0
      - name: The date this job evaluates at
        # A windowed participation expectation compares a declared origin date
        # against `ctx.now`, so the clock is an input to the verdict and the
        # three runs below have to share one value of it. Read once here rather
        # than three times: a job that started before midnight UTC and finished
        # after it would otherwise fail the comparison at the end for a reason
        # that has nothing to do with the cache.
        run: echo "HEADWATER_NOW=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: The change this pull request carries
        # The reading that this repository has never taken. Two rules declare
        # `needs_prior`, and an instance of one reaches no verdict in a run that
        # carries no change: 382 of 3498 instances report `change-scoped-only`
        # on a full-corpus run, which every step above is.
        #
        # The anchor is the base of the pull request, which is what spec 12
        # fixes for a proposed change. `.githooks/pre-commit` passes `HEAD`
        # instead, which is the other anchor that sentence names, so the commit
        # gate and this step ask the same rules two different questions.
        #
        # Advisory, like the check above it and for the same reason. What
        # `warrant.promoted` produces is a count, and
        # [HW-OBL-0119](../../docs/obligations/0119-an-audit-reading-carries-no-declared-bar-so-a-distribution-cannot-become-a-finding.md)
        # records that nothing declares a bar for one. The count goes into the
        # job summary, so it has a reader rather than a file nobody opens. The
        # movement half is not advisory here by choice: it is the commit gate
        # that blocks on it, and a pull request whose commits went through that
        # gate has already answered it.
        #
        # Only on a pull request. A push to `main` has no proposed change to be
        # the base of, and the changes in it were each described at the commit.
        #
        # Its position is part of its correctness. The producer names every file
        # the index does not track, because an author's new document is one of
        # those and a document that reached the engine as unchanged is the
        # reading this path exists to avoid. Every step below writes a report
        # into the workspace, and each one would then be named as a file this
        # pull request adds.
        # `--format markdown`, which is the adapter a job summary is for. Until
        # #230 this step pasted the whole text report into a fenced block,
        # because the block that states what a run was told about was written by
        # `text` and by none of the other three. All four write it now.
        #
        # The findings in it are the findings of the step below, because a
        # change-scoped run reads the same corpus and narrows nothing. The
        # difference is the block, and the block is the reason this step exists,
        # so the report goes inside a `details` element and the step below keeps
        # the summary a reviewer reads first.
        #
        # A producer that refuses fails this step. It is not a finding about the
        # corpus: it says the change could not be described, and a step that
        # went green on that would report a promotion count of zero over a
        # reading nobody took, which is the whole shape this exists to close.
        if: github.event_name == 'pull_request'
        run: |
          manifest=$(sh .githooks/change-manifest "${{ github.event.pull_request.base.sha }}" "$RUNNER_TEMP/change")
          ./engine/target/release/headwater check --no-cache --now "$HEADWATER_NOW" \
            --change "$manifest" --format markdown > change.md
          # Onto the step log as well as into the summary. A step that writes
          # only into a file reads as a step that did nothing, and the two lines
          # this prints are the two numbers the reading is for.
          grep -E '^\*\*Scoped to a change\.\*\*|promoted from' change.md
          {
            echo '## The change this pull request carries'
            echo
            echo '<details><summary>the run, scoped to the change</summary>'
            echo
            cat change.md
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check this corpus
        # No `--strict`. Advisory, on purpose: a tool that blocks on first
        # contact is removed, and a removed tool catches nothing.
        #
        # This is the run that is read. It reads no cache, so the report in the
        # summary is what the checks decided over this tree and never what a
        # disk remembered.
        run: ./engine/target/release/headwater check --no-cache --now "$HEADWATER_NOW" | tee headwater-check.txt
      - name: The job summary, from the adapter that writes one
        # `--format markdown` is the adapter. Until it existed this step pasted
        # the whole text report into a fenced block, which privileges no forge
        # and also translates nothing: a reviewer wants the counts, the escaped
        # findings marked as escaped, and a path they can click.
        #
        # It is a second run rather than a second rendering of the first,
        # because the verb writes one format to standard output. Same tree, same
        # lock, same injected clock, so the two agree by the same determinism
        # that the cache step below tests.
        run: ./engine/target/release/headwater check --no-cache --now "$HEADWATER_NOW" --format markdown >> "$GITHUB_STEP_SUMMARY"
      - name: The SARIF this corpus emits is SARIF
        # The suite in the job above validates the emitter over a fixture tree.
        # This validates it over the corpus an adopter would point it at, which
        # is the one that carries every kind of finding this repository can
        # raise. Same schema and same reader, so a divergence between the two
        # runs is a fact about the corpus rather than about the validator.
        #
        # It blocks. An invalid artifact is not a finding about prose somebody
        # wrote: it is an emitter defect, and a forge that rejects the upload
        # reports nothing at all.
        run: |
          python3 -m pip install --user --break-system-packages jsonschema
          ./engine/target/release/headwater check --no-cache --now "$HEADWATER_NOW" --format sarif > headwater.sarif
          python3 engine/crates/adapter/tests/sarif_oracle.py \
            engine/crates/adapter/tests/sarif-schema-2.1.0.json headwater.sarif > oracle.txt
          head -1 oracle.txt | grep -qx "$(printf 'schema\tvalid')" || { cat oracle.txt; exit 1; }
      - name: The cache cannot change a verdict
        # Spec 12 makes the cache a correctness root, and the standing test is
        # that `headwater check --no-cache` and `headwater check` write the
        # same bytes. `cargo test` runs that comparison over the library in the
        # job above. This runs it over the verb, because the verb is what an
        # author runs, and the flag is the half a library test cannot reach.
        #
        # Twice, because a cold cache and a warm one are different paths: the
        # first invocation stores every verdict and the second serves them.
        #
        # It blocks, and it is not a second posture on the corpus. A difference
        # here is a defect in the engine, and the report above is what the
        # advisory step reports whatever this one finds.
        #
        # Every format, not only the text one. A format is a rendering of one
        # run, so a cache that changed a verdict would change all four, and one
        # that changed only the SARIF would be a defect in the adapter. Both are
        # things this catches and neither is something the text comparison
        # alone would.
        run: |
          ./engine/target/release/headwater check --now "$HEADWATER_NOW" > cold.txt
          ./engine/target/release/headwater check --now "$HEADWATER_NOW" > warm.txt
          diff headwater-check.txt cold.txt
          diff headwater-check.txt warm.txt
          for format in json sarif markdown; do
            ./engine/target/release/headwater check --no-cache --now "$HEADWATER_NOW" --format "$format" > "none.$format"
            ./engine/target/release/headwater check --now "$HEADWATER_NOW" --format "$format" > "warm.$format"
            diff "none.$format" "warm.$format"
          done
      - name: The harness hooks refuse what they claim to refuse
        # The hooks in `.claude/hooks/` sit outside the corpus root, so no check
        # reads them and `cargo test` never sees them. This step is what holds
        # them. It drives all four registered positions through the same
        # standard input the harness writes, and every refusal in it is provoked
        # on purpose: a hook that has refused nothing is a hook nobody has seen
        # work.
        #
        # It blocks. A hook binds nothing inside a session, and that is exactly
        # why a broken one stays invisible until someone reads a diff that a
        # refusal should have stopped.
        #
        # Last but one, because it plants one document under `docs/obligations/`
        # to make the review hook refuse, and removes it again. Every step above
        # reads the corpus, and none of them may see it.
        run: sh .claude/hooks/fixtures.sh
      - name: The skills say what this engine does
        # `.claude/skills/` and `.claude/agents/` sit outside the corpus root
        # too, and a skill is prose that nothing makes a model follow. What a
        # suite holds is the half that is a claim about this engine: a verb a
        # skill tells an agent to run, a refusal a skill says the verb makes, a
        # rule a skill names, a path a skill cites.
        #
        # Half the cases are derived from the skill files rather than listed, so
        # a skill added tomorrow reaches them with no edit to the runner.
        #
        # It blocks. A skill that describes an engine that moved under it is
        # worse than no skill, because an agent that follows it produces a
        # confident wrong answer, and nothing else reports the drift.
        #
        # It writes only into a scratch copy of the corpus under the temporary
        # directory, so it may run after the step above with nothing between.
        run: sh .claude/skills/fixtures.sh
      - name: The build-order agents resolve, cite what exists, and hold their ceilings
        # `.claude/commands/next-run.md` dispatches five agent definitions by
        # `subagent_type`, each names the skills it invokes, and all of them
        # cite rulings by identifier. A name that stops resolving fails
        # silently: an unknown `subagent_type` falls back to a general agent
        # with none of the definition's instructions. The suite also holds the
        # byte ceilings on `CLAUDE.md`, the command and the doctrine, because
        # the parent's context is the unit of cost, and it holds the doctrine
        # block in the command byte-identical to `.claude/run/doctrine.md`.
        #
        # It blocks, it needs no engine, and it writes only under the
        # temporary directory.
        run: sh .claude/agents/fixtures.sh
      - name: The tutorial says what a reader will see, and this sees it
        # `docs/tutorials/your-first-governed-corpus.md` states, after every one
        # of its sixteen steps, what the reader should now see. Each of those is
        # a claim about this engine, copied into prose, and prose does not
        # re-derive. This step is the verb that produces them: it reads the
        # commands out of the document, runs them against a scratch repository,
        # and diffs each result against the block the document prints.
        #
        # It blocks. A newcomer who follows a page that no longer matches the
        # engine concludes that the tool is broken rather than the page, and the
        # on-ramp is the one document with no earlier document to fall back to.
        #
        # It writes nothing inside the checkout: the scratch repository is a
        # temporary directory, `HOME` is redirected into it, and it is removed
        # at the end.
        run: sh .claude/tutorial/fixtures.sh
