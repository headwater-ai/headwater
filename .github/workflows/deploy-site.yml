# SPDX-License-Identifier: Apache-2.0
#
# The one deploy of https://headwater.tools/. It has no trigger of its own:
# two workflows call it, and they share its job, its script and its
# concurrency group.
#
#   - `ci.yml`, on a push to `main`, after both gating jobs of that push.
#   - `release.yml`, after its `publish` job has created the release, with
#     `ref: main`. `tools/site/fetch-apt.sh` copies the APT repository out of
#     `releases/latest`, so the deploy of the version-bump push serves the
#     previous release, and this second call is what puts the new one under
#     `apt/` (#1316). It is a call and not an `on: release` workflow, because
#     `publish` creates the release with `GITHUB_TOKEN`, and GitHub starts no
#     workflow from an event that token caused.
#
# `tools/repo/release-guide-fixtures.sh` holds both callers and that no other
# workflow deploys. The reasons live in the record this file cites, which
# governs it:
#
#   HW-DR-0097  a CI job measures the figures and deploys with `wrangler`
name: Deploy the site

on:
  workflow_call:
    inputs:
      ref:
        # The tree to deploy. Empty deploys the caller's commit. Inside a
        # called workflow `github.ref` is the caller's ref, so a caller that
        # runs on a tag passes `main`, or the site rolls back to the tag.
        description: The ref to check out and deploy
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    # It is not a required check, and a failure here turns this job red and
    # nothing else. `tools/site/deploy-site.sh` renders, assembles, measures
    # the figures into the assembled pages, adds the APT repository and calls
    # `wrangler deploy`, under `set -eu`, so a step that fails publishes
    # nothing and the live site goes on serving the last good deploy.
    name: Deploy the site
    runs-on: ubuntu-latest
    # Deploys run in the order they started, and none cancels another, so the
    # last deploy is the newest one. The group is repository-wide, so the
    # call from `ci.yml` and the call from `release.yml` share one queue.
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    steps:
      - name: The two Cloudflare secrets are set
        # Until the owner sets both secrets this job fails here, alone, with one
        # line that names what is missing. Each caller passes them with
        # `secrets: inherit`.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The site is not deployed: set both repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (gh secret set CLOUDFLARE_API_TOKEN; gh secret set CLOUDFLARE_ACCOUNT_ID)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: The cargo cache
        # The `headwater` job's key in `ci.yml`, because this job builds the
        # same release binary and a warm cache from that job saves the whole
        # compile.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
          key: cargo-${{ runner.os }}-headwater-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-headwater-
      - name: The toolchain this build needs
        run: |
          rustup update --no-self-update stable
          rustup default stable
      - name: Build the engine
        run: cargo build --release -p headwater-cli --locked
        working-directory: engine
      - name: The site toolchain
        # The pins of the `headwater` job's site step in `ci.yml`, for the
        # reasons written there.
        run: |
          python3 -m pip install --user --break-system-packages \
            mkdocs==1.6.1 pymdown-extensions==10.11.2 PyYAML
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: sh tools/site/deploy-site.sh
