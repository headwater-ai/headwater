#
# The consumer declaration for the n8n review-rules corpus. It is not read from
# here: `headwater check` reads one corpus root, and this tree sits inside a
# directory that this repository excludes from its own corpus. `README.md`
# beside this directory states the commands that assemble a scratch root out of
# this file, `overlay.yml`, `packages/headwater-standard/` and `corpus/.agents/`.
#
# `corpus.root` is `.agents` and not `docs` or `packages`. n8n keeps the rules
# its AI reviewer enforces in a leading-dot directory beside the code, and the
# census walker uses a plain directory read with no hidden-directory filter, so
# a leading-dot root walks like any other.
#
# This is a second corpus of the same repository at the same pin, and not an
# extension of the design-spec one. `corpus.root` is a single scalar, so one
# root cannot reach both `packages/` and `.agents/`. Two roots are two corpora.

taxonomy:
  package: headwater/standard
  version: 4.3.1
  bundles: [standards-spec]
  overlay: .headwater/overlay.yml

# No exclusion, and the absence is the finding. The design-spec fixture beside
# this one was forced into `exclude: packages/headwater-standard/**` because a
# taxonomy package is found under `packages/` and n8n's architecture prose lives
# under `packages/` too. With `root: .agents` the vendored package sits outside
# the corpus root entirely, so the exclusion was a property of where that kind's
# prose lives rather than of a scattered corpus.
corpus:
  root: .agents
