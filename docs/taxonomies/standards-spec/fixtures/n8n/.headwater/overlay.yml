#
# The overlay the n8n review-rules corpus needs, and it is two operations.
#
# The standards-spec entry declares one shelf for `kinds.standard`, `standards`
# at `docs/standards/**`. No file of this corpus is under `docs/`, so the entry
# as it ships claims none of them. The shelf below is what a corpus that keeps
# its standards beside the code costs.
#
# The shelf is homogeneous, and that is the contrast with the design-spec
# fixture beside this one. `kinds.design_spec` requires the facet `doc_type`, so
# a homogeneous shelf refuses it under `shelf.placement_is_primary` and a
# heterogeneous shelf with one admitted kind is the only shape that resolves.
# `kinds.standard` requires no facet and forbids `spec_layer`, so placement
# types the document and the front matter restates nothing.
#
# A shelf pattern is matched against paths that carry the corpus root segment,
# so the pattern below repeats `.agents` even though `.agents` is the root.

add:

  # Four namespaces, and only the first one is used. The entry ships three
  # schemes without a namespace, on the argument the base gives: a bundle ships
  # to adopters, and a constant written into it would be minted by all of them
  # at once. `taxonomy validate` refuses a resolved scheme that carries none,
  # and it refuses every scheme of the closure rather than the schemes the
  # corpus mints under, so a corpus of standards alone still declares a
  # namespace for the two specification rungs it holds no document of and for
  # the base's `decision_id`. The design-spec fixture beside this one paid the
  # same cost once. Here it is four lines for one live scheme.
  #
  # `standard_id` is the live one, and unlike the design-spec fixture, where the
  # entry mints no scheme for any of its five kinds, every typed document here
  # carries an `N8N-STD-{slug}` identifier and can stand at either end of a
  # relation.
  identifier_schemes.standard_id.namespace: N8N
  identifier_schemes.functional_spec_id.namespace: N8N
  identifier_schemes.technical_spec_id.namespace: N8N
  identifier_schemes.decision_id.namespace: N8N

  shelves.review_rules:
    path: .agents/review-rules/**
    homogeneous: true
    kind: standard
