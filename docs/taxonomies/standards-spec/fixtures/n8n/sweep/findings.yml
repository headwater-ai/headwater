#
# What a model wrote back after reading all 24 documents of n8n's review-rules
# corpus at the pin: the 22 rule files, the README that files them, and
# `cubic.yaml`, which asserts the three-level reach model and which no finding
# below may name, because it is not a classified document of this corpus.
#
# `briefing.md` beside this file is what `headwater sweep plan` printed, and
# `report.txt` is what `headwater sweep report` made of this file. Nothing here
# is a verdict. Every judgment is the model's and every quotation is the
# engine's to confirm.

taxonomy: sha256:284f896b921745a85dc2f756d6b263b9c8f63f52de7bc67ab53e6c3a92d326ed
slice: .agents/review-rules
findings:

  # The organizing term of the corpus, defined outside every document that uses
  # it. `cubic.yaml` holds the definition and cannot be named here.
  - class: undefined_concept
    documents:
      - .agents/review-rules/README.md
    evidence:
      - path: .agents/review-rules/README.md
        quote: >-
          Pick the level of reach first.
    message: >-
      The first instruction to an author of a new rule is to pick a level of reach, and no
      document of this slice says what the levels are or how to tell them apart.

  # The policy the README forbids at two levels, stated at two levels.
  - class: undeclared_conflict
    documents:
      - .agents/review-rules/README.md
      - .agents/review-rules/testing/coverage.md
      - .agents/review-rules/db-migrations/conventions-and-tests.md
    evidence:
      - path: .agents/review-rules/README.md
        quote: >-
          A directory maps to one agent unless, like `testing/`, the policy is identical
          across domains — then it is one file listed in several agents' `file_paths`,
          never a copy per directory.
      - path: .agents/review-rules/testing/coverage.md
        quote: >-
          Flag new behaviour that ships with no test
      - path: .agents/review-rules/db-migrations/conventions-and-tests.md
        quote: >-
          A data migration needs an integration test. Reading cannot verify its assumptions
          about row shape, JSON and NULLs. Say so when there is none.
    message: >-
      The README rules that a policy identical across domains is one shared file and never a
      copy per directory, and a policy that flags untested new behavior is stated once in the
      shared file and again in one directory's own file.
    proposal:
      relation: conflicts_with
      from: N8N-STD-coverage
      to: N8N-STD-conventions-and-tests

  # The exception list the corpus outgrew, inside one document.
  - class: quiet_supersession
    documents:
      - .agents/review-rules/README.md
    evidence:
      - path: .agents/review-rules/README.md
        quote: >-
          | `testing/` | Backend + Frontend | any package with a test suite |
      - path: .agents/review-rules/README.md
        quote: >-
          Security and QA & DX deliberately don't link `testing/`: coverage nagging on a
          credential fix or a Dockerfile is noise those agents shouldn't be able to produce.
    message: >-
      The Layout table above names a `db-migrations/` agent and maps the shared coverage rule
      to Backend and Frontend alone, so three agents decline it, and the prose two paragraphs
      below still names two and gives a reason that does not cover a migration.
