#
# The overlay the n8n skills corpus needs, and it is two operations.
#
# The diataxis-site entry declares four shelves, all under `docs/`. No file of
# this corpus is under `docs/`, so the entry as it ships claims none of them.
# The shelf below is what a corpus that keeps its procedures beside the code
# costs. A shelf pattern is matched against paths that carry the corpus root
# segment, so the pattern repeats `.agents` even though `.agents` is the root.
#
# The shelf is homogeneous and carries `how_to`. The whole tree is one shelf
# because that is what the corpus asserts about itself: `AGENTS.md` states that
# `.agents/skills/<name>/SKILL.md` is the shared form and every other file under
# a skill directory is that skill's own reference. Typing the reference files as
# `reference` would split one skill across two shelves and two identifiers, and
# the corpus declares no discriminator that could do the split.

add:

  # Five namespaces, and only the first one is used. `taxonomy validate` refuses
  # a resolved scheme that carries none, and it refuses every scheme of the
  # closure rather than the schemes the corpus mints under, so a corpus of
  # how-to guides alone still declares a namespace for the three Diataxis kinds
  # it holds no document of and for the base's `decision_id`.
  identifier_schemes.how_to_id.namespace: N8N
  identifier_schemes.tutorial_id.namespace: N8N
  identifier_schemes.reference_id.namespace: N8N
  identifier_schemes.explanation_id.namespace: N8N
  identifier_schemes.decision_id.namespace: N8N

  shelves.skills:
    path: .agents/skills/**
    homogeneous: true
    kind: how_to
