# SPDX-License-Identifier: Apache-2.0
#
# The design-spec taxonomy: the numbered specification series that IETF RFCs,
# academic papers and software design documents converge on.
#
# An add-only overlay over the base package. Every operation below is an `add`
# at a key that headwater/standard does not declare. doctrine.md states what the
# tradition is, why each declaration is here, and what this draft assumed where
# the specification is silent.

bundle: design-spec
extends: headwater/standard@1.0.0
requires: []

add:

  # --- purposes -------------------------------------------------------------
  # The base declares rationale and behavior. The tradition serves two more
  # reader intents, and each one has a kind below that serves it.

  purposes.evidence:
    intent: state what was measured or found, and under which instrument
    answers:
      - "what closed this question"
      - "what did the review find"
      - "what evidence stands behind this claim"

  purposes.obligation:
    intent: state what the corpus still owes, and who owes it
    answers:
      - "what is missing"
      - "which claim is unmeasured"
      - "what waits on whom"

  # --- regimes --------------------------------------------------------------
  # Evidence documents are time-bound by nature, so they are exempt from the
  # declarative regime that the base declares (spec 3, Voice).

  regimes.voice.narrative: {}

  # --- facets ---------------------------------------------------------------
  # Both facets are required by the kinds that need them rather than globally,
  # because a homogeneous shelf forbids the discriminator (spec 2, Placement is
  # primary).

  facets.doc_type:
    values: [design_spec, decision_register, obligation_register, review_prompt, review_record]
    required: false
    volatility: stable
    guidance:
      design_spec: a numbered document in the series, which states what the system is
      decision_register: the one document that records settled decisions and the argument that settled each
      obligation_register: the one document that records what the corpus still owes
      review_prompt: the instrument that commissions a review, committed before the review runs
      review_record: the findings that one application of one instrument produced

  facets.sequence:
    type: integer
    required: false
    volatility: stable

  # --- kinds ----------------------------------------------------------------
  # Every kind inherits the four core-bearing facets and the base relations
  # from governed_document, which is what keeps this bundle add-only.

  kinds.design_spec:
    is_a: governed_document
    purpose: behavior
    voice: declarative
    lifecycle: standard
    facets:
      require: [doc_type, sequence]

  kinds.decision_register:
    is_a: governed_document
    purpose: rationale
    voice: declarative
    lifecycle: standard
    facets:
      require: [doc_type, sequence]

  kinds.obligation_register:
    is_a: governed_document
    purpose: obligation
    voice: declarative
    lifecycle: standard
    facets:
      require: [doc_type, sequence]

  kinds.evaluation:
    is_a: governed_document
    purpose: evidence
    voice: narrative
    lifecycle: standard
    facets:
      forbid: [doc_type]        # its shelf is homogeneous, so placement states the kind
    relations:
      expect:
        - id: evidence-cited
          relation: cited_by
          to_kind: decision_register
          when: {status: current}
          within: 30d
          since: state_entered
          severity: warn
          rationale: an evaluation that no register cites closed nothing

  kinds.review_prompt:
    is_a: governed_document
    purpose: evidence
    voice: declarative
    lifecycle: standard
    facets:
      require: [doc_type]
    relations:
      expect:
        - id: instrument-applied
          relation: applied_in
          to_kind: review_record
          when: {status: current}
          within: 90d
          since: state_entered
          severity: warn
          rationale: an instrument that nobody applied is a plan rather than a review

  kinds.review_record:
    is_a: governed_document
    purpose: evidence
    voice: narrative
    lifecycle: standard
    facets:
      require: [doc_type]

  # --- relations ------------------------------------------------------------
  # No relation here is created_by author. Each one has a mechanical proposer,
  # and doctrine.md names it.

  relations.cites_evidence:
    family: evidence
    from: [design_spec, decision_register, obligation_register]
    to:   [evaluation]
    inverse: cited_by
    reciprocal: required
    cardinality: many
    created_by: hook

  relations.applied_in:
    family: evidence
    from: [review_prompt]
    to:   [review_record]
    inverse: applies
    reciprocal: required
    created_by: scaffold

  relations.assesses:
    family: evidence
    from: [review_record]
    to:   [governed_document]
    cardinality: many
    created_by: scaffold

  # --- shelves --------------------------------------------------------------

  shelves.spec_series:
    path: docs/spec/**
    homogeneous: false
    discriminator: doc_type
    kinds: [design_spec, decision_register, obligation_register]
    layout: "{sequence:02d}-{slug}.md"

  shelves.evaluations:
    path: docs/evaluations/**
    homogeneous: true
    kind: evaluation

  shelves.reviews:
    path: docs/reviews/**
    homogeneous: false
    discriminator: doc_type
    kinds: [review_prompt, review_record]
