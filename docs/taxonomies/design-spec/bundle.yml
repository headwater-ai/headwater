# SPDX-License-Identifier: Apache-2.0
#
# The design-spec taxonomy: the specification series that IETF RFCs, academic
# papers and software design documents converge on. From 5.0.0 a part of the
# series is named by its slug and carries no number (HW-DR-0117).
#
# An add-only overlay over the base package. Every operation below is an `add`
# at a key that headwater/standard does not declare. doctrine.md states what the
# tradition is, why each declaration is here, and what this draft assumed where
# the specification is silent.
#
# HW-DR-0044 moved `evaluation`, and the `evidence`/`obligation` purposes it
# shares with what stayed here, into a new `evidence-and-obligation` entry.
# `obligation_register`, `review_prompt` and `review_record` stayed: each
# needed `doc_type`, which stays here too, and moving them would have needed a
# `requires` edge back onto the entry that now requires this one. doctrine.md
# carries the finding.

bundle: design-spec
extends: headwater/standard@1.0.0
requires: [evidence-and-obligation]

add:

  # --- facets ---------------------------------------------------------------
  # The facet is required by the kinds that need it rather than globally,
  # because a homogeneous shelf forbids the discriminator (the taxonomy model,
  # docs/spec/taxonomy-model.md, Placement is primary).
  #
  # 5.0.0 deletes `facets.sequence`. It was an integer that the shelf layout
  # `{sequence:02d}-{slug}.md` read at birth and that no rule read after it, so
  # two parts could take one value and nothing said so (HW-OBL-0175).
  # HW-DR-0117 records the removal, and `migrations/4-to-5.yml` in the package
  # names an adopter's overlay entry under the key.

  facets.doc_type:
    values: [design_spec, decision_register, obligation_register, review_prompt, review_record]
    required: false
    volatility: stable
    guidance:
      design_spec: a part of the series, which states what the system is
      decision_register: the one document that records settled decisions and the argument that settled each
      obligation_register: the one document that records what the corpus still owes
      review_prompt: the instrument that commissions a review, committed before the review runs
      review_record: the findings that one application of one instrument produced

  # --- kinds ----------------------------------------------------------------
  # Every kind inherits the five core-bearing facets and the base relations
  # from governed_document, which is what keeps this bundle add-only.
  #
  # Every kind here requires `title`, which headwater/standard declares in the
  # `name` role from 4.0.0. A series is the tradition that most needs it: a
  # rendered list of parts that reads the identifier reads
  # `HW-SPEC-vision-and-scope` where "Vision and scope" belongs (#123, #427).
  # The facet stood in the decision-record entry until 4.0.0 and could not
  # reach here, and that entry's doctrine carried the reason as its finding 4.
  #
  # From 5.0.0 the title also names the file, because the shelf layout is
  # `{slug}.md`, and the templates open the body with `# {{title}}`. A part
  # that was born under 4.x keeps its numbered name and its first heading, and
  # no rule reads either.

  kinds.design_spec:
    is_a: governed_document
    purpose: behavior
    write_when: a change to the design moved what one part of the specification series states
    voice: declarative
    lifecycle: standard
    facets:
      require: [doc_type, title]

  kinds.decision_register:
    is_a: governed_document
    purpose: rationale
    write_when: the specification series made a choice, and its register of decisions does not list it
    voice: declarative
    lifecycle: standard
    facets:
      require: [doc_type, title]

  kinds.obligation_register:
    is_a: governed_document
    purpose: obligation
    write_when: the specification series owes something, and its register of obligations does not list it
    voice: declarative
    lifecycle: standard
    facets:
      require: [doc_type, title]

  # `evaluation` moved to evidence-and-obligation with HW-DR-0044.
  # `cites_evidence` below still names it, and this bundle now requires the
  # entry that owns it.

  kinds.review_prompt:
    is_a: governed_document
    purpose: evidence
    write_when: a review of the corpus is about to run, and the instructions that the reviewer follows must be kept
    voice: declarative
    lifecycle: standard
    facets:
      require: [doc_type, title]
    relations:
      expect:
        - id: instrument-applied
          relation: applied_in
          to_kind: review_record
          when: {status: current}
          within: 90d
          since: state_entered
          severity: warn
          rationale: an instrument that nobody applied is a plan rather than a review

  kinds.review_record:
    is_a: governed_document
    purpose: evidence
    write_when: a review ran, and a later reader needs what it found as evidence
    voice: narrative
    lifecycle: standard
    facets:
      require: [doc_type, title]

  # --- relations ------------------------------------------------------------
  # cites_evidence and builds_on are created_by author: a person types the line
  # and no agent or verb proposes it. applied_in and assesses have a mechanical
  # proposer, the review scaffold, and doctrine.md names it.

  relations.cites_evidence:
    family: evidence
    from: [design_spec, decision_register, obligation_register]
    to:   [evaluation]
    inverse: cited_by
    reciprocal: required
    cardinality: many
    created_by: author

  relations.applied_in:
    family: evidence
    from: [review_prompt]
    to:   [review_record]
    inverse: applies
    reciprocal: required
    created_by: scaffold

  relations.assesses:
    family: evidence
    from: [review_record]
    to:   [governed_document]
    cardinality: many
    created_by: scaffold

  # `builds_on` is the reading order of the series, added in 5.0.0 when the
  # number went (HW-DR-0117). A part names the parts that a reader must have
  # read first. The family is `derivation` and the nucleus is `to`, so the
  # part built on governs the reading: `by_precedence` puts it before the part
  # that builds on it, in a routing result, in a shelf index and in any
  # projection that orders by precedence. The shape is the one
  # `relations.elaborates` has in the brd-prd entry, with no inverse and no
  # reciprocity, because the part built on owes nothing to the parts that
  # follow it. A person types each edge, so the creator is the author.
  relations.builds_on:
    family: derivation
    from: [design_spec, decision_register, obligation_register]
    to:   [design_spec, decision_register, obligation_register]
    nuclearity: nucleus-satellite
    nucleus: to
    cardinality: many
    created_by: author

  # --- shelves --------------------------------------------------------------

  shelves.spec_series:
    title: The specification series
    path: docs/spec/**
    homogeneous: false
    discriminator: doc_type
    kinds: [design_spec, decision_register, obligation_register]
    # `{slug}` takes the slug of the title. Through 4.x the layout was
    # `{sequence:02d}-{slug}.md`, and HW-DR-0117 records why it went.
    layout: "{slug}.md"

  # `shelves.evaluations` moved to evidence-and-obligation with `evaluation`.

  shelves.reviews:
    title: Review records
    path: docs/reviews/**
    homogeneous: false
    discriminator: doc_type
    kinds: [review_prompt, review_record]
