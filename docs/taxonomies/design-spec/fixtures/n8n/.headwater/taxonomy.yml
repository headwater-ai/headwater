# SPDX-License-Identifier: Apache-2.0
#
# The consumer declaration for the n8n worked-instance corpus. It is not read
# from here: `headwater check` reads one corpus root, and this tree sits inside
# a directory that this repository excludes from its own corpus. `README.md`
# beside this directory states the three commands that assemble a scratch root
# out of this file, `overlay.yml`, `.headwater/packages/headwater-standard/` and
# `corpus/packages/@n8n/`.
#
# `corpus.root` is `packages` and not `docs`, because n8n keeps its governed
# prose beside the code it governs and has no docs root that carries any. That
# is the whole subject of the run this fixture records.

taxonomy:
  package: headwater/standard
  version: 4.3.1
  bundles: [design-spec, evidence-and-obligation]
  overlay: .headwater/overlay.yml

# No exclusion, and the reason it is gone is the finding. This fixture was
# forced into `exclude: packages/headwater-standard/**` because a taxonomy
# package was found under `packages/` and n8n's governed prose is under
# `packages/` too: a corpus root that reached the second reached the first, so
# the run had to be told that the package it resolves is not corpus content.
# [HW-DR-0064](../../../../../decisions/0064-the-vendored-package-root-moves-under-headwater-and-the-old-root-is-named-in-a-refusal.md)
# moved the package root under `.headwater/`, which is outside every corpus
# root an adopter can name, and the collision went with it. This is the one
# corpus in this repository that measured the cost of the old root.
corpus:
  root: packages
