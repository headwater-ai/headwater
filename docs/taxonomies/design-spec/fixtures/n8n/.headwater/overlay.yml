#
# The overlay the n8n corpus needs, and every line of it is a measurement.
#
# The design-spec entry declares one shelf, `spec_series`, at `docs/spec/**`.
# No file of this corpus is under `docs/`, so the entry as it ships claims none
# of them: the recorded run with this overlay reduced to its first line reports
# 4 untyped, 0 checked and 1 finding, and `headwater check --strict` exits 1.
# The one finding is `link.path.unresolved`, which from 4.3.0 reads the corpus
# rather than the typed set. That arm reported 0 findings and exited 0 until
# then, and the README records what the move does and does not mean.
# The shelf below is what a scattered corpus costs.
#
# It is heterogeneous with one admitted kind, which reads as a contradiction
# and is the only shape that resolves. `kinds.design_spec` requires the facet
# `doc_type`, because the entry's own shelf is heterogeneous. A homogeneous
# shelf refuses a document that restates the kind its placement already states,
# under `shelf.placement_is_primary`. So a `design_spec` on a homogeneous shelf
# reports an error either way: omit `doc_type` and `facet.required.missing`
# fires, declare it and `shelf.placement_is_primary` fires. The fixture README
# records both arms. A heterogeneous shelf whose `kinds` list holds one entry
# makes the discriminator carry no information, and that is the price.
#
# `packages/**` and not `packages/**/ARCHITECTURE.md`. The narrow pattern is
# legal and it claims two of the four files, because two of them are named
# `architecture.md` and `ARCHITECTURE_CONNECTION_VS_SETTINGS.md`. The two it
# misses go untyped, no rule runs over them, and they report nothing at all.

add:

  # The base leaves `decision_id` without a namespace, so a consumer declares
  # one or `taxonomy validate` refuses the scheme. No document here is a
  # decision, and the scheme still has to be complete.
  identifier_schemes.decision_id.namespace: N8N

  shelves.package_architecture:
    path: packages/**
    homogeneous: false
    discriminator: doc_type
    kinds: [design_spec]
